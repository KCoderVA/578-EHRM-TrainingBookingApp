                          //Set(varStudentMgrProfile, First(Office365Users.SearchUserV2({searchTerm: varStudentMgrMail}).value));
                          Set(varStudentMgrProfile, IfError(Office365Users.ManagerV2(varStudentProfile.Id), Blank()));

                          Reset(DataCardValue7);
                          Reset(DataCardValue8);
                          Reset(DropdownCanvas1);
                          Set(varTargetEmail, Self.Selected.Email);
                          Set(varTargetEntraID, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value).Id);
