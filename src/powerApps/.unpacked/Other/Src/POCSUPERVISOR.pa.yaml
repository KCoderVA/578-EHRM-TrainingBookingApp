                              !IsBlankOrError(varStudentProfile.Department) & IsBlankOrError(varStudentProfile.OfficeLocation),
                                  //then
                                  Concatenate(DataCardValue3.Selected.Department, "; "),
                              IsBlankOrError(varStudentProfile.Department) & !IsBlankOrError(varStudentProfile.OfficeLocation),
                                  Concatenate(varStudentProfile.OfficeLocation, "; "),
                              !IsBlankOrError(varStudentProfile.Department) & !IsBlankOrError(varStudentProfile.OfficeLocation),
