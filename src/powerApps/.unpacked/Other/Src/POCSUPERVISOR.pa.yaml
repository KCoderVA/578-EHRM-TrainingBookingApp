                              Claims: "i:0#.f|membership|" & Office365Users.UserProfileV2(varTargetEntraID).displayName,
                              DisplayName: Office365Users.UserProfileV2(varTargetEntraID).displayName,
                              Email: Office365Users.UserProfileV2(varTargetEntraID).mail,
                              ID: Office365Users.UserProfileV2(varTargetEntraID).id
                          };
                          Set(varUser_details, Office365Users.UserProfileV2(varTargetEmail));
                          ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));
                          If(
                              LookUp(
                                  SuperUserList,
                                  Lower(DataCardValue3.Selected.Email) = Lower('Enter Super User VA email address'),
                                  true
                              ) = true,
                              Set(user_IsSuperUser, true),
                              Set(user_IsSuperUser, false)
                          );
                          Set(var_Service, DataCardValue8.Text);
                          Set(var_ManagerEmail, DataCardValue7.Selected.Email);
                        OnSelect: |-
                          =Set(var_Attendees, Self.Selected.Email);
                          Set(_selectedUser, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value));
                          Set(varStudentProfile, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value));
                          Set(varStudentMgrMail, Office365Users.ManagerV2(varStudentProfile.Id).userPrincipalName);
                          Set(varStudentMgrProfile, First(Office365Users.SearchUserV2({searchTerm: varStudentMgrMail}).value));
                          Reset(DataCardValue7);
                          Reset(DataCardValue8);
                          Reset(DropdownCanvas1);
                          Set(varTargetEmail, Self.Selected.Email);
                          Set(varTargetEntraID, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value).Id);
                          {
                              Claims: "i:0#.f|membership|" & Office365Users.UserProfileV2(varTargetEntraID).displayName,
                              DisplayName: Office365Users.UserProfileV2(varTargetEntraID).displayName,
                              Email: Office365Users.UserProfileV2(varTargetEntraID).mail,
                              ID: Office365Users.UserProfileV2(varTargetEntraID).id
                          };
                          Set(varUser_details, Office365Users.UserProfileV2(varTargetEmail));
                          ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));
                          If(
                              LookUp(
                                  SuperUserList,
                                  Lower(DataCardValue3.Selected.Email) = Lower('Enter Super User VA email address'),
                                  true
                              ) = true,
                              Set(user_IsSuperUser, true),
                              Set(user_IsSuperUser, false)
                          );
                          Set(var_Service, DataCardValue8.Text);
                          Set(var_ManagerEmail, DataCardValue7.Selected.Email);
                        PaddingBottom: =5
                        PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                        PaddingRight: =5
                        PaddingTop: =5
                        SearchFields: =["Claims"]
                        SelectMultiple: =false
                        Size: =14
                        Tooltip: =Parent.DisplayName
                        Width: =508
                        X: =35
                        Y: =DataCardKey3.Y + DataCardKey3.Height + 5
            - Manager_DataCard1:
