Screens:
  POCSUPERVISOR:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =If(
            varPopUp_ClassPicker = 0 || IsBlankOrError(varPopUp_ClassPicker),
                Concurrent(
                    Set(varPopUp_ClassPicker, 0),
                    Set(varPopUp_ClassPicker_scenario, Blank()),
                    Set(varPopUp_ClassPicker_scenarioName, Blank()),
                    Set(varPopUp_ClassPicker_scenarioSplit, Blank()),
                    Set(varPopUp_ClassPicker_scenarioRole, Blank()),
                    Set(varPopUp_ClassPicker_scenarioDateTime, Blank()),
                    Set(varPopUp_ClassPicker_scenarioDate, Blank()),
                    Set(varPopUp_ClassPicker_scenarioDayOfWeek, Blank()),
                    Set(varPopUp_ClassPicker_scenarioStartTime, Blank()),
                    Set(varPopUp_ClassPicker_scenarioEndTime, Blank()),
                    Set(varPopUp_ClassPicker_scenarioLocation, Blank()),
                    Reset(dropdown_ScenarioPicker),
                    Reset(dropdown_RolePicker),
                    Reset(dropdown_DateTimePicker),
                    Reset(dropdown_LocationPicker)
                ),
            varPopUp_ClassPicker = 1 || !IsBlankOrError(varPopUp_ClassPicker),
                Concurrent(
                    Set(varPopUp_ClassPicker, 1),
                    Set(varPopUp_ClassPicker_scenario, dropdown_ScenarioPicker.Selected.Value),
                    Set(varPopUp_ClassPicker_scenarioName, Text(dropdown_ScenarioPicker.Selected.Value)),
                    Set(varPopUp_ClassPicker_scenarioSplit, Substitute(Text(dropdown_ScenarioPicker.Selected.Value), " ", "%20")),
                    Set(varPopUp_ClassPicker_scenarioRole, dropdown_RolePicker.Selected.Value),
                    Set(varPopUp_ClassPicker_scenarioDateTime, dropdown_DateTimePicker.Selected.Value),
                    With(
                        {
                            DatePart: Match(dropdown_DateTimePicker.Selected.Value, "\d{2}/\d{2}/\d{4}").FullMatch,
                            StartTimePart: Match(dropdown_DateTimePicker.Selected.Value, "\d{1,2}:\d{2} [APM]{2}").FullMatch,
                            EndTimePart: Last(MatchAll(dropdown_DateTimePicker.Selected.Value, "\d{1,2}:\d{2} [APM]{2}")).FullMatch,
                            StartTimeDay24h: Last(MatchAll(dropdown_DateTimePicker.Selected.Value, "[APM]{2}")).FullMatch,
                            EndTimeDay24h: Last(MatchAll(dropdown_DateTimePicker.Selected.Value, "[APM]{2}")).FullMatch
                        },
                        Concurrent(
                            Set(varPopUp_ClassPicker_scenarioDate,
                                Date(
                                    Year(DatePart),
                                    Month(DatePart),
                                    Day(DatePart)
                                )
                            ),
                            Set(varPopUp_ClassPicker_scenarioStartTime,
                                Time(
                                    Hour(StartTimePart),
                                    Minute(StartTimePart),
                                    Second(0)
                                )
                            ),
                            Set(varPopUp_ClassPicker_scenarioStart24,StartTimeDay24h),
                            Set(varPopUp_ClassPicker_scenarioEndTime,
                                Time(
                                    Hour(EndTimePart),
                                    Minute(EndTimePart),
                                    Second(0)
                                )
                            ),
                            Set(varPopUp_ClassPicker_scenarioEnd24,EndTimeDay24h),
                            Set(varPopUp_ClassPicker_scenarioDayOfWeek, First(Split(dropdown_DateTimePicker.Selected.Value, " ")).Value)
                        )
                    ),
                    Set(varPopUp_ClassPicker_scenarioLocation, dropdown_LocationPicker.Selected.Value)
                )
        );
        If(
            LookUp(
                SuperUserList,
                Lower(DataCardValue3.Selected.Email) = Lower('Enter Super User VA email address'), true) = true,
            Set(user_IsSuperUser, true),
            LookUp(
                SuperUserList,
                Lower(DataCardValue3.Selected.Email) = Lower('Enter Super User VA email address'), true) <> true,
            Set(user_IsSuperUser, false)
        );

        Set(varStudentProfile, First(Office365Users.SearchUserV2({searchTerm: DataCardValue3.Selected.Email}).value));
        Set(varStudentMgrMail, Office365Users.ManagerV2(DataCardValue3.Selected.Email).userPrincipalName);
        //Set(varStudentMgrProfile, First(Office365Users.SearchUserV2({searchTerm: Office365Users.ManagerV2(DataCardValue3.Selected.Email).userPrincipalName}).value));
        Set(varStudentMgrProfile, IfError(Office365Users.ManagerV2(varTargetEntraID), Blank()));
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Rectangle2_11:
          Control: Rectangle@2.3.0
          Group: grpHeader_11
          Properties:
            Fill: =RGBA(135, 78, 181, 0.65)
            Height: =ctn_PopUp_ClassPicker_Header.Height
            Width: =Parent.Width
      - Image2_12:
          Control: Image@2.2.3
          Group: grpHeader_11
          Properties:
            Height: =ctn_PopUp_ClassPicker_Header.Height
            Image: =abstractBackground
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - rectButtonsBackground:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(180, 214, 250, 1)
            Height: =80
            Width: =Parent.Width
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =Parent.Height - Self.Height
      - lblPOCSUPER_missingRequired:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(168, 0, 0, 1)
            FontWeight: =FontWeight.Bold
            Height: =104
            Text: |-
              ="Fields marked with an asterisk ( * ) are required to be filled out.
              You may not proceed until you provide an answer to all required questions!"
            Visible: |-
              =If(
                  btnPOCSUPER_continue.DisplayMode = DisplayMode.Disabled,
                  true,
                  false
              )
            Width: =1136
            Y: =rectButtonsBackground.Y - Self.Height
      - btnPOCSUPER_continue:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =5
            DisplayMode: |-
              =If(
                  DropdownCanvas1.Selected.Value = Blank() || IsBlank(var_MeetingCategory),
                      DisplayMode.Disabled,
                  DropdownCanvas1.Selected.Value <> Blank() && var_MeetingCategory <> Blank(),
                      DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(15, 108, 189, 1)
            FontWeight: =FontWeight.Bold
            Height: =btnPOCSUPER_back.Height
            HoverBorderColor: =RGBA(255, 255, 255, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(9, 33, 98, 1)
            OnSelect: |-
              =If(
                  (user_IsSuperUser = true && !IsBlankOrError(user_IsSuperUser)),
                      Set(var_PopUp_SuperUser, false) && Set(varPopUp_ClassPicker, 1),
                  (user_IsSuperUser = false || IsBlankOrError(user_IsSuperUser)),
                      Set(var_PopUp_SuperUser, true)
              );
            Size: |-
              =If(
                  btnPOCSUPER_continue.DisplayMode = DisplayMode.Disabled,
                  16,
                  24
              )
            Text: |-
              =If(
                  btnPOCSUPER_continue.DisplayMode = DisplayMode.Disabled,
                  "Response Missing",
                  "CONTINUE"
              )
            Tooltip: =If(Self.DisplayMode = DisplayMode.Disabled, "You have not completed all required fields.")
            Width: =200
            X: =btnPOCSUPER_back.X + btnPOCSUPER_back.Width + 20
            Y: =btnPOCSUPER_back.Y
      - btnPOCSUPER_back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =5
            Fill: =RGBA(128, 128, 128, 1)
            Height: =50
            HoverBorderColor: =RGBA(255, 255, 255, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(9, 33, 98, 1)
            OnSelect: |-
              =/*
              Reset(tbFloorDesk);
              Reset(tbNameDesk);
              Reset(toggleActive);
              Reset(tbDescrDesk);
              Reset(tbMapDesk);
              Reset(tbDeskLocation_2);
              Reset(tbRoomPhoto);
              Reset(ddAsset) ;Back()
              */
              ResetForm(Form1);
              Navigate(Dashboard);
            Text: ="Back"
            Width: =200
            X: =(Parent.Width - (Self.Width + 20 + btnPOCSUPER_continue.Width)) / 2
            Y: =rectButtonsBackground.Y + (Self.Height / 3)
      - Form1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: ='Desk Reservations'
            DefaultMode: =FormMode.New
            Height: |-
              =If(
                  lblPOCSUPER_missingRequired.Visible = true,
                      Parent.Height - Self.Y - (rectButtonsBackground.Height + lblPOCSUPER_missingRequired.Height),
                  lblPOCSUPER_missingRequired.Visible = false,
                      Parent.Height - Self.Y - (rectButtonsBackground.Height), //476.66
                  'Reserved By_DataCard1'.Height + Service_DataCard1.Height + Description_DataCard2.Height //499
                  //Parent.Height - Self.Y - rectButtonsBackground.Height - lblPOCSUPER_missingRequired.Height
              )
            NumberOfColumns: =2
            Width: =1136
            Y: =Image2_12.Y + Image2_12.Height
          Children:
