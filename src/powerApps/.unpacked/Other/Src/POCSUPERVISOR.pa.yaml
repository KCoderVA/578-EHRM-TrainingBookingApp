                          =Set(var_Attendees, Self.Selected.Email);
                          Set(_selectedUser, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value));
                          Set(varStudentProfile, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Email}).value));
