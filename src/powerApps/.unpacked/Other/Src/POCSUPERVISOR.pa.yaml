                        OnSelect: "=Set(var_reservationRole, dropdown_RolePicker.Selected.Value);\nSet(var_reservationScenario, dropdown_ScenarioPicker.Selected.Value);\nIf(\n    (IsBlankOrError(dropdown_ScenarioPicker.Selected) || dropdown_ScenarioPicker.Selected.Value = Blank()),\n    Set(var_scenarioTrainingMaterialsURL, \"https://dvagov.sharepoint.com/sites/vacoehrmioeue/Sandbox/LearningLabsDocs/Forms/AllItems.aspx\"),\n    Set(var_scenarioTrainingMaterialsURL, \n        Concatenate(\n            \"https://dvagov.sharepoint.com/sites/vacoehrmioeue/Sandbox/LearningLabsDocs/Forms/AllItems.aspx?FilterField1=Doc%5Fx0020%5FType&FilterValue1=Workbook&FilterType1=Choice&FilterField2=Scenario&FilterValue2=\",\n            var_reservationScenario,\n            \"&FilterType2=Lookup&viewid=ed6d1443%2D71a4%2D4766%2D9b9d%2D1c0314570603\"\n        )\n    )\n);\nSet(varPopUp_ClassPicker_scenarioLocation, dropdown_LocationPicker.Selected.Value);\nSet(var_reservationFullLocation, dropdown_LocationPicker.Selected.Value);\nIf(\n    (Len(dropdown_LocationPicker.Selected.Value) >= 14),\n        Set(\n            var_reservationBuildingNumber,\n            Text(\n                First(\n                    Filter(\n                        Split(\n                            dropdown_LocationPicker.Selected.Value,\n                            \" \"\n                        ),\n                        IsNumeric(Value)\n                    )\n                ).Value\n            )\n            \n        );\n        Set(\n            var_reservationRoomNumber,\n            Text(\n                Last(\n                    Filter(\n                        Split(\n                            dropdown_LocationPicker.Selected.Value,\n                            \" \"\n                            ),\n                            IsNumeric(Value)\n                    )\n                ).Value\n            )\n        ),\n    (Len(dropdown_LocationPicker.Selected.Value) <= 13),\n        Set(var_reservationRoomNumber, \"Virtual\"),\n    (Len(dropdown_LocationPicker.Selected.Value) <= 8),\n        Set(var_reservationBuildingNumber, \"Virtual\")\n);\nSet(var_Attendees, Concat(DataCardValue3.SelectedItems, Email, \";\"));\nSet(var_OptionalAttendees, Concat(DataCardValue7.SelectedItems, Email, \";\"));\n\n\n\n// 1. Set global variables\nSet(varAttendees, Concat(DataCardValue3.SelectedItems, Email, \";\")); //e.g. \"First1.Last1@va.gov;\"\nSet(varOptionalAttendees, Concat(DataCardValue7.SelectedItems, Email, \";\")); //e.g. \"First2.Last2@va.gov;\"\nSet(varMeetCat, DropdownCanvas1.Selected.Value);  //e.g. \"Super User Learning Lab\"\nSet(varReservePOC, DataCardValue7.Selected.Email); //e.g. \"First2.Last2@va.gov;\"\nSet(varTitle, \"Hines EHRM Training Room & Desk Reservation\"); //DataCardValue8.Text); // TBService\nSet(varDescription, DataCardValue1.Text); // RDReason \nSet(\n    varEmailBody,\n    \"You have a confirmed reservation for EHRM Learning Lab training at the Edward Hines Jr. VA Hospital!\n    <br>\n         <br>Scenario:          \" & varPopUp_ClassPicker_scenarioName &\n        \"<br>Role:              \" & varPopUp_ClassPicker_scenarioRole &\n        \"<br>Date:              \" & varPopUp_ClassPicker_scenarioDate &\n        \"<br>Date:              \" & varPopUp_ClassPicker_scenarioStartTime &\n        \"<br>Location:          \" & varPopUp_ClassPicker_scenarioLocation &\n    \"<br>\n    <br>\n    Please follow this Link to view or cancel your EHRM Training reservations: \n    <br>\n    https://apps.gov.powerapps.us/play/e/default-e95f1b23-abaf-45ee-821d-b7ab251ab3bf/a/d0958d55-fe85-425c-83f6-03c659bf4079<br>\n    <i>***FOLLOW THE LINK ABOVE and then Click on My Bookings or Click the BLUE button to see your Training Calander for your RESERVATION(s) THAT HAS BEEN SCHEDULED***<i>\n    <br>\"\n);\nSet(varURL,\"https://apps.gov.powerapps.us/play/e/default-e95f1b23-abaf-45ee-821d-b7ab251ab3bf/a/d0958d55-fe85-425c-83f6-03c659bf4079\"\n);\nSet(varURLName, \"578 EHRM Training App\");\nSet(varPopUp_ClassPicker, 1);\n\nIf(varAccept3,\n    Set(varAccept3, false);\n    Set(varAccept4, false),\n    If(varAccept4,\n        Set(varAccept4, false)\n    )\n);\n\n//Navigate(Confirm)\nNavigate(chkWeekDays)"
