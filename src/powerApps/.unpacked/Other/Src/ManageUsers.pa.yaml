              // ============================================================
              // 2. Find the target user's existing record (if any)
              // ============================================================
                  Set(
                      varDeskAccessControl_record,
                      LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
                  );
                  Set(varUserExists, !IsBlank(varDeskAccessControl_record));

              // ============================================================
              // 3. If missing, add them as default "User", then re-lookup.
              //    Only ever writes for the REAL user (never while impersonating,
              //    which at OnStart is always the case, but guarded for safety).
              // ============================================================
                  If(
                      !varUserExists && Lower(varTargetEmail) = Lower(varRealEmail),
                      Patch(
                          DeskAccessControl,
                          Defaults(DeskAccessControl),
                          {
                              Email_Text: varTargetEmail,
                              AccessLevel_Text: "User",
                              AccessLevel_Choice: { Value: "User" },
