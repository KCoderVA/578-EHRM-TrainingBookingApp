      - btnConfirm_2:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(15, 108, 189, 1)
            Height: =45
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: "=// ———————————————————————————————————————————————————————————————————————————————————————————————————————\n// 1) Save item(s) to Outlook\nOffice365Outlook.V4CalendarPostItem(\n    LookUp(Office365Outlook.CalendarGetTables().value, DisplayName = \"Calendar\").Name, // current user's Outlook Calendar\n    //Subject\n        Concatenate(\n            \"EHRM Learning Lab Scenario - \",\n            var_reservationScenario //varTitle\n        ),\n    //Start Date/Time\n        varEventStartTime,\n    //End Date/Time\n        varEventEndTime,\n    //Event Timezone\n    \"(UTC-06:00) Central Time\",\n    //Main properties\n        {\n                requiredAttendees: var_Attendees, //varAttendees,\n                //optionalAttendees: varOptionalAttendees,\n                body: varEmailBody,\n                categories: varMeetCat,      \n                location: varSelectedDesk.CombinedLocationDetails_multilinePlainText, // Need proper value\n                importance: varImportance, // low, normal, high\n                isAllDay: false, // true if all day\n                recurrence: varRecurrence, // \"weekly\", \"daily\", etc.\n                selectedDaysOfWeek: varWeekday,\n                recurrenceEnd: Text(DateValue(varEndDate), \"yyyy-mm-dd\"), // \"2025-06-08\"\n                numberOfOccurences: Value(recurPeriodTxt.Text), // integer\n                reminderMinutesBeforeStart: varReminder, // integer\n                isReminderOn: If(varReminder > 0, true, false), // or false\n                showAs: \"busy\", // free, tentative, busy, oof, workingElsewhere, unknown\n                responseRequested: true, // or true for RSVP\n                sensitivity: \"normal\" // normal, personal, private, confidential\n        }\n);\n//////////////////////////////////////////////////////////////////////////////////////////////\n// ——————————————————————————————————————————————\n// 2) Patch to SharePoint list, For each recurrence date…\nForAll(\n    CollectionRecurrence As rec,\n    // …and each selected desk…\n    ForAll(\n        colSelectedDesks As desk,\n    // ——— (Optional) send the invite ———\n        \n        // ——— Patch the SharePoint list ———\n        Patch(\n            'Desk Reservations',\n            Defaults('Desk Reservations'),\n            {\n                // New Columns:\n                Title: var_Attendees & \" – \" &  var_MeetingCategory & \" - \" & var_reservationScenario & \" (\" & var_reservationRole & \")\",\n                submitterName_text: Office365Users.MyProfileV2().displayName,\n                submitterEmail_text: Lower(Office365Users.MyProfileV2().mail),\n                submitterService_text: Office365Users.MyProfileV2().department & \" - \" &Office365Users.MyProfileV2().companyName,\n                studentName_text: Office365Users.UserProfileV2(var_Attendees).displayName,\n                studentEmail_text: Lower(Office365Users.UserProfileV2(var_Attendees).mail),\n                studentService_text: var_Service,\n                studentTitle_text: Office365Users.UserProfileV2(var_Attendees).jobTitle,\n                studentManagerEmail_text: Lower(Office365Users.ManagerV2(var_Attendees).mail),\n                reservationRole_text: var_reservationRole,\n                reservationScenario_text: var_reservationScenario,\n                reservationStart_datetime: varEventStartTime,\n                reservationEnd_datetime: varEventEndTime,\n                reservationDesk_text: Blank(),\n                reservationRoom_text: \"Room #\" & var_reservationRoomNumber,\n                reservationFloor_text: \"Floor #\" & var_reservationFloorNumber,\n                reservationBuilding_text: \"Building #\" & var_reservationBuildingNumber,\n                reservationDivision_text: var_reservationDivision,\n                reservationAgreementBody_multilinetext: var_reservationAgreementBody,\n                reservationDescription_multilinetext: var_reservationScenario & \" (\" & var_reservationRole & \")\",\n                reservationComments_multilinetext: Blank(),\n                reservationInviteBody_multilinetext: varEmailBody,\n                reservationInviteOptionalAttendees_multilinetext: var_OptionalAttendees,\n\n                // OLD Columns:\n                //'Reserved By': Office365Users.MyProfileV2().displayName,\n                MeetingCategory: var_MeetingCategory,\n                DeskText: var_reservationScenario & \" (\" & var_reservationRole & \")\",\n                Description: var_reservationScenario & \" (\" & var_reservationRole & \")\",\n                //OptionalAttendees: var_OptionalAttendees,\n                //Active_choice: true,\n                'Check Out To': varEventEndTime,\n                'Check Out From': varEventStartTime,\n                'Check Out To Text': Text(var_EndTime),\n                'Check Out From Text': Text(var_StartTime),\n                //'Check Out To Number': Value(var_EndTime)\n                //'Check Out From Number': Value(var_StartTime),\n                Service: var_Service,\n                RoomReservation: true,\n                //Manager: Lower(Office365Users.UserProfileV2(var_ManagerEmail).mail),\n                //Asset: \"Desk\",\n                //RecurrenceFrequency: varRecurrence,\n                RecurrenceEndDate: Blank(),\n                RecurrenceID: varRecurrenceID,\n                RecurrenceDayName: Blank(),\n                RecurrenceTimes: Blank(),\n                RecurrencePattern: Blank(),\n                IsRecurring: true,\n                OutlookEventID: Blank(),\n                OutlookSeriesID: Blank(),\n                ParentReservationID: Blank()\n            }\n        )   \n    )\n);\n\n\n// ——————————————————————————————————————————————\n// 3) Clean up & navigate\nSet(varScreenReset, true);\nSet(varScreenReset, false);\n\nConcurrent(\n    ResetForm(Form1),\n    Reset(ddImportance),\n    Reset(ddRecurrenceFrequency),\n    Reset(Calendar_1),\n    Reset(Gallery6),\n    Reset(DatePickerCanvas2),\n    Reset(Gallery3_1);\n    Clear(colSelectedDesks),\n    Clear(CollectionRecurrence),\n    Clear(colDeskChckRecur),\n    Clear(colCombinedRecurrence),\n    Clear(wkDays),\n    Clear(wkDaysTemp)\n);\n\nNavigate(Success)"
            Text: ="SUBMIT!"
            Underline: =true
            Visible: =!varAccept3 And !varAccept4
            Width: =200
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height - Self.Height - 50
