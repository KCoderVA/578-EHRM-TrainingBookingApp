                Properties:
                  Height: =20
                  Text: =ThisItem.StartDateTime
                  Width: =150
                  X: =text_Key1.X
                  Y: =text_Key1.Y + text_Key1.Height
            - text_Key3:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="Room Location & Desk Assignment"
