Screens:
  Confirm:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =ClearCollect(
            colCombinedRecurrence,
            AddColumns(
                CollectionRecurrence,
                Floor,
                First(colSelectedDesks).FloorNumber_number
            )
        );
        ClearCollect(
            col_EventCombinedDetails,
            Patch(
                First(colSelectedDesks),
                First(colCombinedRecurrence)
            )
        );
        ClearCollect(
            col_EventBuildDetails,
            Filter('Desk Reservations', false)
        );

        // Get the highest RecurrenceID in the list (returns blank if none exist)
        Set(
            varRecurrenceID,
            Coalesce(
                Max(
                    'Desk Reservations',
                    Value(RecurrenceID)
                ) + 1,
                1
            )
        )
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Gallery3_1:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =(text_Value3.Height + text_Value3.Y + 50)
            Items: |-
              =//CollectionRecurrence
              colCombinedRecurrence
            TemplateSize: =250
            Visible: =!varAccept3 And !varAccept4
            Width: =800
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =lblReview_1.Y + lblReview_1.Height + 10
