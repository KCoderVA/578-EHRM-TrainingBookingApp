                  X: =text_Key2.X + text_Key2.Width
                  Y: =text_Key2.Y
            - text_Key2:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="End Date/Time"
                  Visible: =!varAccept3 And !varAccept4
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key1.Width
