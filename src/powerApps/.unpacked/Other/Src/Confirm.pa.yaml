                    )
                  Width: |+
                    =btnPatchDetailedMainList.Width
                  X: =btnPatchSimpleBackupList.X + btnPatchSimpleBackupList.Width + 10
                  Y: =Parent.Height - Self.Height - 10
            - btnPatchSimpleBackupList:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =RGBA(15, 108, 189, 1)
                  Height: =btnPatchDetailedMainList.Height
                  HoverFill: =ColorFade(Self.Fill, -20%)
                  OnSelect: |-
                    =// ———————————————————————————————————————————————————————————————
                    // Step 0) Reset all flags + result collections.
                    //Set(varCalendarOK, false );
                    //Set(varMainOK, false );
                    // full 48-col Patch succeeded (all rows)
                    //Set(varMainSimpleOK, false );
                    // simplified fallback Patch succeeded (all rows)
                    Set(
                        varBackupSimpleOK,
                        false
                    );
