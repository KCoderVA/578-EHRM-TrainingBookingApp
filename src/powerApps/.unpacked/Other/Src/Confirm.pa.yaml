Screens:
  Confirm:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =ClearCollect(
            colCombinedRecurrence,
            AddColumns(
                CollectionRecurrence,
                Floor,
                First(colSelectedDesks).Title
            )
        );
        // Get the highest RecurrenceID in the list (returns blank if none exist)
        Set(
            varRecurrenceID,
            Coalesce(
                Max(
                    'Desk Reservations',
                    Value(RecurrenceID)
                ) + 1,
                1
            )
        )
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Gallery3_1:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =text_Value3.Height + text_Value3.Y + 50
            Items: |-
              =//CollectionRecurrence
              colCombinedRecurrence
            TemplateSize: =200
            Visible: =!varAccept3 And !varAccept4
            Width: =800
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =lblReview_1.Y + lblReview_1.Height + 10
          Children:
            - Rectangle12:
                Control: Rectangle@2.3.0
                Properties:
                  Height: =0
                  OnSelect: =Select(Parent)
                  Width: =537
                  Y: =Gallery3_1.TemplateHeight
            - text_Value7:
                Control: Text@0.0.51
                Properties:
                  Height: =20
                  Text: =varPopUp_ClassPicker_scenarioLocation
                  Width: =text_Key7.Width
                  X: =text_Key7.X
                  Y: =text_Key7.Y + text_Key7.Height
            - text_Key7:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="Scenario Location"
                  Visible: =!varAccept3 And !varAccept4
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key1.Width * 2
                  X: =text_Value6.X
                  Y: =text_Value6.Y + text_Value6.Height + 10
            - text_Value6:
                Control: Text@0.0.51
                Properties:
                  Height: =20
                  Text: =varPopUp_ClassPicker_scenarioRole
                  Width: =text_Key6.Width
                  X: =text_Key6.X
                  Y: =text_Key6.Y + text_Key6.Height
            - text_Key6:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="Scenario Name"
                  Visible: =!varAccept3 And !varAccept4
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key1.Width * 2
                  X: =text_Value1.X
                  Y: =text_Value4.Y + text_Value4.Height + 10
            - text_Value5:
                Control: Text@0.0.51
                Properties:
                  Height: =20
                  Text: =varPopUp_ClassPicker_scenarioName
                  Visible: =false
                  Width: =text_Key5.Width
                  X: =text_Key5.X
                  Y: =text_Key5.Y + text_Key5.Height
            - text_Value4:
                Control: Text@0.0.51
                Properties:
                  Height: =20
                  Text: =varPopUp_ClassPicker_scenarioName
                  Width: =text_Key4.Width
                  X: =text_Key4.X
                  Y: =text_Key4.Y + text_Key4.Height
            - text_Key5:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="End Date/Time"
                  Visible: =false
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key4.Width
                  X: =text_Key4.X + text_Key4.Width
                  Y: =text_Key4.Y
            - text_Key4:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  Height: =20
                  Text: ="Scenario Name"
                  Visible: =!varAccept3 And !varAccept4
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key1.Width * 2
                  X: =text_Value1.X
