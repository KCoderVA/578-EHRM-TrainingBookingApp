Screens:
  Confirm:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =// ———————————————————————————————————————————————————————————————
        // 0) Pre-compute fragile lookups ONCE, safely.
        Set(varMyProfile, IfError(Office365Users.MyProfileV2(), Blank()));
        Set(varStudentProfile, IfError(Office365Users.UserProfileV2(var_Attendees), Blank()));
        Set(varStudentMgrMail, IfError(Lower(Office365Users.ManagerV2(var_Attendees).mail), Blank()));
        Set(varStudentMgrProfile, IfError(Office365Users.ManagerV2(varTargetEntraID), Blank()));

        ClearCollect(
            colCombinedRecurrence,
            AddColumns(
                CollectionRecurrence,
                Floor,
                If(
                    !IsBlankOrError(First(colSelectedDesks).FloorNumber_number),
                        First(colSelectedDesks).FloorNumber_number,
                        //Value(var_reservationFloorNumber),
                    IsBlankOrError(var_reservationFloorNumber),
                        Value("2"),
                    First(colSelectedDesks).FloorNumber_number
                    )
            )
        );
        ClearCollect(
            col_EventCombinedDetails,
            Patch(
                First(colSelectedDesks),
                First(colCombinedRecurrence)
            )
        );
        ClearCollect(
            col_EventBuildDetails,
            Filter('Desk Reservations', false)
        );

        // Get the highest RecurrenceID in the list (returns blank if none exist)
        Set(
            varRecurrenceID,
            Coalesce(
                Max(
                    'Desk Reservations',
                    Value(RecurrenceID)
                ) + 1,
                1
            )
        );
        Set(varSelectedDesk, First(col_EventCombinedDetails));
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Gallery3_1:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =(btn_ContactPOC.Height + btn_ContactPOC.Y + 30)
            Items: |-
              =//CollectionRecurrence
              colCombinedRecurrence
            ShowScrollbar: =false
            TemplateSize: =250
            Visible: |-
              =If(
                  IsBlankOrError(varAccept3) || varAccept3 = false,
                      false,
                  IsBlankOrError(varAccept4) || varAccept4 = false,
                      false,
                  varAccept3 = true && varAccept4 = true,
                      true,
                  false
              )
            Width: =800
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =lblReview_1.Y + lblReview_1.Height + 10
          Children:
            - text_Value7:
                Control: Text@0.0.51
                Properties:
                  Height: =25
                  Size: =18
                  Text: =var_Attendees
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key7.Width
                  X: |+
                    =textKey_Date.X + 5
                  Y: =text_Key7.Y + text_Key7.Height
            - text_Key7:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Selected EMPLOYEE:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =text_Key4.Width
                  X: =textKey_Date.X
                  Y: =text_Value6.Y + text_Value6.Height + 10
            - btn_SelectedEmployee:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Transparent
                  Height: =text_Key7.Height + text_Value7.Height
                  OnSelect: |-
                    =ResetForm(Form1);
                    Navigate(POCSUPERVISOR);
                  Text: =
                  Width: =text_Key7.Width
                  X: =text_Key7.X
                  Y: =text_Key7.Y
            - text_Value6:
                Control: Text@0.0.51
                Properties:
                  Height: |-
                    =If(
                        Len(Self.Text) > 35,
                        50,
                        25
                    )
                  Size: =18
                  Text: =varPopUp_ClassPicker_scenarioRole
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key6.Width
                  X: |+
                    =textKey_Date.X + 5
                  Y: =text_Key6.Y + text_Key6.Height
            - text_Key6:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Selected ROLE:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =text_Key4.Width
                  X: =textKey_Date.X
                  Y: =text_Value4.Y + text_Value4.Height + 10
            - text_Value5:
                Control: Text@0.0.51
                Properties:
                  Height: =25
                  Size: =18
                  Text: |-
                    =If(
                        IsBlankOrError(varSelectedDesk.TrainingCoordEmail_text),
                        "VHAHINInformaticsTrainingAndSupport@va.gov",
                        varSelectedDesk.TrainingCoordEmail_text
                    )
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key5.Width
                  X: =text_Key5.X
                  Y: =text_Key5.Y + text_Key5.Height
            - text_Value4:
                Control: Text@0.0.51
                Properties:
                  Height: |-
                    =If(
                        Len(Self.Text) > 35,
                        50,
                        25
                    )
                  Size: =18
                  Text: =varPopUp_ClassPicker_scenarioName
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key4.Width
                  X: |+
                    =textKey_Date.X + 5
                  Y: =text_Key4.Y + text_Key4.Height
            - text_Key5:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Training Event POINT-OF-CONTACT:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =text_Key3.Width
                  X: =text_Key4.X + text_Key4.Width
                  Y: =text_Key7.Y
            - btn_ContactPOC:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Transparent
                  Height: =text_Key5.Height + text_Value5.Height
                  OnSelect: |-
                    =Launch(
                        Concatenate(
                            "mailto:",
                            text_Value5.Text
                        ),
                        LaunchTarget.New,
                        ""
                    )
                  Text: =
                  Width: =text_Key5.Width
                  X: =text_Key5.X
                  Y: =text_Key5.Y
            - text_Key4:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Selected SCENARIO:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =textKey_Date.Width + text_Key2.Width
                  X: =textKey_Date.X
                  Y: =text_Value1.Y + text_Value1.Height + 10
            - text_Value3:
                Control: Text@0.0.51
                Properties:
                  Height: |-
                    =If(
                        IsBlankOrError(varSelectedDesk.CombinedLocationDetails_multilinePlainText),
                        150,
                        180
                    )
                  Size: =20
                  Text: |-
                    =If(
                    IsBlankOrError(varSelectedDesk.CombinedLocationDetails_multilinePlainText),
                    ("Desk 1"
                    & ",
                    " &
                    "Room " & var_reservationRoomNumber
                    & ",
                    " &
                    "Floor " & var_reservationFloorNumber
                    & ",
                    " &
                    "Building " & var_reservationBuildingNumber
                    & ",
                    " &
                    var_reservationDivision),
                    varSelectedDesk.CombinedLocationDetails_multilinePlainText
                    )
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key3.Width
                  X: =text_Key3.X + 5
                  Y: =text_Key3.Y + text_Key3.Height
            - text_Value2:
                Control: Text@0.0.51
                Properties:
                  Height: =25
                  Size: =18
                  Text: |-
                    =//var_secondHalfTime  & " (EST)"
                    var_secondHalfTime_central & " (CST)"//
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =text_Key2.Width
                  X: |+
                    =text_Value1.X + text_Value1.Width + 5
                  Y: =text_Key2.Y + text_Key2.Height
            - text_Value1:
                Control: Text@0.0.51
                Properties:
                  Height: =25
                  Size: =18
                  Text: =var_Date //ThisItem.StartDateTime
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =textKey_Date.Width
                  X: |+
                    =textKey_Date.X + 5
                  Y: =textKey_Date.Y + textKey_Date.Height
            - text_Key3:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Training Event LOCATION DETAILS:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: |-
                    =//350
                    Parent.Width - textKey_Date.Width - text_Key2.Width - 10
                  X: =text_Key2.X + text_Key2.Width
                  Y: =text_Key2.Y
            - text_Key2:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Training TIME:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =textKey_Date.Width * 2
                  X: =textKey_Date.X + textKey_Date.Width
                  Y: =textKey_Date.Y
            - textKey_Date:
                Control: Text@0.0.51
                Properties:
                  Fill: =RGBA(180, 214, 250, 1)
                  FontItalic: =true
                  Height: =20
                  Text: ="Training DATE:"
                  Visible: =Parent.Visible
                  Weight: ='TextCanvas.Weight'.Regular
                  Width: =120
            - btn_Date:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Transparent
                  Height: |-
                    =Max(
                        (text_Value3.Y + text_Value3.Height),
                        (text_Value6.Y + text_Value6.Height)
                    )
                  OnSelect: |-
                    =Launch(
                        Concatenate(
                            "mailto:",
                            text_Value5.Text
                        ),
                        LaunchTarget.New,
                        ""
                    )
                  Text: =
                  Width: =Parent.Width - (Parent.TemplatePadding * 2)
                  X: =textKey_Date.X
                  Y: =textKey_Date.Y
      - lblReview:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Font: =Font.'Segoe UI'
            Height: =60
            Italic: =true
            LineHeight: =1
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: ="Please review your reservation details below, before sumitting..."
            Visible: |-
              =If(
                  Container2.Visible = true,
                  false,
                  Container2.Visible = false,
                  true
              )
            Width: =675
            X: =(Parent.Width - Self.Width) / 2
            Y: =150
      - Image2_4:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =abstractBackground
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - btnSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(15, 108, 189, 1)
            Height: =45
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |-
              =// ———————————————————————————————————————————————————————————————
              // Step 0) Reset all flags + result collections.
              	Set(varCalendarOK, false );
              // full 48-col main Patch succeeded (all rows)
              	Set(varMainOK, false );
              // simplified 10-col main Patch succeeded (all rows)
              	Set(varMainSimpleOK, false );
              // full 48-col backup Patch succeeded (all rows)
              	Set(varBackupOK, false );
              // simplified 10-col backup Patch succeeded (all rows)
              	Set(varBackupSimpleOK, false );
              	Set(varAllOK, false );
              // Clear success/failure collections
              	Clear(colMainFullResults);
              	Clear(colMainSimpleResults);
              	Clear(colBackupPatchResults);
              // Set email outcome flag to false
                  Set(varEmailOK, false);
              	
              // ———————————————————————————————————————————————————————————————
              // Step 1) Outlook calendar item -> varCalendarOK.
              	IfError(
              		Office365Outlook.V4CalendarPostItem(
              			LookUp(
              				Office365Outlook.CalendarGetTables().value,
              				DisplayName = "Calendar"
              			).Name,
              			Concatenate(
              				"578 EHRM Learning Lab - ",
              				var_reservationScenario
              			),
              			var_StartDateTime_central,
              			var_EndDateTime_central,
              			"Central Standard Time",
              			{
              				requiredAttendees: var_Attendees,
              				optionalAttendees: var_Attendees,
              				body: var_EmailBody,
              				categories: varMeetCat,
              				location: varSelectedDesk.CombinedLocationDetails_multilinePlainText,
              				importance: "high",
              				isAllDay: false,
              				recurrence: varRecurrence,
              				reminderMinutesBeforeStart: varReminder,
              				isReminderOn: If(
              					varReminder > 0,
              					true,
              					false
              				),
              				showAs: "busy",
              				responseRequested: true,
              				sensitivity: "normal"
              			}
              		),
              // STEP 1b) varCalendarOK = boolean outcome of the V4CalendarPostItem action.
              		Set(
              			varCalendarOK,
              			false
              		),
              		Set(
              			varCalendarOK,
              			true
              		)
              	);


              // ———————————————————————————————————————————————————————————————
              // STEP 2) Attempt MAIN FULL Patch (detailed 48 columns) for every row.
              	ForAll(
              		CollectionRecurrence As rec,
              		ForAll(
              			colSelectedDesks As desk,
              			Collect(
              				colMainFullResults,
              				{
              					ok: !IsError(
              						Patch(
              							'Desk Reservations',
              							Defaults('Desk Reservations'),
              							{
              								// New Columns:
              								Title: var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")",
              								submitterName_text: varMyProfile.displayName,
              								submitterEmail_text: Lower(varMyProfile.mail),
              								submitterService_text: var_Service,
              								studentName_text: varStudentProfile.displayName,
              								studentEmail_text: Lower(varStudentProfile.mail),
              								studentService_text: var_Service,
              								studentTitle_text: varStudentProfile.jobTitle,
              								studentManagerEmail_text: varStudentMgrMail,
              								reservationRole_text: var_reservationRole,
              								reservationScenario_text: var_reservationScenario,
              								reservationStart_datetime: var_StartDateTime_central,
              								reservationEnd_datetime: var_EndDateTime_central,
              								reservationDesk_text: "Desk " & "1",
              								reservationRoom_text: "Room " & var_reservationRoomNumber,
              								reservationFloor_text: "Floor " & var_reservationFloorNumber,
              								reservationBuilding_text: "Building " & var_reservationBuildingNumber,
              								reservationDivision_text: var_reservationDivision,
              								reservationAgreementBody_multilinetext: var_reservationAgreementBody,
              								reservationDescription_multilinetext: var_reservationScenario & " (" & var_reservationRole & ")",
              								reservationComments_multilinetext: Blank(),
              								reservationInviteBody_multilinetext: var_EmailBody,
              								reservationInviteOptionalAttendees_multilinetext: var_OptionalAttendees,

              								// OLD Columns:
              								MeetingCategory: var_MeetingCategory,
              								DeskText: var_reservationScenario & " (" & var_reservationRole & ")",
              								Description: var_reservationScenario & " (" & var_reservationRole & ")",
              								Active_choice: {Value: Text("true")},
              								'Check Out To': var_StartDateTime_central,
              								'Check Out From': var_EndDateTime_central,
              								'Check Out To Text': Text(var_EndTime_central),
              								'Check Out From Text': Text(var_StartTime_central),
              								'Check Out From Number': Value(Substitute(Substitute(Substitute(Substitute(var_StartTime_central, "PM", ""), "AM", ""), ":", ""), " ", "")),
              								'Check Out To Number': Value(Substitute(Substitute(Substitute(Substitute(var_EndTime_central, "PM", ""), "AM", ""), ":", ""), " ", "")),
              								Service: var_Service,
              								RoomReservation: true,
              								Asset: {Value: "Desk"},
              								RecurrenceFrequency: {Value: varRecurrence},
              								RecurrenceEndDate: Blank(),
              								RecurrenceID: varRecurrenceID,
              								RecurrenceDayName: If(IsBlankOrError(var_DayOfWeek), Blank(), var_DayOfWeek),
              								RecurrenceTimes: Blank(),
              								RecurrencePattern: Blank(),
              								IsRecurring: false,
              								OutlookEventID: Blank(),
              								OutlookSeriesID: Blank(),
              								ParentReservationID: Blank()
              							}
              						)
              					)
              				}
              			)
              		)
              	);
              // STEP 2b) varMainOK = boolean outcome of the FULL Patch (all rows OK).
              	Set(
              		varMainOK,
              		CountRows(colMainFullResults) > 0 And CountIf(colMainFullResults, Not(ok)) = 0
              	);
              	
              // ———————————————————————————————————————————————————————————————
              // STEP 3) If MAIN FULL Patch (step #2 & #2b) failed -> attempt SIMPLE fallback; else skip it.
              	If(
              		Not(varMainOK),
              		ForAll(
              			CollectionRecurrence As recS,
              			ForAll(
              				colSelectedDesks As deskS,
              				Collect(
              					colMainSimpleResults,
              					{
              						ok: !IsError(
              							Patch(
              								'Desk Reservations',
              								Defaults('Desk Reservations'),
              								{
              									Title: var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")",
              									submitterName_text: varMyProfile.displayName,
              									submitterEmail_text: Lower(varMyProfile.mail),
              									studentName_text: varStudentProfile.displayName,
              									studentEmail_text: Lower(varStudentProfile.mail),
              									reservationRole_text: var_reservationRole,
              									reservationScenario_text: var_reservationScenario,
              									reservationStart_datetime: var_StartDateTime_central,
              									reservationEnd_datetime: var_EndDateTime_central,
              									Active_choice: {Value: Text("true")}
              								}
              							)
              						)
              					}
              				)
              			)
              		)
              	);
              // STEP 3b) varMainSimpleOK = boolean outcome of the simple fallback action.
              	Set(
              		varMainSimpleOK,
              		CountRows(colMainSimpleResults) > 0 And CountIf(
              			colMainSimpleResults,
              			Not(ok)
              		) = 0
              	);
              	
              // ———————————————————————————————————————————————————————————————
              // STEP 4) Attempt detailed backup Patch for every colBackupPatchResults (runs regardless of main outcome)
              	ForAll(
              		CollectionRecurrence As rec,
              		ForAll(
              			colSelectedDesks As desk,
              			Collect(
              				colMainFullResults,
              				{
              					ok: !IsError(
              						Patch(
              							backupList_DeskReservations,
              							Defaults('Desk Reservations'),
              							{
              								// New Columns:
              								Title: var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")",
              								submitterName_text: varMyProfile.displayName,
              								submitterEmail_text: Lower(varMyProfile.mail),
              								submitterService_text: var_Service,
              								studentName_text: varStudentProfile.displayName,
              								studentEmail_text: Lower(varStudentProfile.mail),
              								studentService_text: var_Service,
              								studentTitle_text: varStudentProfile.jobTitle,
              								studentManagerEmail_text: varStudentMgrMail,
              								reservationRole_text: var_reservationRole,
              								reservationScenario_text: var_reservationScenario,
              								reservationStart_datetime: var_StartDateTime_central,
              								reservationEnd_datetime: var_EndDateTime_central,
              								reservationDesk_text: "Desk " & "1",
              								reservationRoom_text: "Room " & var_reservationRoomNumber,
              								reservationFloor_text: "Floor " & var_reservationFloorNumber,
              								reservationBuilding_text: "Building " & var_reservationBuildingNumber,
              								reservationDivision_text: var_reservationDivision,
              								reservationAgreementBody_multilinetext: var_reservationAgreementBody,
              								reservationDescription_multilinetext: var_reservationScenario & " (" & var_reservationRole & ")",
              								reservationComments_multilinetext: Blank(),
              								reservationInviteBody_multilinetext: var_EmailBody,
              								reservationInviteOptionalAttendees_multilinetext: var_OptionalAttendees,

              								// OLD Columns:
              								MeetingCategory: var_MeetingCategory,
              								DeskText: var_reservationScenario & " (" & var_reservationRole & ")",
              								Description: var_reservationScenario & " (" & var_reservationRole & ")",
              								Active_choice: {Value: Text("true")},
              								'Check Out To': var_StartDateTime_central,
              								'Check Out From': var_EndDateTime_central,
              								'Check Out To Text': Text(var_EndTime_central),
              								'Check Out From Text': Text(var_StartTime_central),
              								'Check Out From Number': Value(Substitute(Substitute(Substitute(Substitute(var_StartTime_central, "PM", ""), "AM", ""), ":", ""), " ", "")),
              								'Check Out To Number': Value(Substitute(Substitute(Substitute(Substitute(var_EndTime_central, "PM", ""), "AM", ""), ":", ""), " ", "")),
              								Service: var_Service,
              								RoomReservation: true,
              								Asset: {Value: "Desk"},
              								RecurrenceFrequency: {Value: varRecurrence},
              								RecurrenceEndDate: Blank(),
              								RecurrenceID: varRecurrenceID,
              								RecurrenceDayName: If(IsBlankOrError(var_DayOfWeek), Blank(), var_DayOfWeek),
              								RecurrenceTimes: Blank(),
              								RecurrencePattern: Blank(),
              								IsRecurring: false,
              								OutlookEventID: Blank(),
              								OutlookSeriesID: Blank(),
              								ParentReservationID: Blank()
              							}
              						)
              					)
              				}
              			)
              		)
              	);
              // STEP 4b) varBackupOK = boolean outcome of the main backup patch action.
              	Set(
              		varBackupOK,
              		CountRows(colBackupPatchResults) > 0 And CountIf(
              			colBackupPatchResults,
              			Not(ok)
              		) = 0
              	);
              	
              // ———————————————————————————————————————————————————————————————
              // STEP 5) Attempt simplified backup Patch for every colBackupPatchResults (runs regardless of main outcome)
              	If(
              		Not(varBackupOK),
              		ForAll(
              			CollectionRecurrence As recBk,
              			ForAll(
              				colSelectedDesks As deskBk,
              				Collect(
              					colBackupPatchResults,
              					{
              						ok: !IsError(
              							Patch(
              								backupList_DeskReservations,
              								Defaults('Desk Reservations'),
              								{
              									Title: var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")",
              									submitterName_text: varMyProfile.displayName,
              									submitterEmail_text: Lower(varMyProfile.mail),
              									studentName_text: varStudentProfile.displayName,
              									studentEmail_text: Lower(varStudentProfile.mail),
              									reservationRole_text: var_reservationRole,
              									reservationScenario_text: var_reservationScenario,
              									reservationStart_datetime: var_StartDateTime_central,
              									reservationEnd_datetime: var_EndDateTime_central,
              									Active_choice: {Value: Text("true")}
              								}
              							)
              						)
              					}
              				)
              			)
              		)
                  );
              // STEP 5b) varBackupOK = boolean outcome of the main backup patch action.
              	Set(
              		varBackupSimpleOK,
              		CountRows(colBackupPatchResults) > 0 And CountIf(
              			colBackupPatchResults,
              			Not(ok)
              		) = 0
              	);


              // ———————————————————————————————————————————————————————————————
              // STEP 6) Patch the SuperUserList (only if the user's email exists)
              // Grab the matching row once
              Set(
                  varSuperUserRow,
                  LookUp(
                      SuperUserList,
                      Lower('Enter Super User VA email address') = Lower(varMyProfile.mail)
                  )
              );
              If(
                  !IsBlank(varSuperUserRow),
                  // Build this event's single-line string
                  Set(
                      varNewEventLine,
                      "Event: " & Text(
                          var_StartDateTime_central,
                          "m/d/yyyy h:mm AM/PM"
                      ) & "; Scenario: " & var_reservationScenario & "; Role: " & var_reservationRole & ";"
                  );
                  IfError(
                      Patch(
                          SuperUserList,
                          varSuperUserRow,
                          {
                              // First three columns: only stamp if currently blank
                              LearningLab_Scheduled_datetime:
                                  If(
                                      IsBlank(varSuperUserRow.LearningLab_Scheduled_datetime),
                                      var_StartDateTime_central,
                                      varSuperUserRow.LearningLab_Scheduled_datetime
                              ),
                              LearningLab_ScenarioName:
                                  If(
                                      IsBlank(varSuperUserRow.LearningLab_ScenarioName),
                                      var_reservationScenario,
                                      varSuperUserRow.LearningLab_ScenarioName
                                  ),
                              LearningLab_RoleName:
                                  If(
                                      IsBlank(varSuperUserRow.LearningLab_RoleName),
                                      var_reservationRole,
                                      varSuperUserRow.LearningLab_RoleName
                                  ),
                              // Multi-text column: append a new line every time
                              LearningLab_multiScenario_multipletext:
                                  If(
                                      IsBlank(varSuperUserRow.LearningLab_multiScenario_multipletext),
                                      varNewEventLine,
                                      varSuperUserRow.LearningLab_multiScenario_multipletext & Char(10) & varNewEventLine
                                  )
                          }
                      ),
                      // STEP 7b) varPatchSuperUsersOK = boolean outcome of the patch SuperUserList action.
                      Set(varPatchSuperUsersOK, false),
                      // On success -> true.
                      Set(varPatchSuperUsersOK, true)
                  )
              );



              // ———————————————————————————————————————————————————————————————
              // Step 7) Send the confirmation email (separate from the calendar item).
              IfError(
                  Office365Outlook.SendEmailV2(
                      // To: (required)
                      Concatenate(var_Attendees, "; "),
                      // Subject: (required)
                      Concatenate(
                          "[REGISTERED!] EHRM Learning Lab Training - ",
                          var_reservationScenario,
                          " (",
                          var_reservationRole,
                          ")"
                      ),
                      // Body: (required)
                      var_EmailBody,
                      // Optional advanced parameters:
                      {
                          Importance: "Normal", //"Low", "Normal", "High"
                          IsHtml: true,
                          Cc: Concatenate(varAttendees, "; ", "VHAHINInformaticsTrainingAndSupport@va.gov; ", "Kyle.Coder@va.gov; "),   // optional — remove if not needed
                          //Bcc: var_OptionalAttendees,
                          ReplyTo: "VHAHINInformaticsTrainingAndSupport@va.gov"
                      }
                  ),
              // STEP 7b) varBackupOK = boolean outcome of the main backup patch action.
                  Set(varEmailOK, false),
                  // On success -> true.
                  Set(varEmailOK, true)
              );

              // ———————————————————————————————————————————————————————————————
              // STEP 8) Combined flag varAllOK variable if all other preceeding steps pass/fail.
              // Main list is considered saved if EITHER the full OR the simple
              // Patch succeeded. Overall OK requires calendar + backup + main.
              	Set(
              		varAllOK,
              		varCalendarOK And (varMainOK Or varMainSimpleOK) And (varBackupOK Or varBackupSimpleOK) And varEmailOK And varPatchSuperUsersOK
              	);



              // ———————————————————————————————————————————————————————————————
              // STEP 9) Cleanup ONLY on full success.
              	If(
              		varAllOK,
              		Concurrent(
              			Set(
              				varAccept,
              				Blank()
              			),
              			Set(
              				varAccept3,
              				Blank()
              			),
              			Set(
              				varAccept4,
              				Blank()
              			),
              			ResetForm(Form1),
              			Reset(ddImportance),
              			Reset(ddRecurrenceFrequency),
              			Reset(Calendar_1),
              			Reset(Gallery6),
              			Reset(DatePickerCanvas2),
              			Reset(Gallery3_1),
              			Clear(colSelectedDesks),
              			Clear(CollectionRecurrence),
              			Clear(colDeskChckRecur),
              			Clear(colCombinedRecurrence),
              			Clear(wkDays),
              			Clear(wkDaysTemp)
              		)
              	);
              	

              // ———————————————————————————————————————————————————————————————
              // Step 10)  Navigate to Confirmation screen.
              //Navigate(Success);
            Text: ="SUBMIT!"
            Underline: =true
            Visible: |-
              =If(
