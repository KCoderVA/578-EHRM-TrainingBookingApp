                                sensitivity: "normal"
                            }
                        ),
                    // STEP 1b) varCalendarOK = boolean outcome of the V4CalendarPostItem action.
                        Set(
                            varCalendarOK,
                            false
                        ),
                        Set(
                            varCalendarOK,
                            true
                        )
                    );
                    // ———————————————————————————————————————————————————————————————
                    // ———————————————————————————————————————————————————————————————
                    // STEP 5) Combined flag varAllOK variable if all other preceeding steps pass/fail.
                    // Main list is considered saved if EITHER the full OR the simple
