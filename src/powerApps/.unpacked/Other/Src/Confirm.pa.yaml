                  X: =text_Key3.X
                  Y: =text_Key3.Y + text_Key3.Height
            - text_Value2:
                Control: Text@0.0.51
                Properties:
                  Height: =20
                  Text: =ThisItem.EndDateTime
                  Width: =text_Key2.Width
                  X: =text_Key2.X
                  Y: =text_Key2.Y + text_Key2.Height
            - text_Value1:
