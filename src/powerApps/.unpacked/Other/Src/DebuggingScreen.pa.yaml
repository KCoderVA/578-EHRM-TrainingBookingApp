                          // ============================================================
                          // 1. Initialization & Setup
                          // ============================================================
                          // Set initialization loading screen
                          Set(
                              varTimer,
                              true
                          );
                          // Real signed-in identity — never changes, cannot be spoofed
                          /*
                          Set(
                              varRealEmail,
                              Lower(varRealEmail)
                          );
                          Set(
                              varRealEntraID,
                              varRealEntraID
                          );
                          */
                          // The pseudonym identity of the user the app is currently 'acting as' (defaults to the real user until changed).
                          Set(
                              varTargetEmail,
                              varRealEmail
                          );
                          Set(
                              varTargetEntraID,
                              varRealEntraID
                          );
                          Set(
                              varIsImpersonating,
                              If(
                                  varTargetEmail = "kyle.coder@va.gov",
                                  false,
                                  varRealEmail <> varTargetEmail,
                                  true,
                                  false
                              )
                          );
                          // Refresh SharePoint list/data sources, then ClearCollect newest info
                          Refresh('Desk Reservations');
                          Refresh(DeskAccessControl);
                          Refresh(Desks);
                          Refresh(MasterScheduleList);
                          Refresh(SuperUserList);
                          Refresh(backupList_DeskReservations);
                          Refresh('Learning Lab Sessions');
                          Clear(col_backupDeskReservations);
                          //Clear(col_EventBuildDetails);
                          Clear(col_EventCombinedDetails);
                          Clear(col_MasterSchedule);
                          Clear(col_nationalEHRMLearningLabSessions);
                          Clear(col_SuperUserList);
                          Clear(colBackupPatchResults);
                          Clear(colCombinedRecurrence);
                          Clear(colDates);
                          Clear(colDeskAccess);
                          Clear(colDeskChckRecur);
                          Clear(CollectionRecurrence);
                          Clear(colMainFullResults);
                          Clear(colMenu);
                          Clear(colRoomFilter);
                          Clear(colSelectedDesks);
                          Clear(colSmartboard);
                          Clear(colUser_details);
                          Clear(WeekdaysOnly);
                          Clear(wkDays);
                          Clear(wkDaysTemp);
                          ClearCollect(
                              colDeskAccess,
                              DeskAccessControl
                          );
                          ClearCollect(
                              col_MasterSchedule,
                              MasterScheduleList
                          );
                          ClearCollect(
                              colUser_details,
                              Office365Users.UserProfileV2(varTargetEntraID)
                          );
                          ClearCollect(
                              col_SuperUserList,
                              SuperUserList
                          );
                          ClearCollect(
                              col_backupDeskReservations,
                              backupList_DeskReservations
                          );
                          ClearCollect(
                              col_nationalEHRMLearningLabSessions,
                              'Learning Lab Sessions'
                          );
                          // Declare global app rules
                          Set(
                              user_isAdmin,
                              false
                          );
                          // ============================================================
                          // 2. Find the target user's existing record (if any)
                          // ============================================================
                          /*
                          Set(
                              varDeskAccessControl_record,
                              LookUp(
                                  DeskAccessControl,
                                  (Email_Text = Lower(varTargetEmail))
                              )
                          );
                          Set(
                              varUserExists,
                              !IsBlank(varDeskAccessControl_record)
                          );
                          */
                          // ============================================================
                          // 4. Resolve access level (fallback to AccessDenied if blank)
                          // ============================================================
                          /*
                          (Set(
                              userAccessLevel_text,
                              If(
                                  IsBlankOrError(varDeskAccessControl_record),
                                  LookUp(
                                      DeskAccessControl,
                                      (Email_Text = Lower(varTargetEmail)),
                                      AccessLevel_Choice.Value
                                  ),
                                  !IsBlankOrError(varDeskAccessControl_record),
                                  Coalesce(
                                      varDeskAccessControl_record.AccessLevel_Text,
                                      "AccessDenied"
                                  ),
                                  LookUp(
                                      colDeskAccess,
                                      Email_Text = Lower(varTargetEmail),
                                      AccessLevel_text.Value
                                  )
                              )
                          );
                          */
                          // ============================================================
                          // 3. If user is missing, add them as default "User", then re-lookup.
                          // ============================================================
                          If(
                              !varUserExists && Lower(varTargetEmail) = Lower(varRealEmail),
                              Patch(
                                  DeskAccessControl,
                                  Defaults(DeskAccessControl),
                                  {
                                      Email_Text: varTargetEmail,
                                      AccessLevel_Text: "User",
                                      AccessLevel_Choice: {Value: "User"},
                                      'utcNow()_value': Now(),
                                      Id_Text: varTargetEntraID,
                                      AccessStart_dateTime: Now(),
                                      AccessStop_dateTime: DateAdd(Now(),6,TimeUnit.Months),
                                      Approver_Email_Text: varRealEmail,
                                      Manager_Email_Text: Lower(Office365Users.Manager(varTargetEntraID).Mail),
                                      Title: varTargetEntraID,
                                      'addMinutes(utcNow(),10)': DateAdd(Now(),10,TimeUnit.Minutes),
                                      'Created Via': Text("New User to 578 EHRM Training App"),
                                      NetworkAccount_Text: varUser_details.mailNickname
                                  }
                              );
                              Refresh(DeskAccessControl);
                              ClearCollect(
                                  colDeskAccess,
                                  DeskAccessControl
                              );
                              /*
                              Set(
                                  userAccessLevel_text,
