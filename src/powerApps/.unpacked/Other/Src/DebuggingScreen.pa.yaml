Screens:
  DebuggingScreen:
    Properties:
      Fill: =Color.LightGray
      Height: =App.Height
      OnHidden: |-
        =Set(var_DebuggingScreen, false);
        Set(var_DebuggingTimerDuration, 12000);
      OnVisible: |-
        =Set(var_DebuggingScreen, true);
        Set(var_DebuggingTimerDuration, 12000);
      Width: =App.Width
    Children:
      - ctnDebugScreen_content:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =3
            Height: =Parent.Height - ctnDebugScreen_header.Height
            Width: =Parent.Width
            Y: =ctnDebugScreen_header.Y + ctnDebugScreen_header.Height
          Children:
            - Container4:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(9, 33, 98, 1)
