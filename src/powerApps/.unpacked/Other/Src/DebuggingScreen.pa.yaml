                        AutoPause: |-
                          =If(
                              Self.Duration > 1,
                              true,
                              false
                          )
                        AutoStart: |-
                          =If(
                              Self.Duration > 1,
                              true,
                              false
                          )
                        Duration: =var_DebuggingTimerDuration
                        Height: =100
