            - btnSubmitForms:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =btnSwitchForms.Height
                  OnSelect: |-
                    =If(
                        form_EditDesks.Visible = true || form_EditUsers.Visible = false,
                        SubmitForm(form_EditUsers),
                        form_EditUsers.Visible = true || form_EditDesks.Visible = false,
                        SubmitForm(form_EditDesks)
                    )
                  Size: =14
                  Text: |-
                    =If(
                        form_EditDesks.Visible = true || form_EditUsers.Visible = false,
                        "Submit EditUsers",
                        form_EditUsers.Visible = true || form_EditDesks.Visible = false,
                        "Submit EditDesks"
                    )
                  Width: =btnSwitchForms.Width
                  X: =btnSwitchForms.X + btnSwitchForms.Width + 10
                  Y: =btnSwitchForms.Y
            - btnSwitchForms:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =21
                  OnSelect: |-
                    =If(
                        form_EditDesks.Visible = true || form_EditUsers.Visible = false,
                        Set(var_DebuggingScreen, false),
                        form_EditUsers.Visible = true || form_EditDesks.Visible = false,
                        Set(var_DebuggingScreen, true)
                    )
                  Size: =14
                  Text: |-
                    =If(
                        form_EditDesks.Visible = true || form_EditUsers.Visible = false,
                        "Switch to EditUsers",
                        form_EditUsers.Visible = true || form_EditDesks.Visible = false,
                        "Switch To EditDesks"
                    )
                  Width: =(form_EditDesks.Width / 2) - 10
                  X: =2
                  Y: =2
