App:
  Properties:
    BackEnabled: =false
    MinScreenHeight: =320
    MinScreenWidth: =320
    OnStart: "=// ============================================================\r\n// 1. Initialization & Setup\r\n// ============================================================\r\nSet(varRepoVersion, \"1.0.12\");\r\nSet(varTimer, true);\r\n\r\n// Real signed-in identity — never changes, cannot be spoofed\r\nSet(varRealEmail, Lower(User().Email));\r\nSet(varRealEntraID, First(Office365Users.SearchUserV2({searchTerm: varRealEmail, top: 1}).value).Id);\r\n\r\n// Pseudonym identity (defaults to real user until changed)\r\nSet(varTargetEmail, varRealEmail);\r\nSet(varTargetEntraID, varRealEntraID);\r\nSet(\r\n    varIsImpersonating,\r\n    varTargetEmail = \"kyle.coder@va.gov\" && varRealEmail <> varTargetEmail\r\n);\r\n\r\n// Refresh data sources, then ClearCollect newest info\r\nRefresh('Desk Reservations');\r\nRefresh(DeskAccessControl);\r\nRefresh(Desks);\r\nRefresh(MasterScheduleList);\r\nRefresh(SuperUserList);\r\nRefresh(backupList_DeskReservations);\r\nRefresh('Learning Lab Sessions');\r\nClearCollect(colDeskAccess, DeskAccessControl);\r\nClearCollect(col_MasterSchedule, MasterScheduleList);\r\nClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));\r\nClearCollect(col_SuperUserList, SuperUserList);\r\nClearCollect(col_backupDeskReservations, backupList_DeskReservations);\r\nClearCollect(\r\n    col_nationalEHRMLearningLabSessions,\r\n    Filter(\r\n        'Learning Lab Sessions',\r\n        Facility.Value = Text(\"Hines\")\r\n    )\r\n);\r\nClear(colMenu);\r\nClear(CollectionRecurrence);\r\n\r\n// ============================================================\r\n// 2. DEFAULT EVERYONE TO \"User\" FIRST (no dependency on SharePoint)\r\n//    This is the key change: the menu is always buildable, even for\r\n//    a brand-new user whose row doesn't exist yet.\r\n// ============================================================\r\nSet(user_isAdmin, false);\r\nSet(user_IsSuperUser, false);\r\nSet(userAccessLevel_text, \"User\");   // baseline for anyone with network access\r\n\r\n// ============================================================\r\n// 3. Find the target user's existing record (if any)\r\n// ============================================================\r\nSet(\r\n    varDeskAccessControl_record,\r\n    LookUp(\r\n        DeskAccessControl,\r\n        Email_Text = Lower(varTargetEmail)\r\n    )\r\n);\r\nSet(varUserExists, !IsBlankOrError(varDeskAccessControl_record));\r\n\r\n// ============================================================\r\n// 4. IF the record exists -> UPGRADE in-app memory to their real level.\r\n//    IF it does not exist -> fire-and-forget Patch to add the row.\r\n//    Either way we NEVER read the patch back to build the menu.\r\n// ============================================================\r\nIf(\r\n    varUserExists,\r\n\r\n    // --- Existing user: upgrade access level from their record ---\r\n    Set(\r\n        userAccessLevel_text,\r\n        Coalesce(\r\n            varDeskAccessControl_record.AccessLevel_Text,\r\n            varDeskAccessControl_record.AccessLevel_Choice.Value,\r\n            \"User\"\r\n        )\r\n    ),\r\n\r\n    // --- New user (and only ever the REAL user, never while impersonating) ---\r\n    If(\r\n        Lower(varTargetEmail) = Lower(varRealEmail),\r\n        Patch(\r\n            DeskAccessControl,\r\n            Defaults(DeskAccessControl),\r\n            {\r\n                Email_Text: varRealEmail,\r\n                AccessLevel_Text: \"User\",\r\n                AccessLevel_Choice: { Value: \"User\" },\r\n                'utcNow()_value': Now(),\r\n                Id_Text: varRealEntraID,\r\n                AccessStart_dateTime: Now(),\r\n                AccessStop_dateTime: DateAdd(Now(), 6, TimeUnit.Months),\r\n                Approver_Email_Text: varRealEmail,\r\n                Title: varRealEntraID,\r\n                //'addMinutes(utcNow(),10)': DateAdd(Now(), 10, TimeUnit.Minutes),\r\n                AboutMe_Text: \"New 'User' access granted to 578 EHRM Training App at \" & Now()\r\n            }\r\n        )\r\n        // Note: userAccessLevel_text already = \"User\" from step 2,\r\n        // so we do NOT re-lookup. Menu builds correctly regardless of\r\n        // when SharePoint finishes committing the new row.\r\n    )\r\n);\r\n\r\n// ============================================================\r\n// 5. Elevated / admin flags (derived from in-memory level)\r\n// ============================================================\r\nSet(user_isAdmin, userAccessLevel_text = \"AppAdmin\");\r\nSet(user_IsSuperUser, userAccessLevel_text = \"SuperUser\");\r\n\r\n// ============================================================\r\n// 6. Build the navigation menu based on level\r\n// ============================================================\r\nSwitch(\r\n    true,\r\n\r\n    // Top Elevated Roles: full menu\r\n    userAccessLevel_text in [\"Manager\", \"ServiceChief\", \"AppAdmin\"],\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\",  Icon: Icon.Home,            Page: Dashboard,     Visible: true },\r\n        { Name: \"Items\", Icon: Icon.Bookmark,        Page: MyAppts,       Visible: true },\r\n        { Name: \"Desks\", Icon: Icon.ComputerDesktop, Page: ManageDesks,   Visible: true },\r\n        { Name: \"Users\", Icon: Icon.People,          Page: ManageUsers,   Visible: true },\r\n        { Name: \"Help\",  Icon: Icon.Help,            Page: ReleaseNotes,  Visible: true },\r\n        { Name: \"New\",   Icon: Icon.Add,             Page: POCSUPERVISOR, Visible: true }\r\n    ),\r\n\r\n    // Advanced 'Project Leader' Role: full menu without UserManagement\r\n    userAccessLevel_text in [\"ProjectLeader\"],\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\",  Icon: Icon.Home,            Page: Dashboard,     Visible: true },\r\n        { Name: \"Items\", Icon: Icon.Bookmark,        Page: MyAppts,       Visible: true },\r\n        { Name: \"Desks\", Icon: Icon.ComputerDesktop, Page: ManageDesks,   Visible: true },\r\n        { Name: \"Help\",  Icon: Icon.Help,            Page: ReleaseNotes,  Visible: true },\r\n        { Name: \"New\",   Icon: Icon.Add,             Page: POCSUPERVISOR, Visible: true }\r\n    ),\r\n\r\n    // Standard user\r\n    userAccessLevel_text in [\"User\", \"SuperUser\"],\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\",  Icon: Icon.Home,     Page: Dashboard,     Visible: true },\r\n        { Name: \"Items\", Icon: Icon.Bookmark, Page: MyAppts,       Visible: true },\r\n        { Name: \"Help\",  Icon: Icon.Help,     Page: ReleaseNotes,  Visible: true },\r\n        { Name: \"New\",   Icon: Icon.Add,      Page: POCSUPERVISOR, Visible: true }\r\n    ),\r\n\r\n    // View-only\r\n    userAccessLevel_text in [\"View-Only\"],\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\",  Icon: Icon.Home,     Page: Dashboard,    Visible: true },\r\n        { Name: \"Items\", Icon: Icon.Bookmark, Page: MyAppts,      Visible: true },\r\n        { Name: \"Help\",  Icon: Icon.Help,     Page: ReleaseNotes, Visible: true }\r\n    ),\r\n\r\n    // AccessDenied\r\n    userAccessLevel_text in [\"AccessDenied\"],\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\", Icon: Icon.Home, Page: Dashboard,    Visible: true },\r\n        { Name: \"Help\", Icon: Icon.Help, Page: ReleaseNotes, Visible: true }\r\n    ),\r\n\r\n    // Fallback: baseline standard menu (should rarely hit, since default is \"User\")\r\n    ClearCollect(\r\n        colMenu,\r\n        { Name: \"Home\",  Icon: Icon.Home,     Page: Dashboard,    Visible: true },\r\n        { Name: \"Items\", Icon: Icon.Bookmark, Page: MyAppts,      Visible: true },\r\n        { Name: \"Help\",  Icon: Icon.Help,     Page: ReleaseNotes, Visible: true },\r\n        { Name: \"New\",   Icon: Icon.Add,      Page: POCSUPERVISOR, Visible: true }\r\n    )\r\n);\r\n\r\n\r\nSet(varTimer, true);\r\n\r\nClearCollect(colDeskAccess, DeskAccessControl);\r\nClearCollect(col_MasterSchedule, MasterScheduleList);\r\nClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));\r\n\r\n\r\n\r\n/*\r\n/////////////////////////\r\nPREVIOUS CONTENT, prior to update v0.14.25:\r\n/////////////////////////\r\n\r\n        // ============================================================\r\n        // 1. Initialization & Setup\r\n        // ============================================================\r\n        // Set initialization loading screen\r\n            Set(varTimer, true);\r\n        // Real signed-in identity — never changes, cannot be spoofed\r\n            If(\r\n                Lower(User().Email) = \"kyle.coder@va.gov\",\r\n                    Set(varRealEmail, Lower(\"Matthew.Olson@va.gov\")), //Lower(User().Email)), //Lower(\"Amy.Garner2@va.gov\")),\r\n                Lower(User().Email) <> \"kyle.coder@va.gov\",\r\n                    Set(varRealEmail, Lower(User().Email))\r\n            );\r\n            Set(varRealEntraID, First(Office365Users.SearchUserV2({searchTerm:(varRealEmail), top:(1)}).value).Id);\r\n        // The pseudonym identity of the user the app is currently 'acting as' (defaults to the real user until changed).\r\n            Set(varTargetEmail, varRealEmail);\r\n            Set(varTargetEntraID, varRealEntraID);\r\n            Set(varIsImpersonating,\r\n                If(\r\n                    varTargetEmail = \"kyle.coder@va.gov\" && varRealEmail = \"kyle.coder@va.gov\",\r\n                        false,\r\n                    varTargetEmail = \"kyle.coder@va.gov\" && varRealEmail <> varTargetEmail,\r\n                        true,\r\n                    false\r\n                )\r\n            );\r\n        // Refresh SharePoint list/data sources, then ClearCollect newest info\r\n            Refresh('Desk Reservations');\r\n            Refresh(DeskAccessControl);\r\n            Refresh(Desks);\r\n            Refresh(MasterScheduleList);\r\n            Refresh(SuperUserList);\r\n            Refresh(backupList_DeskReservations);\r\n            Refresh('Learning Lab Sessions');\r\n            ClearCollect(colDeskAccess, DeskAccessControl);\r\n            ClearCollect(col_MasterSchedule, MasterScheduleList);\r\n            ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));\r\n            ClearCollect(col_SuperUserList, SuperUserList);\r\n            ClearCollect(col_backupDeskReservations, backupList_DeskReservations);\r\n            ClearCollect(col_nationalEHRMLearningLabSessions, 'Learning Lab Sessions');\r\n            Clear(colMenu);\r\n            Clear(CollectionRecurrence);\r\n        // Declare global app rules\r\n            Set(user_isAdmin, false);\r\n\r\n\r\n  \r\n        // ============================================================\r\n        // 2. Find the target user's existing record (if any)\r\n        // ============================================================\r\n            Set(\r\n                varDeskAccessControl_record,\r\n                LookUp(\r\n                    DeskAccessControl,\r\n                    Email_Text = Lower(varTargetEmail)\r\n                )\r\n            );\r\n            Set(varUserExists, !IsBlankOrError(varDeskAccessControl_record));\r\n\r\n        // ============================================================\r\n        // 4. Resolve access level (fallback to AccessDenied if blank)\r\n        // ============================================================\r\n            Set(\r\n                userAccessLevel_text,\r\n                If(\r\n                    IsBlankOrError(varDeskAccessControl_record),\r\n                        LookUp(\r\n                            DeskAccessControl,\r\n                            (Email_Text = Lower(varTargetEmail)),\r\n                            AccessLevel_Choice.Value\r\n                        ),\r\n                    !IsBlankOrError(varDeskAccessControl_record),\r\n                        Coalesce(varDeskAccessControl_record.AccessLevel_Text, \"User\"), // \"AccessDenied\"),\r\n                    LookUp(\r\n                        colDeskAccess,\r\n                        Email_Text = Lower(varTargetEmail),\r\n                        AccessLevel_text.Value\r\n                    )\r\n                )\r\n            );\r\n\r\n\r\n        // ============================================================\r\n        // 3. If user is missing, add them as default \"User\", then re-lookup.\r\n        //    Only ever writes for the REAL user (never while impersonating,\r\n        //    which at OnStart is always the case, but guarded for safety).\r\n        // ============================================================\r\n            If(\r\n                ((IsBlankOrError(varUserExists) || !varUserExists) && (Lower(varTargetEmail) = Lower(varRealEmail))),\r\n                Patch(\r\n                    DeskAccessControl,\r\n                    Defaults(DeskAccessControl),\r\n                    {\r\n                        Email_Text: varRealEmail,\r\n                        AccessLevel_Text: \"User\",\r\n                        AccessLevel_Choice: { Value: \"User\" },\r\n                        'utcNow()_value': Now()\r\n                        //Id_Text: varRealEntraID,\r\n                        //AccessStart_dateTime: Now(),\r\n                        //AccessStop_dateTime: DateAdd(Now(), 6, TimeUnit.Months),\r\n                        //Approver_Email_Text: varRealEmail,\r\n                        //Title: varRealEntraID,\r\n                        //'addMinutes(utcNow(),10)': DateAdd(Now(), 10, TimeUnit.Minutes),\r\n                        //'Created Via': Text(\"New User to 578 EHRM Training App\")\r\n                    }\r\n                );\r\n                Refresh(DeskAccessControl);\r\n                ClearCollect(colDeskAccess, DeskAccessControl);\r\n                Set(\r\n                    varDeskAccessControl_record,\r\n                    LookUp(\r\n                        DeskAccessControl,\r\n                        Email_Text = Lower(varTargetEmail)\r\n                    )\r\n                );\r\n                Set(\r\n                    userAccessLevel_text,\r\n                    If(\r\n                        IsBlankOrError(varDeskAccessControl_record),\r\n                            LookUp(\r\n                                DeskAccessControl,\r\n                                (Email_Text = Lower(varTargetEmail)),\r\n                                AccessLevel_Choice.Value\r\n                            ),\r\n                        !IsBlankOrError(varDeskAccessControl_record),\r\n                            Coalesce(varDeskAccessControl_record.AccessLevel_Text, \"User\"), // \"AccessDenied\"),\r\n                        LookUp(\r\n                            colDeskAccess,\r\n                            Email_Text = Lower(varTargetEmail),\r\n                            AccessLevel_text.Value\r\n                        )\r\n                    )\r\n                )\r\n            );\r\n//Set(appOnStart_userElevatedAccess,\r\n//    \" \r\n        // ============================================================\r\n        // 5. Elevated / admin flag\r\n        // ============================================================\r\n            Set(\r\n                user_isAdmin,\r\n                userAccessLevel_text = \"AppAdmin\"\r\n            );\r\n            Set(\r\n                user_IsSuperUser,\r\n                userAccessLevel_text = \"SuperUser\"\r\n            );\r\n\r\n\r\n        // ============================================================\r\n        // 6. Build the navigation menu based on level\r\n        // ============================================================\r\n            Switch(\r\n                true,\r\n\r\n                // Top Elevated Roles: full menu\r\n                userAccessLevel_text in [\"Manager\", \"ServiceChief\", \"AppAdmin\"],\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Items\",\r\n                        Icon: Icon.Bookmark,\r\n                        Page: MyAppts,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Desks\",\r\n                        Icon: Icon.ComputerDesktop,\r\n                        Page: ManageDesks,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Users\",\r\n                        Icon: Icon.People,\r\n                        Page: ManageUsers,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name:\"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"New\",\r\n                        Icon: Icon.Add,\r\n                        Page: POCSUPERVISOR,\r\n                        Visible: true\r\n                    }\r\n                ),\r\n\r\n                // Advanced 'Project Leader' Role: full menu without UserManagement\r\n                userAccessLevel_text in [\"ProjectLeader\"],\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Items\",\r\n                        Icon: Icon.Bookmark,\r\n                        Page: MyAppts,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Desks\",\r\n                        Icon: Icon.ComputerDesktop,\r\n                        Page: ManageDesks,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name:\"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"New\",\r\n                        Icon: Icon.Add,\r\n                        Page: POCSUPERVISOR,\r\n                        Visible: true\r\n                    }\r\n                ),\r\n\r\n                // Standard user\r\n                userAccessLevel_text in [\"User\", \"SuperUser\"],\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Items\",\r\n                        Icon: Icon.Bookmark,\r\n                        Page: MyAppts,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"New\",\r\n                        Icon: Icon.Add,\r\n                        Page: POCSUPERVISOR,\r\n                        Visible: true\r\n                    }\r\n                ),\r\n\r\n                // View-only\r\n                userAccessLevel_text in [\"View-Only\"],\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name: \"Items\",\r\n                        Icon: Icon.Bookmark,\r\n                        Page: MyAppts,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name:\"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    }\r\n                ),\r\n\r\n                // View-only\r\n                userAccessLevel_text in [\"AccessDenied\"],\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name:\"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    }\r\n                ),\r\n\r\n                // AccessDenied or anything else: empty menu\r\n                IsBlankOrError(userAccessLevel_text),\r\n                ClearCollect(\r\n                    colMenu,\r\n                    {\r\n                        Name: \"Home\",\r\n                        Icon: Icon.Home,\r\n                        Page: Dashboard,\r\n                        Visible: true\r\n                    },\r\n                    {\r\n                        Name:\"Help\",\r\n                        Icon: Icon.Help,\r\n                        Page: ReleaseNotes,\r\n                        Visible: true\r\n                    }\r\n                )\r\n        );\r\n\r\n\r\n\r\nSet(varTimer, true);\r\n\r\nClearCollect(colDeskAccess, DeskAccessControl);\r\nClearCollect(col_MasterSchedule, MasterScheduleList);\r\nClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));\r\n\r\n*/"
    StartScreen: =Dashboard
    Theme: =PowerAppsTheme
