      Set(varDaily, Blank());
      Set(varDefaultEndTime, Blank());
      Set(varDescription, Blank());
      Set(varDeskMode, Blank());
      Set(var_EmailBody, Blank());
      Set(varEndDate, Blank());
      Set(varEventEndTime, Blank());
      Set(varEventStartTime, Blank());
      Set(varImportance, Blank());
      Set(varIsImpersonating, Blank());
      Set(varManageSelectedDesk, Blank());
      Set(varMeetCat, Blank());
      Set(varMyProfile, Blank());
      Set(varOptionalAttendees, Blank());
      Set(varPopUp_ClassPicker, Blank());
