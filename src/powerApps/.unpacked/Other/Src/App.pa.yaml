App:
  Properties:
    BackEnabled: =false
    MinScreenHeight: =320
    MinScreenWidth: =320
    OnStart: |-
      =    Set(varRepoVersion, "0.12.2");
      // ============================================================
      // 1. Initialization & Setup
      // ============================================================
      // Set initialization loading screen
          Set(varTimer, true);
      // Real signed-in identity — never changes, cannot be spoofed
          Set(varRealEmail, Lower(User().Email));
          Set(varRealEntraID, User().EntraObjectId);
      // The pseudonym identity of the user the app is currently "acting as" (defaults to the real user until changed).
          Set(varTargetEmail, varRealEmail);
          Set(varTargetEntraID, varRealEntraID);
          Set(varIsImpersonating,
              If(
                  varTargetEmail = "kyle.coder@va.gov",
                  false,
                  varRealEmail <> varTargetEmail,
                  true,
                  false
              )
          );
      // Refresh SharePoint list/data sources, then ClearCollect newest info
          Refresh('Desk Reservations');
          Refresh(DeskAccessControl);
          Refresh(Desks);
          Refresh(MasterScheduleList);
          Refresh(SuperUserList);
          Refresh(backupList_DeskReservations);
          Refresh('Learning Lab Sessions');
          ClearCollect(colDeskAccess, DeskAccessControl);
          ClearCollect(col_MasterSchedule, MasterScheduleList);
          ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));
          ClearCollect(col_SuperUserList, SuperUserList);
          ClearCollect(col_backupDeskReservations, backupList_DeskReservations);
          ClearCollect(col_nationalEHRMLearningLabSessions, 'Learning Lab Sessions');
          Clear(colMenu);
          Clear(CollectionRecurrence);
      // Declare global app rules
          Set(user_isAdmin, false);

      // ============================================================
      // 2. Find the target user's existing record (if any)
      // ============================================================
          Set(
              varDeskAccessControl_record,
              LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
          );
          Set(varUserExists, !IsBlank(varDeskAccessControl_record));

      // ============================================================
      // 3. If missing, add them as default "User", then re-lookup.
      //    Only ever writes for the REAL user (never while impersonating,
      //    which at OnStart is always the case, but guarded for safety).
      // ============================================================
          If(
              !varUserExists && Lower(varTargetEmail) = Lower(varRealEmail),
              Patch(
                  DeskAccessControl,
                  Defaults(DeskAccessControl),
                  {
                      Email_Text: varTargetEmail,
                      AccessLevel_Text: "User",
                      AccessLevel_Choice: { Value: "User" },
                      'utcNow()_value': Now(),
                      Id_Text: varTargetEntraID,
                      AccessStart_dateTime: Now(),
                      AccessStop_dateTime: DateAdd(Now(), 6, TimeUnit.Months),
                      Approver_Email_Text: varRealEmail,
                      Manager_Email_Text: Lower(Office365Users.Manager(varTargetEntraID).Mail),
                      Title: varTargetEntraID,
                      'addMinutes(utcNow(),10)': DateAdd(Now(), 10, TimeUnit.Minutes),
                      'Created Via': Text("New User to 578 EHRM Training App"),
                      NetworkAccount_Text: varUser_details.mailNickname
                  }
              );
              Refresh(DeskAccessControl);
              ClearCollect(colDeskAccess, DeskAccessControl);
              Set(
                  varDeskAccessControl_record,
                  LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
              )
          );

      // ============================================================
      // 4. Resolve access level (fallback to AccessDenied if blank)
      // ============================================================
          Set(
              userAccessLevel_text,
              Coalesce(varDeskAccessControl_record.AccessLevel_Text, "AccessDenied")
          );

      // ============================================================
      // 5. Elevated / admin flag
      // ============================================================
          Set(
              user_isAdmin,
              userAccessLevel_text = "AppAdmin"
          );

      // ============================================================
      // 6. Build the navigation menu based on level
      // ============================================================
          Switch(
              true,

              // Elevated roles: full menu
              userAccessLevel_text in ["ProjectLeader", "Manager", "ServiceChief", "AppAdmin"],
              ClearCollect(
                  colMenu,
                  {
                      Name: "Home",
                      Icon: Icon.Home,
                      Page: Dashboard,
                      Visible: true
                  },
                  {
                      Name: "Items",
                      Icon: Icon.Bookmark,
                      Page: MyAppts,
                      Visible: true
                  },
                  {
                      Name: "Desks",
                      Icon: Icon.ComputerDesktop,
                      Page: ManageDesks,
                      Visible: true
                  },
                  {
                      Name: "Users",
                      Icon: Icon.People,
                      Page: ManageUsers,
                      Visible: true
                  },
                  {
                      Name:"Help",
                      Icon: Icon.Help,
                      Page: ReleaseNotes,
                      Visible: true
                  },
                  {
                      Name: "New",
                      Icon: Icon.Add,
                      Page: POCSUPERVISOR,
                      Visible: true
                  }
              ),

              // Standard user
              userAccessLevel_text in ["User", "SuperUser"],
              ClearCollect(
                  colMenu,
                  {
                      Name: "Home",
                      Icon: Icon.Home,
                      Page: Dashboard,
                      Visible: true
                  },
                  {
                      Name: "Items",
                      Icon: Icon.Bookmark,
                      Page: MyAppts,
                      Visible: true
                  },
                  {
                      Name: "Help",
                      Icon: Icon.Help,
                      Page: ReleaseNotes,
                      Visible: true
                  },
                  {
                      Name: "New",
                      Icon: Icon.Add,
                      Page: POCSUPERVISOR,
                      Visible: true
                  }
              ),

              // View-only
              userAccessLevel_text in ["View-Only"],
              ClearCollect(
                  colMenu,
                  {
                      Name: "Home",
                      Icon: Icon.Home,
                      Page: Dashboard,
                      Visible: true
                  },
                  {
                      Name: "Items",
                      Icon: Icon.Bookmark,
                      Page: MyAppts,
                      Visible: true
                  },
                  {
                      Name:"Help",
                      Icon: Icon.Help,
                      Page: ReleaseNotes,
                      Visible: true
                  }
              ),

              // View-only
              userAccessLevel_text in ["AccessDenied"],
              ClearCollect(
                  colMenu,
                  {
                      Name: "Home",
                      Icon: Icon.Home,
                      Page: Dashboard,
                      Visible: true
                  },
                  {
                      Name:"Help",
                      Icon: Icon.Help,
                      Page: ReleaseNotes,
                      Visible: true
                  }
              ),

              // AccessDenied or anything else: empty menu
              IsBlankOrError(userAccessLevel_text),
              ClearCollect(
                  colMenu,
                  {
                      Name: "Home",
                      Icon: Icon.Home,
                      Page: Dashboard,
                      Visible: true
                  },
                  {
                      Name:"Help",
                      Icon: Icon.Help,
                      Page: ReleaseNotes,
                      Visible: true
                  }
              )
          );



      Set(varTimer, true);



      ResetForm(Form1);
      ResetForm(Form2);


      Set(_allRoomsConcat, Blank());
      Set(_calendarVisible, Blank());
      Set(_dateSelected, Blank());
      Set(_dateSelected2, Blank());
      Set(_firstDayInView, Blank());
      Set(_FirstDayinView2, Blank());
      Set(_firstDayOfMonth, Blank());
      Set(_firstDayOfMonth2, Blank());
      Set(_firstDayofWeek2, Blank());
      Set(_lastDayOfMonth, Blank());
      Set(_LastDayOfMonth2, Blank());
      Set(_maxDate, Blank());
      Set(_MaxDate, Blank());
      Set(_MaxDate2, Blank());
      Set(_minDate, Blank());
      Set(_MinDate, Blank());
      Set(_MinDate2, Blank());
      Set(_myCalendarName, Blank());
      Set(_myScheduledMeeting, Blank());
      Set(_noRoomLists, Blank());
      Set(_roomListSelected, Blank());
      Set(_selectedMeetingTime, Blank());
      Set(_selectedRoom, Blank());
      Set(_selectedRoomList, Blank());
      Set(_selectedUser, Blank());
      Set(_showDetails, Blank());
      Set(_showMeetingTimes, Blank());
      Set(currentItem, Blank());
      Set(endByDate, Blank());
      Set(gv_item, Blank());
      Set(maxOccurrence, Blank());
      Set(NthWeekdayRecord, Blank());
      Set(numWorkDays, Blank());
      Set(PDFPrint, Blank());
      Set(startWeekday, Blank());
      Set(submitItem, Blank());
      Set(var_Attendees, Blank());
      Set(var_Date, Blank());
      Set(var_Date_central, Blank());
      Set(var_DayOfWeek, Blank());
      Set(var_Duration, Blank());
      Set(var_Duration_central, Blank());
      Set(var_EmailBody, Blank());
      Set(var_EndDateTime_central, Blank());
      Set(var_EndTime, Blank());
      Set(var_EndTime_central, Blank());
      Set(var_firstHalfDuration, Blank());
      Set(var_firstHalfDuration_central, Blank());
      Set(var_ManagerEmail, Blank());
      Set(var_MeetingCategory, Blank());
