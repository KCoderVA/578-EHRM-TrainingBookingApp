Screens:
  Success:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =// ═══════════════════════════════════════════════════════════════
        // SUCCESS SCREEN  —  property-by-property formulas
        // ═══════════════════════════════════════════════════════════════

        // ───────────────────────────────────────────────────────────────
        // SCREEN.OnVisible
        // ───────────────────────────────────────────────────────────────
        // Decide once whether everything succeeded. Only start the auto-
        // redirect timer when it did; otherwise the user stays here to read
        // the warning and must dismiss manually.
        If(
            (varCalendarOK = true && (varMainOK = true || varMainSimpleOK = true) && (varBackupOK = true || varBackupSimpleOK = true)),
            Set(varAllOK, true) && Set(varShowRedirect, varAllOK),
            (varCalendarOK <> true && (varMainOK <> true || varMainSimpleOK <> true) && (varBackupOK <> true || varBackupSimpleOK <> true)),
            Set(varAllOK, false) && Set(varShowRedirect, varAllOK)
        )
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Image2_3:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =abstractBackground
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - iconCircle1:
          Control: Circle@2.3.0
          Properties:
            Fill: |-
              =If(
                  varAllOK,
                  RGBA(15, 108, 189, 1),
                  RGBA(168, 0, 0, 1)
              )
            X: =(Parent.Width - Self.Width) / 2
            Y: =iconCheck1.Y
      - iconCheck1:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =iconCircle1.Height
            Icon: |+
              =//"Your training is booked!"
              // ───────────────────────────────────────────────────────────────
              // LblSuccessMsg1.Text   (main heading/message label)
              // ───────────────────────────────────────────────────────────────
              If(
                  varAllOK,
                  Icon.Check,
                  Icon.Error
              )
            PaddingBottom: =Self.PaddingTop
            PaddingLeft: =Self.PaddingTop
            PaddingRight: =Self.PaddingTop
            PaddingTop: =18
            PressedFill: =RGBA(255, 255, 255, 0.3)
            Width: =iconCircle1.Width
            X: =(Parent.Width - Self.Width) / 2
            Y: |+
              =lblSuccess.Y + lblSuccess.Height + (Self.Height / 2) - 10
      - LblSuccessMsg1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =28
            Text: |+
              =//"Your training is booked!"
              // ───────────────────────────────────────────────────────────────
              // LblSuccessMsg1.Text   (main heading/message label)
              // ───────────────────────────────────────────────────────────────
              If(
                  varAllOK,
                  "✅ Your submission was successfully submitted!",
                  "⚠️ Your submission may not have fully saved."
              )
            Width: =Parent.Width
            Y: =iconCheck1.Y + iconCheck1.Height
