            OnTimerEnd: "=If(\r\n    IsBlankOrError(varShowRedirect),\r\n    false,\r\n    varShowRedirect = true,\r\n    Concurrent(\r\n        Set(varTimer, true),\r\n        Refresh('Desk Reservations'),\r\n        Refresh(DeskAccessControl),\r\n        Refresh(MasterScheduleList),\r\n        Refresh(Desks),\r\n        Refresh(SuperUserList),\r\n        Refresh(backupList_DeskReservations),\r\n        Refresh('Learning Lab Sessions'),\r\n        ResetForm(Form1),\r\n        ResetForm(form_EditDesks),\r\n\r\n        Set(_dateSelected2, Blank()),\r\n        Set(_FirstDayinView2, Blank()),\r\n        Set(_firstDayOfMonth2, Blank()),\r\n        Set(_firstDayofWeek2, Blank()),\r\n        Set(_LastDayOfMonth2, Blank()),\r\n        Set(_MaxDate, Blank()),\r\n        Set(_MaxDate2, Blank()),\r\n        Set(_MinDate, Blank()),\r\n        Set(_MinDate2, Blank()),\r\n        \r\n        \r\n        \r\n        Set(currentItem, Blank()),\r\n        Set(endByDate, Blank()),\r\n        Set(gv_item, Blank()),\r\n        Set(maxOccurrence, Blank()),\r\n        Set(NthWeekdayRecord, Blank()),\r\n        Set(numWorkDays, Blank()),\r\n        Set(PDFPrint, Blank()),\r\n        Set(startWeekday, Blank()),\r\n        Set(submitItem, Blank()),\r\n        //Set(user_isAdmin, Blank()),\r\n        //Set(userAccessLevel_text, Blank()),\r\n        Set(var_Attendees, Blank()),\r\n        //Set(var_AuthorInfo, Blank(),\r\n        Set(var_Date, Blank()),\r\n        Set(var_Date_central, Blank()),\r\n        Set(var_DayOfWeek, Blank()),\r\n        Set(var_Duration, Blank()),\r\n        Set(var_Duration_central, Blank()),\r\n        Set(var_EmailBody, Blank()),\r\n        Set(var_EndDateTime_central, Blank()),\r\n        Set(var_EndTime, Blank()),\r\n        Set(var_EndTime_central, Blank()),\r\n        Set(var_firstHalfDuration, Blank()),\r\n        Set(var_firstHalfDuration_central, Blank()),\r\n        Set(var_ManagerEmail, Blank()),\r\n        Set(var_MeetingCategory, Blank()),\r\n        Set(var_OptionalAttendees, Blank()),\r\n        Set(var_reservationBuildingNumber, Blank()),\r\n        Set(var_reservationDivision, Blank()),\r\n        Set(var_reservationFloorNumber, Blank()),\r\n        Set(var_reservationFullDateTime, Blank()),\r\n        Set(var_reservationFullLocation, Blank()),\r\n        Set(var_reservationRole, Blank()),\r\n        Set(var_reservationRoomNumber, Blank()),\r\n        Set(var_reservationScenario, Blank()),\r\n        Set(var_scenarioTrainingMaterialsURL, Blank()),\r\n        Set(var_secondHalfTime, Blank()),\r\n        Set(var_secondHalfTime_central, Blank()),\r\n        Set(var_Service, Blank()),\r\n        Set(var_StartDateTime_central, Blank()),\r\n        Set(var_StartTime, Blank()),\r\n        Set(var_StartTime_central, Blank()),\r\n        Set(varAccept, Blank()),\r\n        Set(varAccept3, Blank()),\r\n        Set(varAccept4, Blank()),\r\n        Set(varAttendees, Blank()),\r\n        Set(varCancelContainer, Blank()),\r\n        Set(varDaily, Blank()),\r\n        Set(varDefaultEndTime, Blank()),\r\n        Set(varDescription, Blank()),\r\n        //Set(varDeskAccessControl_record, Blank()),\r\n        Set(varDeskMode, Blank()),\r\n        Set(varEndDate, Blank()),\r\n        Set(varEventEndTime, Blank()),\r\n        Set(varEventStartTime, Blank()),\r\n        Set(varImportance, Blank()),\r\n        Set(varIsImpersonating, Blank()),\r\n        Set(varManageSelectedDesk, Blank()),\r\n        Set(varMeetCat, Blank()),\r\n        Set(varOptionalAttendees, Blank()),\r\n        Set(varPopUp_ClassPicker, Blank()),\r\n        Set(varPopUp_ClassPicker_scenario, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioDate, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioDateTime, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioDayOfWeek, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioEnd24, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioEndTime, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioLocation, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioName, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioRole, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioSplit, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioStart24, Blank()),\r\n        Set(varPopUp_ClassPicker_scenarioStartTime, Blank()),\r\n        //Set(varRealEmail, Blank()),\r\n        //Set(varRealEntraID, Blank()),\r\n        Set(varRecurrence, Blank()),\r\n        Set(varRecurrenceID, Blank()),\r\n        Set(varReminder, Blank()),\r\n        //Set(varRepoVersion, Blank()),\r\n        Set(varReservePOC, Blank()),\r\n        Set(varSelectedDesk, Blank()),\r\n        Set(varSelectedReservation, Blank()),\r\n        Set(varSelectedStartDate, Blank()),\r\n        Set(varsmartboardck, Blank()),\r\n        //Set(varTargetEmail, Blank()),\r\n        //Set(varTargetEntraID, Blank()),\r\n        Set(varTitle, Blank()),\r\n        Set(varURL, Blank()),\r\n        Set(varURLName, Blank()),\r\n        Set(varUserExists, Blank()),\r\n        //Set(varUser_details, Blank()),\r\n        Set(varWeekday, Blank()),\r\n        //KYLE -  Likely remove:  Clear(col_EventBuildDetails),\r\n        Clear(col_EventCombinedDetails),\r\n        Clear(col_MasterSchedule),\r\n        Clear(colCombinedRecurrence),\r\n        Clear(colDates),\r\n        //Clear(colDeskAccess),\r\n        Clear(colDeskChckRecur),\r\n        Clear(CollectionRecurrence),\r\n        //Clear(colMenu),\r\n        Clear(colRoomFilter),\r\n        Clear(colSelectedDesks),\r\n        Clear(colSmartboard),\r\n        //Clear(colUser_details),\r\n        Clear(WeekdaysOnly),\r\n        Clear(wkDays),\r\n        Clear(wkDaysTemp)\r\n    ),\r\n    false\r\n);\r\n\r\nIf(\r\n    IsBlankOrError(varShowRedirect) && varRealEmail = \"kyle.coder@va.gov\",\r\n        Navigate(DebuggingScreen),\r\n    varShowRedirect = true,\r\n        Navigate(Dashboard),\r\n    varShowRedirect <> true && varRealEmail = \"kyle.coder@va.gov\",\r\n        Navigate(DebuggingScreen),\r\n    false\r\n);"
            OnTimerStart: "=// ╔═══════════════════════════════════════════════════════════════════════╗\n// ║  BLOCK 2 of 2                                                          ║\n// ║  PASTE INTO:  \"Success\" screen                                         ║\n// ║  PROPERTY:    OnVisible                                                ║\n// ║                                                                        ║\n// ║  Does: look up (by the GUID in OutlookSeriesID) whether the detailed  ║\n// ║        Patch actually created the row. If NOT, run the paired         ║\n// ║        SIMPLIFIED fallback into both lists. Then recompute varAllOK   ║\n// ║        and run cleanup only on full success.                          ║\n// ║                                                                        ║\n// ║  Reminder: make sure your 5-second redirect Timer starts AFTER this   ║\n// ║  OnVisible finishes (it does — OnVisible runs first).                 ║\n// ╚═══════════════════════════════════════════════════════════════════════╝\n\nClear(colFallbackResults);\n\n// Did the detailed Patch actually create the row? Look it up by the GUID\n// we stored in OutlookSeriesID. Text-to-text compare = delegable & safe.\nSet(\n    varDetailedRowExists,\n    !IsBlank(LookUp('Desk Reservations', OutlookSeriesID = varSubmissionID))\n);\n\nIf(\n    // Only run the fallback if the row is missing (detailed patch failed).\n    Not(varDetailedRowExists),\n\n    ForAll(\n        CollectionRecurrence As recS,\n        ForAll(\n            colSelectedDesks As deskS,\n\n            // simplified MAIN\n            Collect(\n                colFallbackResults,\n                {\n                    list: \"main\",\n                    ok: !IsError(\n                        Patch(\n                            'Desk Reservations',\n                            Defaults('Desk Reservations'),\n                            {\n                                OutlookSeriesID: varSubmissionID,\n                                Title: If(IsBlankOrError(var_Attendees & \" – \" & var_MeetingCategory & \" - \" & var_reservationScenario & \" (\" & var_reservationRole & \")\"), \"(not provided)\", var_Attendees & \" – \" & var_MeetingCategory & \" - \" & var_reservationScenario & \" (\" & var_reservationRole & \")\"),\n                                submitterName_text:  If(IsBlankOrError(varMyProfile.displayName), \"(not provided)\", varMyProfile.displayName),\n                                submitterEmail_text: If(IsBlankOrError(Lower(varMyProfile.mail)), \"(not provided)\", Lower(varMyProfile.mail)),\n                                studentName_text:  If(IsBlankOrError(varStudentProfile.displayName), \"(not provided)\", varStudentProfile.displayName),\n                                studentEmail_text: If(IsBlankOrError(Lower(varStudentProfile.mail)), \"(not provided)\", Lower(varStudentProfile.mail)),\n                                reservationRole_text:     If(IsBlankOrError(var_reservationRole), \"(not provided)\", var_reservationRole),\n                                reservationScenario_text: If(IsBlankOrError(var_reservationScenario), \"(not provided)\", var_reservationScenario),\n                                reservationStart_datetime: If(IsBlankOrError(var_StartDateTime_central), Blank(), var_StartDateTime_central),\n                                reservationEnd_datetime:   If(IsBlankOrError(var_EndDateTime_central), Blank(), var_EndDateTime_central),\n                                Active_choice: {Value: Text(\"true\")}\n                            }\n                        )\n                    )\n                }\n            );\n\n            // simplified BACKUP\n            Collect(\n                colFallbackResults,\n                {\n                    list: \"backup\",\n                    ok: !IsError(\n                        Patch(\n                            backupList_DeskReservations,\n                            Defaults('Desk Reservations'),\n                            {\n                                OutlookSeriesID: varSubmissionID,\n                                Title: If(IsBlankOrError(var_Attendees & \" – \" & var_MeetingCategory & \" - \" & var_reservationScenario & \" (\" & var_reservationRole & \")\"), \"(not provided)\", var_Attendees & \" – \" & var_MeetingCategory & \" - \" & var_reservationScenario & \" (\" & var_reservationRole & \")\"),\n                                submitterName_text:  If(IsBlankOrError(varMyProfile.displayName), \"(not provided)\", varMyProfile.displayName),\n                                submitterEmail_text: If(IsBlankOrError(Lower(varMyProfile.mail)), \"(not provided)\", Lower(varMyProfile.mail)),\n                                studentName_text:  If(IsBlankOrError(varStudentProfile.displayName), \"(not provided)\", varStudentProfile.displayName),\n                                studentEmail_text: If(IsBlankOrError(Lower(varStudentProfile.mail)), \"(not provided)\", Lower(varStudentProfile.mail)),\n                                reservationRole_text:     If(IsBlankOrError(var_reservationRole), \"(not provided)\", var_reservationRole),\n                                reservationScenario_text: If(IsBlankOrError(var_reservationScenario), \"(not provided)\", var_reservationScenario),\n                                reservationStart_datetime: If(IsBlankOrError(var_StartDateTime_central), Blank(), var_StartDateTime_central),\n                                reservationEnd_datetime:   If(IsBlankOrError(var_EndDateTime_central), Blank(), var_EndDateTime_central),\n                                Active_choice: {Value: Text(\"true\")}\n                            }\n                        )\n                    )\n                }\n            )\n        )\n    );\n\n    // fallback outcome\n    Set(\n        varFallbackOK,\n        CountRows(colFallbackResults) > 0 And CountIf(colFallbackResults, Not(ok)) = 0\n    )\n    // else branch: row already existed -> varFallbackOK stays TRUE (default from BLOCK 1)\n);\n\n// ── Re-compute varAllOK now that the fallback outcome is known ───────────\n// Main list is \"saved\" if the detailed row exists OR the fallback succeeded.\nSet(\n    varAllOK,\n    varCalendarOK And\n    (varDetailedRowExists Or varFallbackOK) And\n    varEmailOK And\n    varPatchSuperUsersOK\n);\n\n// ── Cleanup ONLY on full success ────────────────────────────────────────\nIf(\n    varAllOK,\n    Concurrent(\n        Set(varAccept, Blank()),\n        Set(varAccept3, Blank()),\n        Set(varAccept4, Blank()),\n        ResetForm(Form1),\n        Reset(ddImportance),\n        Reset(ddRecurrenceFrequency),\n        Reset(Calendar_1),\n        Reset(Gallery6),\n        Reset(DatePickerCanvas2),\n        Reset(Gallery3_1),\n        Clear(colSelectedDesks),\n        Clear(CollectionRecurrence),\n        Clear(colDeskChckRecur),\n        Clear(colCombinedRecurrence),\n        Clear(wkDays),\n        Clear(wkDaysTemp)\n    )\n);\n\n/*  MOVED TO 'Timer2_1.OnTimerEnd' property instead\nIf(\n    IsBlankOrError(varShowRedirect),\n    false,\n    varShowRedirect = true,\n    Concurrent(\n        Set(varTimer, true),\n        Refresh('Desk Reservations'),\n        Refresh(DeskAccessControl),\n        Refresh(MasterScheduleList),\n        Refresh(Desks),\n        Refresh(SuperUserList),\n        Refresh(backupList_DeskReservations),\n        Refresh('Learning Lab Sessions'),\n        ResetForm(Form1),\n        ResetForm(form_EditDesks),\n\n        Set(_dateSelected2, Blank()),\n        Set(_FirstDayinView2, Blank()),\n        Set(_firstDayOfMonth2, Blank()),\n        Set(_firstDayofWeek2, Blank()),\n        Set(_LastDayOfMonth2, Blank()),\n        Set(_MaxDate, Blank()),\n        Set(_MaxDate2, Blank()),\n        Set(_MinDate, Blank()),\n        Set(_MinDate2, Blank()),\n        \n        \n        \n        Set(currentItem, Blank()),\n        Set(endByDate, Blank()),\n        Set(gv_item, Blank()),\n  