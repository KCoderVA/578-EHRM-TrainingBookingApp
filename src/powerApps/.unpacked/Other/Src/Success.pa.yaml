      - LblSuccessMsg1_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Height: |+
              =100
            Italic: =true
            Size: =18
            Text: |-
              =//"You now have a Outlook calendar invite for the date/time you selected, which contains more important details about your upcoming training event/class!"
              If(
                  varAllOK = true && user_isAdmin = true,
                  "You now have a Outlook calendar invite for the date/time you selected, which contains more important details about your upcoming training event/class!"
                      & Char(10) &
                      If(varMainOK = true, "• Main reservation list = SUCCESS" & Char(10), varMainOK = false, "• Main reservation list = FAILED" & Char(10)) &
                      If(varMainSimpleOK = true, "• Main (simple) reservation list = SUCCESS" & Char(10), varMainSimpleOK = false, "• Main (simple) reservation list = FAILED" & Char(10)) &
                      If(varBackupOK = true, "• Backup reservation list = SUCCESS" & Char(10), varBackupOK = false, "• Backup reservation list = FAILED" & Char(10)) &
                      If(varBackupSimpleOK = true, "• Backup (simple) reservation list = SUCCESS" & Char(10), varBackupSimpleOK = false, "• Backup (simple) reservation list = FAILED" & Char(10)) &
                      If(varCalendarOK = true, "• Outlook calendar invite = SUCCESS" & Char(10), varCalendarOK = false, "• Outlook calendar invite = FAILED" & Char(10)),
                  varAllOK = true && user_isAdmin = false,
                      "You now have a Outlook calendar invite for the date/time you selected, which contains more important details about your upcoming training event/class!"
                      & Char(10) &
                      If(varMainOK = true, "• Main reservation list = SUCCESS" & Char(10), varMainOK = false, "• Main reservation list = FAILED" & Char(10)) &
                      //If(varMainSimpleOK = true, "• Main (simple) reservation list = SUCCESS" & Char(10), varMainSimpleOK = false, "• Main (simple) reservation list = FAILED" & Char(10)) &
                      //If(varBackupOK = true, "• Backup reservation list = SUCCESS" & Char(10), varBackupOK = false, "• Backup reservation list = FAILED" & Char(10)) &
                      If(varBackupSimpleOK = true, "• Backup (simple) reservation list = SUCCESS" & Char(10), varBackupSimpleOK = false, "• Backup (simple) reservation list = FAILED" & Char(10)) &
                      If(varCalendarOK = true, "• Outlook calendar invite = SUCCESS" & Char(10), varCalendarOK = false, "• Outlook calendar invite = FAILED" & Char(10)),
                  varAllOK = false && user_isAdmin = true,
                  "The following did NOT complete successfully:" & Char(10) &
                      If(varMainOK = false, "• Main reservation list = FAILED" & Char(10), varMainOK = true, "• Main reservation list = SUCCESS" & Char(10)) &
                      If(varMainSimpleOK = false, "• Main (simple) reservation list = FAILED" & Char(10), varMainSimpleOK = true, "• Main (simple) reservation list = SUCCESS" & Char(10)) &
                      If(varBackupOK = false, "• Backup reservation list = FAILED" & Char(10), varBackupOK = true, "• Backup reservation list = SUCCESS" & Char(10)) &
                      If(varBackupSimpleOK = false, "• Backup (simple) reservation list = FAILED" & Char(10), varBackupSimpleOK = true, "• Backup (simple) reservation list = SUCCESS" & Char(10)) &
                      If(varCalendarOK = false, "• Outlook calendar invite = FAILED" & Char(10), varCalendarOK = true, "• Outlook calendar invite = SUCCESS" & Char(10)) & 
                      "Please refresh the app (reload the web page) and submit again. If this error repeats another time, please contact the app admins via Kyle.Coder@va.gov.",
                  varAllOK = false && user_isAdmin = false,
                  "The following did NOT complete successfully:" & Char(10) &
                      If(varMainOK = false, "• Main reservation list = FAILED" & Char(10), varMainOK = true, "• Main reservation list = SUCCESS" & Char(10)) &
                      //If(varMainSimpleOK = false, "• Main (simple) reservation list = FAILED" & Char(10), varMainSimpleOK = true, "• Main (simple) reservation list = SUCCESS" & Char(10)) &
                      //If(varBackupOK = false, "• Backup reservation list = FAILED" & Char(10), varBackupOK = true, "• Backup reservation list = SUCCESS" & Char(10)) &
                      If(varBackupSimpleOK = false, "• Backup (simple) reservation list = FAILED" & Char(10), varBackupSimpleOK = true, "• Backup (simple) reservation list = SUCCESS" & Char(10)) &
                      If(varCalendarOK = false, "• Outlook calendar invite = FAILED" & Char(10), varCalendarOK = true, "• Outlook calendar invite = SUCCESS" & Char(10)) & 
                      "Please refresh the app (reload the web page) and submit again. If this error repeats another time, please contact the app admins via Kyle.Coder@va.gov."
              )
            Width: =LblSuccessMsg1.Width / 1.2
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =LblSuccessMsg1.Y + LblSuccessMsg1.Height
