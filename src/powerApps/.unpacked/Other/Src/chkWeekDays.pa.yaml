      - ContinueDatebtn:
          Control: Classic/Button@2.2.0
          Properties:
            DisplayMode: =If(Gallery3.AllItemsCount > 0, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(15, 108, 189, 1)
            Height: =45
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |-
              =// Combine Date and Time for the Start and End of the event
              Set(
                  varEventStartTime,
                  DateAdd(
                      DateTimeValue(DateValue(Calendar_1.DefaultStartDate) + TimeFromdd.Selected.Value),
                      TimeZoneOffset(),
                      TimeUnit.Minutes
                  )
              );
              Set(
                  varEventEndTime,
                  DateAdd(
                      DateTimeValue(DateValue(Calendar_1.DefaultEndDate) + TimeTodd.Selected.Value),
                      TimeZoneOffset(),
                      TimeUnit.Minutes
                  )
              );
              Set(
                  varEndDate,
                  Text(
                      Max(
                          CollectionRecurrence,
                          EndDateTime
                      ),
                      "[$-en-US]yyyy-mm-ddTHH:mm:ss"
                  )
              );
              ///Set(startTime, DateTimeValue(Text(varSelectedStartDate, DateTimeFormat.ShortDate) & " " & TimeFromdd.Selected.Value));
              ///Set(endTime,   DateTimeValue(Text(varEndDate, DateTimeFormat.ShortDate) & " " & TimeTodd.Selected.Value));
              Set(
                  varImportance,
                  Lower(ddImportance.Selected.Value)
              );
              Set(
                  varRecurrence,
                  If(
                      Radio2.Selected.Value = "Every weekday",
                      "weekly",
                                  //Else
                      Lower(ddRecurrenceFrequency.Selected.Value)
                  )
              );
              Set(
                  varReminder,
                  ddReminder.Selected.Value
              );
              Set(
                  varWeekday,
                  If(
                      ddRecurrenceFrequency.Selected.Value = "Daily" And Radio2.Selected.Value = "Every weekday",
                      Filter(
                          Gallery6.AllItems,
                          Value <> "Sunday" And Value <> "Saturday"
                      ).Value,
                              //Else
                      If(
                          ddRecurrenceFrequency.Selected.Value = "Weekly",
                          Filter(
                              Gallery6.AllItems,
                              Checkbox2.Value
                          ).Value,
                                  //Else
                          Blank()
                      )
                  )
              );




              /////////////////////////////////////////////////////////
              // --- Central Time Variables ---
              /////////////////////////////////////////////////////////
              // Build full Eastern date/times, then shift back 1 hour
              Set(
                  var_StartDateTime_central,
                  DateAdd(DateTimeValue(var_Date & " " & var_StartTime), -1, TimeUnit.Hours)
              );
              Set(
                  var_EndDateTime_central,
                  DateAdd(DateTimeValue(var_Date & " " & var_EndTime), -1, TimeUnit.Hours)
              );

              // Extract Central date (in case the -1 hour crossed midnight)
              Set(
                  var_Date_central,
                  DateValue(var_StartDateTime_central)
              );

              // Extract Central start/end times
              Set(
                  var_StartTime_central,
                  Time(
                      Hour(var_StartDateTime_central),
                      Minute(var_StartDateTime_central),
                      Second(var_StartDateTime_central)
                  )
              );
              Set(
                  var_EndTime_central,
                  Time(
                      Hour(var_EndDateTime_central),
                      Minute(var_EndDateTime_central),
                      Second(var_EndDateTime_central)
                  )
              );

              // Duration is unchanged by a timezone shift, but recompute for consistency
              Set(
                  var_firstHalfDuration_central,
                  var_EndDateTime_central - var_StartDateTime_central
              );
              Set(
                  var_Duration_central,
                  With(
                      { totalMinutes: Round(var_firstHalfDuration_central * 24 * 60, 0) },
                      Text(RoundDown(totalMinutes / 60, 0), "00") & "h " &
                      Text(Mod(totalMinutes, 60), "00") & "m"
                  )
              );

              // Rebuild the "second half" string in Central (e.g. "7:30 AM - 12:30 PM")
              Set(
                  var_secondHalfTime_central,
                  Text(var_StartDateTime_central, "h:mm AM/PM") & " - " & Text(var_EndDateTime_central, "h:mm AM/PM")
              );


              Navigate(Confirm);








              /*
              If(
                  false And false,
                  Notify(
                      "You must select a date and time to continue",
                      NotificationType.Warning
                  ),

                  ClearCollect(
                      colBookedDesks,
                      Filter(
                          'Desk Reservations',
                          ('Check Out From' < varEventEndTime And ('Check Out From' >= varEventStartTime Or 'Check Out To' > varEventStartTime))
                      )
                  );
                  ForAll(
                      Filter(
                          colBookedDesks,
                          Asset.Value = "Room"
                      ) As bd,
                      Collect(
                          colBookedDesks,
                          RenameColumns(
                              ShowColumns(
                                  Filter(
                                      Desks,
                                      'Room Location' = bd.DeskText And !(Asset.Value in [
                                          "Desk",
                                          "Item",
                                      ])
                                  ),
                                  Asset,
                                  ItemID_title,
                                  RoomLocation
                              ),
                              Title,
                              DeskText,
                              RoomLocation,
                              DeskFloor
                          )
                      )
                  )
              );
              // Create a collection for distinct room locations
              ClearCollect(
                  colRoomLocations,
                  {Value: "All Conference Rms"}// Add "All Conference Rms" option first
              );
              // Append distinct room locations to the collection
              Collect(
                  colRoomLocations,
                  Distinct(
                      Filter(
                          Desks,
                          Asset.Value in [
                              "Desk",
                              "Item"
                          ])
                      ),
                      ItemID_title
                  )
              );
              */


              /*
              Set(varInterval2, Text(ddRecurrenceFrequency.Selected.Value));
              Set(varFirstDayName, Text(Min(CollectionRecurrence, StartDateTime), "dddd"));
              Set(varRecurringtimes, RecurringWeekdd.Selected.Value);
              Set(varStartDate,Text(Min(CollectionRecurrence, StartDateTime), "[$-en-US]yyyy-mm-ddTHH:mm:ss"));
              Set(varReEndDate, Text(Max(CollectionRecurrence, EndDateTime), "[$-en-US]mm-dd-yyy"));
