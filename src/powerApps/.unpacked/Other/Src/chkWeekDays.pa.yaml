Screens:
  chkWeekDays:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =UpdateContext(
        {
            varDefaultTime: With(
                {
                    CorrectedHour: Hour(DateAdd(varPopUp_ClassPicker_scenarioStartTime, RoundUp(Minute(varPopUp_ClassPicker_scenarioStartTime)/15,0)*15 - Minute(varPopUp_ClassPicker_scenarioStartTime), TimeUnit.Minutes)),
                    CorrectedMinute: Mod(RoundUp(Minute(varPopUp_ClassPicker_scenarioStartTime) / 15, 0) * 15, 60)
                },
                // Construct a pure Time value from the corrected hour and minute.
                Time(CorrectedHour, CorrectedMinute, 0)
            ),
            Date: With(
                {
                    CorrectedHour: Hour(DateAdd(varPopUp_ClassPicker_scenarioStartTime, RoundUp(Minute(varPopUp_ClassPicker_scenarioStartTime)/15,0)*15 - Minute(varPopUp_ClassPicker_scenarioStartTime), TimeUnit.Minutes)),
                    CorrectedMinute: Mod(RoundUp(Minute(varPopUp_ClassPicker_scenarioStartTime) / 15, 0) * 15, 60)
                },
                // Construct a pure Time value from the corrected hour and minute.
                Date(
                    Year(varPopUp_ClassPicker_scenarioDate),
                    Month(varPopUp_ClassPicker_scenarioDate),
                    Day(varPopUp_ClassPicker_scenarioDate)
                )
            )
        }
        );
        Reset(Calendar_1);
        Reset(TimeFromdd);
        Reset(TimeTodd);
        Select(calClickBtn);

        /*
        UpdateContext({
            varDefaultTime: With(
                {
                    // Calculate the current time plus any minutes needed to get to the next hour if rounding up.
                    // Example: At 12:50, RoundedUpMinutes will be 60. This adds 60 minutes, making it 1:50.
                    // We only use the hour from this, which is 1.
                    CorrectedHour: Hour(DateAdd(Now(), RoundUp(Minute(Now())/15,0)*15 - Minute(Now()), TimeUnit.Minutes)),

                    // Calculate just the rounded-up minute value (0, 15, 30, or 45).
                    // Example: At 12:50, this results in 0 (since it's the start of the next hour).
                    CorrectedMinute: Mod(RoundUp(Minute(Now()) / 15, 0) * 15, 60)
                },
                // Construct a pure Time value from the corrected hour and minute.
                Time(CorrectedHour, CorrectedMinute, 0)
            )
        });
        Reset(TimeFromdd);
        Reset(TimeTodd);
        Select(calClickBtn)
        */
