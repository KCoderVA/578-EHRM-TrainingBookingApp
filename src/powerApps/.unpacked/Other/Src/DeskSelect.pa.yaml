                  CheckboxSize: =40
                  Default: |-
                    =If(
                        ThisItem.ProjectorEquipped_boolean = "Yes",
                        true,
                        false
                    )
                  DisplayMode: =DisplayMode.View
                  FocusedBorderThickness: =0
                  Height: =(Checkbox1.Height + Checkbox1_1.Height)
                  Italic: =true
                  OnSelect: =Select(Parent)
                  Size: =14
