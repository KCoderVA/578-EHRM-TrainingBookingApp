            Height: =40
            Icon: =Icon.Location
            OnSelect: =UpdateContext({showMap:true})
            TabIndex: =7
            Visible: |-
              =If(
                  IsBlankOrError(LookUp(Desks,ItemID_title = varSelectedReservation.DeskText).LocationMap_picture) || LookUp(Desks,ItemID_title = varSelectedReservation.DeskText).LocationMap_picture = "",
                  false,
                  true
