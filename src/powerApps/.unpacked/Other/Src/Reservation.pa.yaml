      - tbReservedOn:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Map Link Input"
            Align: =Align.Right
            BorderColor: =RGBA(179, 179, 179, 1)
            BorderThickness: =1
