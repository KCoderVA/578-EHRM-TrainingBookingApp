            Y: =tbReservedOn.Y + tbReservedOn.Height + 5
      - tbDescrDesk_5:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Desk Description Input"
            BorderColor: =RGBA(179, 179, 179, 1)
            BorderThickness: =1
            Default: |-
              =If(
                  !IsBlank(varSelectedReservation.reservationDesk_text),
                  Concatenate(
                      varSelectedReservation.reservationDesk_text,
                      "
                      "
                      ),
                  ""
              )
              &
              varSelectedReservation.reservationRoom_text
              & "
              " &
              varSelectedReservation.reservationFloor_text
              & "
              " &
              varSelectedReservation.reservationBuilding_text
              & "
              " &
              varSelectedReservation.reservationDivision_text


              //varSelectedReservation.reservationRoom & varSelectedReservation.reservationFloor & varSelectedReservation.reservationBuilding & varSelectedReservation.reservationDivision
              //LookUp(Desks,Title = varSelectedReservation.DeskText).Description
            DisplayMode: =DisplayMode.View
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: |-
              =If(
                  IsBlank(varSelectedReservation.reservationDesk_text),
                  111,
                  130
              )
            Mode: =TextMode.MultiLine
            Size: =15.5
            Width: =tbNameDesk_1.Width
            X: =lblFloorDesk_1.X + 20
            Y: =lblFloorDesk_1.Y + lblFloorDesk_1.Height
