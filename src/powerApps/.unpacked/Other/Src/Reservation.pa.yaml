            Y: =btnBack.Y
      - btnBack:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(128, 128, 128, 1)
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |-
              =Reset(tbDescrDesk_1);
              Reset(tbMapDesk_1);
              Reset(tbNameDesk_1);
              Back()
            Size: =18
            Text: ="Go Back"
            Width: =200
            X: =Parent.Width - Self.Width - 20
            Y: =Parent.Height - Self.Height - 20
      - iconViewMap_1:
