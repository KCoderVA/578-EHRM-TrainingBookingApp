      - Rectangle2_8:
          Control: Rectangle@2.3.0
          Group: grpHeader_8
          Properties:
            Fill: =RGBA(135, 78, 181, 0.65)
            Height: =Image2_9.Height
            Width: =Parent.Width
      - lblMyAppointments_3:
