      - btnUpdate_5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(15, 84, 140, 1)
            Fill: =RGBA(39, 113, 194, 1)
            Height: =btnBack.Height / 2
            HoverFill: =ColorFade(Self.Fill, -20%)
            Italic: =true
            OnSelect: |-
              =Launch(
                  "mailto:VHAHINInformaticsTrainingAndSupport@va.gov?"
                  & "cc="
                      & User().Email
                      & ",Kyle.Coder@va.gov"
                  & "&subject="
                      & "Assistance%20requested%20regarding%20reservation%20%23"
                      & varSelectedReservation.ID
                  & "&body="
                      &"I%20previously%20made%20a%20reservation%20(%23"
                      & varSelectedReservation.ID
                      & ")%20in%20your%20%22578%20EHRM%20Training%20App%22%2C%20but%20I%20need%20assistance%20or%20have%20questions%2Fconcerns%20about%20my%20reservation.%0A%20%20%20%20%20%20%20%20%20%20Reservation%20Link%3A%20%20%20https%3A%2F%2Fdvagov.sharepoint.com%2Fsites%2FHinesInformatics%26AdvancedAnalytics%2F578_EHRM_TrainingApp%2FLists%2FDesk%2520Reservations%2FAllItems.aspx%3Fview%3D7%26q%3D"
                      & varSelectedReservation.ID
                      & "%0A%0A%0AThe%20assistance%20I%20need%20is...."

              )


              /*Launch(
                  "mailto:Celina.Ceballo@va.gov,Amy.Garner2@va.gov,Brenda.Beben@va.gov?cc=Kyle.Coder@va.gov&subject=Assistance%20requested%20regarding%20reservation%20%28%23"
                  & varSelectedReservation.ID
                  & "%29in%20578%20EHRM%20Training%20App%21&body=I%20need%20assistance%20or%have%questions%about%20my%20reservation%20%28%23"
                  & varSelectedReservation.ID
                  & "%29%20within%20the%20578%20EHRM%20Training%20App%21
                      %0D%0A%0D%0AThe%20issue%20I%20need%20assistance%20with%20is%20......"
              )*/
            Size: =btnCancel.Size / 1.5
            Text: ="Contact the EHRM Trainers about this item (#" & varSelectedReservation.ID & ")"
            Width: =(btnCancel.Width * 2) + (btnBack.X - btnCancel.X - btnBack.Width)
            X: =btnCancel.X
            Y: =(btnCancel.Y - Self.Height) - (btnBack.X - btnCancel.X - btnBack.Width)
      - Rectangle3_5:
          Control: Rectangle@2.3.0
          Group: grpConfirmCancel_1
          Properties:
            Fill: =RGBA(116, 116, 116, 0.85)
            Height: =Parent.Height - Image2_9.Height
            Visible: =varConfirmCancel
            Width: =Parent.Width
            Y: =Image2_9.Y + Image2_9.Height
      - bgRounded_12:
          Control: HtmlViewer@2.1.0
          Group: grpConfirmCancel_1
          Properties:
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =Rectangle3_5.Height / 1.75
            HtmlText: |-
              =//"<div style='border:1px gray;border-radius:10%;height:450px;width:100%;background-color:#FCFCFC'></div>"
              "<div style='border:1px gray;border-radius:10%;height:250px;width:100%;background-color:#FCFCFC'></div>"
            Size: =24
            Visible: =varConfirmCancel
            Width: =Rectangle3_5.Width / 1.75
            X: =(Rectangle3_5.Width / 2) - (Self.Width / 2)
            Y: =(Rectangle3_5.Height / 2)
      - Label1_2:
          Control: Label@2.5.1
          Group: grpConfirmCancel_1
          Properties:
            Align: =Align.Center
            FontWeight: =FontWeight.Semibold
            Height: =93
            Size: =24
            Text: ="Are you sure you want to cancel this?"
            Visible: =varConfirmCancel
            Width: =bgRounded_12.Width - 20
            X: =bgRounded_12.X + 10
            Y: =bgRounded_12.Y + 20
      - btnConfirmCancel_2:
          Control: Classic/Button@2.2.0
          Group: grpConfirmCancel_1
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(128, 128, 128, 1)
            Height: =72
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |-
              =UpdateContext({varConfirmCancel: false})
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Size: =22
            Text: ="NEVERMIND"
            Visible: =varConfirmCancel
            Width: =234
            X: =Label1_2.X + 50
            Y: =364
      - btnConfirmDelete_2:
          Control: Classic/Button@2.2.0
          Group: grpConfirmCancel_1
          Properties:
            BorderThickness: =0
            Fill: =RGBA(184, 0, 0, 1)
            Height: =72
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |-
              =Remove(
                  'Desk Reservations',
                  varSelectedReservation
              );
              UpdateContext({varConfirmCancel: false});
              Back()
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Size: =22
            Text: ="CONFIRM"
            Visible: =varConfirmCancel
            Width: =258
            X: =Label1_2.X + Label1_2.Width - Self.Width - 50
            Y: =364
