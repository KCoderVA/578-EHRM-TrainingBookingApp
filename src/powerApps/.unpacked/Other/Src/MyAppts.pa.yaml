          Properties:
            Fill: =RGBA(135, 78, 181, 1)
            Height: =5
            Visible: =prevSelected
            Width: =lblPrev.Width
            X: =lblPrev.X
            Y: =lblPrev.Y + lblPrev.Height - Self.Height
      - rectUpSel:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(135, 78, 181, 1)
            Height: =5
            Visible: =upSelected
            Width: =lblUpcoming.Width
            X: =lblUpcoming.X
            Y: =lblUpcoming.Y + lblUpcoming.Height - Self.Height
