      - btnUpdate:
          Control: Classic/Button@2.2.0
          Properties:
            Fill: =RGBA(135, 78, 181, 1)
            FontWeight: =FontWeight.Bold
            HoverFill: =ColorFade(Self.Fill, -20%)
            OnSelect: |
              =Set(
                  submitItem,
                  Blank()
              );
              Set(
                  submitItem,
                  Patch(
                      Desks,
                      Defaults(Desks),
                      {
                          ItemID_title: tbNameDesk.Text,
                          Asset: ddAsset.SelectedText,
                          'Room Location': tbFloorDesk.Text,
                          //DeskLocation: tbDeskLocation.Text,
                          RoomPicture: tbRoomPhoto.Text,
                          Active: toggleActive.Value,
                          //'Map Link': tbMapDesk.Text,
                          Description: tbDescrDesk.Text,
                          //SmartBoard: If(SmarBoardckb.Value = true, smartboard, Blank()),
                          //Projector_x002f_TV: If(Ptvckb.Value = true, projector, Blank()),
                          //VTel: If(Vtelckb.Value = true, vtel, Blank()),
                          Capacity: Int(ddCapacity.Selected.Value)
                          }
                  )
              );
              If(
                  IsBlankOrError(submitItem),
                  Notify(
                      "Something went wrong. Your item has not been submitted." & Last(Errors(Desks)).Message,
                      NotificationType.Error,
                      10000
                  ),
                  Notify(
                      "Your item has been submitted. (ID: " & submitItem.ID & ")",
                      NotificationType.Success,
                      5000
                  );
                  Set(
                      currentItem,
                      submitItem
                  )
              );
              Reset(tbFloorDesk);
              Reset(tbNameDesk);
              Reset(toggleActive);
              Reset(tbDescrDesk);
              Reset(tbMapDesk);
              Reset(tbDeskLocation_2);
              Reset(tbRoomPhoto);
              Reset(ddAsset);
              Reset(SmarBoardckb);
              Reset(Vtelckb);
              Reset(Ptvckb);
              Navigate(ManageDesks);
            Text: ="Submit"
            Width: =224
            X: =912
            Y: =69
