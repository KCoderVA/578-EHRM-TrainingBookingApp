Screens:
  Dashboard:
    Properties:
      Fill: =RGBA(0, 63, 114, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnHidden: =Set(varTimer, true);
      OnVisible: =Set(varTimer, true);
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - bgRounded_3:
          Control: HtmlViewer@2.1.0
          Properties:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =5
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: |-
              =//623
              Parent.Height - Self.Y
            HtmlText: |-
              =//"<div style='border:1px gray;border-radius:10%;height:600px;width:100%;background-color:#FCFCFC'></div>"
              "<div style='border:5px solid #b4d6fa;border-radius:8px;height:" & (Parent.Height - Self.Y - 20) & "px;width:100%;background-color:#fcfcfc;'></div>"
            Size: =24
            Visible: =false //gallMyReservationsPreview.Visible
            Width: =528
            X: =608
            Y: =17
      - bgRounded_4:
          Control: HtmlViewer@2.1.0
          Properties:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =5
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =bgRounded_3.Height
