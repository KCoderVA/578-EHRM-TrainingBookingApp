                  VerticalAlign: =VerticalAlign.Top
                  Visible: =If(Upper(Text(DateTimeValue(ThisItem.'Check Out From'),"[$-en-US]dd")) = Upper(Text(DateTimeValue(ThisItem.'Check Out To'),"[$-en-US]dd")), false, true)
