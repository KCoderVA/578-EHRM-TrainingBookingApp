                              Icon: Icon.Add,
                              Page: POCSUPERVISOR,
                              Visible: true
                          }
                      ),

                      // Advanced 'Project Leader' Role: full menu without UserManagement
                      userAccessLevel_text in ["ProjectLeader"],
                      ClearCollect(
                          colMenu,
                          {
                              Name: "Home",
                              Icon: Icon.Home,
                              Page: Dashboard,
                              Visible: true
                          },
                          {
                              Name: "Items",
                              Icon: Icon.Bookmark,
                              Page: MyAppts,
                              Visible: true
                          },
                          {
                              Name: "Desks",
                              Icon: Icon.ComputerDesktop,
                              Page: ManageDesks,
                              Visible: true
                          },
                          {
                              Name:"Help",
                              Icon: Icon.Help,
                              Page: ReleaseNotes,
                              Visible: true
                          },
                          {
                              Name: "New",
                              Icon: Icon.Add,
                              Page: POCSUPERVISOR,
                              Visible: true
                          }
                      ),

                      // Standard user
                      userAccessLevel_text in ["User", "SuperUser"],
                      ClearCollect(
                          colMenu,
                          {
                              Name: "Home",
                              Icon: Icon.Home,
                              Page: Dashboard,
                              Visible: true
                          },
                          {
                              Name: "Items",
                              Icon: Icon.Bookmark,
                              Page: MyAppts,
                              Visible: true
                          },
                          {
