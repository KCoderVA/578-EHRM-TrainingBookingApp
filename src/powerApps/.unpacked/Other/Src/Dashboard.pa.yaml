      - HtmlText2:
          Control: HtmlViewer@2.1.0
          Properties:
            Font: =Font.'Open Sans'
            Height: =342
            HtmlText: |-
              =If(
                  userAccessLevel_text = "AccessDenied",
                      ("Your application user access has been revoked. Please contact the application admins regarding this message!"),
                  ("<div style='font-size:14px; text-align:center'>Welcome to the Edward Hines Jr. VA Hospital's</div>
                          <br><div style='font-size:18px; text-align:center; font-weight:bold;'>EHRM Training Reservation Portal!</div>
                          <br>
                          <div style='font-size:14px;'>Within this app, individual desks & classrooms may be reserved to participate in upcoming '<b><u>Super User</u></b>' or '<b><u>End User Virtual Instructor Led Training (VILT)</u></b>' training events provided by the Hines EHRM Training Coordinators.
                          <br>
                          <br>
                          Each reserved workstation will provide a monitor, keyboard, mouse, barcode scanner, and laptop to each training event participant. <i>***Please bring your own headphones with microphone, as other trainees may be participating in different classes simultaneously***</i>
                          <br>
                          <br>  
                          You may contact the following Hines EHRM Training Coordinators for any training questions or reservation issues: 
                          <a href='mailto:Celina.Ceballo@va.gov?subject=Training%20Reservation%20or%20Booking%20App'>Celina Ceballo</a>,
                          <a href='mailto:Amy.Garner2@va.gov?subject=Training%20Reservation%20or%20Booking%20App'>Amy Garner</a>,
                          <a href='mailto:Brenda.Beben@va.gov?subject=Training%20Reservation%20or%20Booking%20App'>Brenda Beben</a>
                          . Alternatively, please feel free to reach out to the Edward Hines Jr. VA Hospital's <a href='mailto:hinesehrmclt@va.gov?subject=Training%20Reservation%20or%20Booking%20App'>EHRM Change Leadership Team (CLT)</a> if you have any other concerns related to the EHRM roll-out process.</div>")
              )
            Size: =
            Width: =608
            Y: =211
