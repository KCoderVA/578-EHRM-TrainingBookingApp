            Y: =bgRounded_3.Y
      - lblNoResDashboard:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            FontWeight: |-
              =If(
                  userAccessLevel_text = "AccessDenied",
                  FontWeight.Bold,
                  FontWeight.Lighter
              )
            Height: =88
            Size: |-
              =If(
                  userAccessLevel_text = "AccessDenied",
                  40,
                  25
              )
            Text: |-
              =If(
                  userAccessLevel_text = "AccessDenied" || IsBlankOrError(userAccessLevel_text),
                  "ACCESS DENIED!",
                  "No upcoming reservations!"
              )
            Visible: |-
              =false
              /*
              If(
                  ((CountRows(gallMyReservationsPreview.AllItems) >= 1) && (gallMyReservationsPreview.Visible = true)),
                      false,
                  ((CountRows(gallMyReservationsPreview.AllItems) < 1) && (gallMyReservationsPreview.Visible = true)),
                      true,
                  (gallMyReservationsPreview.Visible = false),
                      false,
                  true
              )
              */
            Width: =bgRounded_3.Width
            X: =bgRounded_3.X
            Y: |-
              =//353
              ((bgRounded_3.Y / 2) + (bgRounded_3.Height / 2)) - (Self.Height / 2)
