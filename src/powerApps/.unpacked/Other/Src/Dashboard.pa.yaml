Screens:
  Dashboard:
    Properties:
      Fill: =RGBA(236, 236, 236, 1)
      Height: =Max(App.Height, App.DesignHeight)
      OnVisible: |-
        =ClearCollect(colMenu, Blank());
        Set(
            _CurrentUser,
            User()
        );
        Set(
            _CurrentDate2,
            Today()
        );
        Set(
            _CurrentUser,
            User()
        );
        Set(
            _CurrentDate2,
            Today()
        );
        Set(
            varTimer,
            true
        );
        Set(
            currentUser,
            User()
        );
        Set(
            varTimer,
            false
        );
        Set(
            varUser,
            User()
        );
        ClearCollect(CollectionRecurrence, Blank());
        Refresh(DeskAccessControl);
        ClearCollect(userAccessDemographics, Blank());
        Set(isUserAdminSPList, false);

        Set(
            isUserAdminSPList,
            !IsBlank(
                LookUp(
                    DeskAccessControl,
                    Lower(Email_Text) = Lower(User().Email)
                )
            )
        );
        If(
            isUserAdminSPList = true, 
            ClearCollect(
                userAccessDemographics,
                Filter(
                    DeskAccessControl,
                    Lower(Email_Text) = Lower(User().Email)
                )
            ); Set(
                userAccessLevel_text,
                    LookUp(
                        DeskAccessControl,
                        (!IsBlank(AccessLevel_Text) && Lower(Email_Text) = Lower(User().Email)),
                        AccessLevel_Text
                    )
                ),
            isUserAdminSPList = false,
            Patch(
                DeskAccessControl,
                {
                    Email_Text: Lower(User().Email),
                    AccessLevel_Choice:
                        {
                            Value: "User"
                            //Value: "AccessDenied"
                            //Value: "View-only"
                            //Value: "User"
                            //Value: "SuperUser"
                            //Value: "Manager"
                            //Value: "ServiceChief"
                            //Value: "ProjectLeader"
                            //Value: "AppAdmin"
                        }
                }
            ); Set(isUserAdminSPList, true); Set(userAccessLevel_text, "User")
        );
        If(
            (userAccessLevel_text = "SuperUser"
                || userAccessLevel_text = "Manager"
                || userAccessLevel_text = "ServiceChief"
                || userAccessLevel_text = "ProjectLeader"
                || userAccessLevel_text = "AppAdmin"
                ), 
            Collect(
                colMenu, 
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    },
                   {
                        Name: "Book",
                        Icon: Icon.Add,
                        Page: POCSUPERVISOR,
                        Visible: true
                    },
                    {
                        Name: "Manage Rooms",
                        Icon: Icon.ComputerDesktop,
                        Page: ManageDesks,
                        Visible: true
                    }
            ),
                (userAccessLevel_text = "User"),
                ClearCollect(
                    colMenu,
                    Table(
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    },
                   {
                        Name: "Book",
                        Icon: Icon.Add,
                        Page: POCSUPERVISOR,
                        Visible: true
                    }         
                )
            ),
            (userAccessLevel_text = "View-only"),
                ClearCollect(
                colMenu,
                Table(
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    }        
                )
            ),
        (userAccessLevel_text = "AccessDenied"),
            ClearCollect(
                colMenu,
                Blank()
            )
        );
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - Button5:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =37
            OnSelect: =Navigate(scrn_WeeklyCal)
            Text: ="View calendars!"
            Width: =333
            X: =137
            Y: =591
      - Image2_13:
          Control: Image@2.2.3
          Properties:
            Height: =211
            Image: =abstractBackground
            ImagePosition: =ImagePosition.Fill
            Width: =Parent.Width
      - bgRounded_3:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            Font: =Font.'Open Sans'
            Height: =623
            HtmlText: ="<div style='border:1px gray;border-radius:10%;height:600px;width:100%;background-color:#FCFCFC'></div>"
            Size: =24
            Width: =528
            X: =608
            Y: =17
      - gallMyReservationsPreview:
