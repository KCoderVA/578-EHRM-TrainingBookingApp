Screens:
  Screen2:
    Properties:
      OnHidden: =Timer2.Reset
      OnVisible: |+
        =Set(user_Access-testing, Blank());
        Timer2.Start
    Children:
      - Timer2:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            AutoStart: =true
            Duration: =10250
            OnTimerEnd: |-
              =Set(
                  user_isAdmin,
                  !IsBlank(
                      LookUp(
                          DeskAccessControl,
                          Lower(Email_Text) = Lower(Lower(varDeskAccessControl_record.Email_Text))
                      )
                  )
              );
              If(
                  user_isAdmin = true, 
                  ClearCollect(
                      varUser_details,
                      Filter(
                          DeskAccessControl,
                          Lower(Email_Text) = Lower(Lower(varDeskAccessControl_record.Email_Text))
                      )
                  )
              );

              If(
                  //!IsBlank(DeskAccessControl.'Email_Person'),
                  !IsBlank(
                      Filter(
                          DeskAccessControl,
                          Lower(Email_Text) = Lower(Lower(varDeskAccessControl_record.Email_Text))
                      )
                  ),
                  Set(user_Access-testing, "True: Source data is found!"),
                  Refresh(DeskAccessControl) && Set(user_Access-testing, "False: Source data is not found!") && Reset(Timer2)    
                  //Navigate(Dashboard),
                  //&& Navigate(Screen2)
              );
              Refresh(DeskAccessControl)
            OnTimerStart: |-
              =Set(varUser_details, Blank());
              Set(user_isAdmin, false);
            Repeat: =true
            Reset: =true
            X: =40
            Y: =40
      - TextCanvas3:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            Height: =118
            Size: =36
            Text: |-
              =If(
                  user_Access-testing = "True: Source data is found!",
                      "True: Source data is found! Redirecting you back to dashboard!",
                  user_Access-testing = "False: Source data is not found!",
                      "False: Source data is not found! Starting timer over again for another refresh attempt...",
                  user_Access-testing = Blank(),
                      "Error: The 'user_Access-testing' value is currently 'Blank()'..."
              )
            VerticalAlign: =VerticalAlign.Middle
            Weight: ='TextCanvas.Weight'.Bold
            Width: =1136
            Y: =197
      - TextCanvas3_1:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            Height: =255
            Size: =32
            Text: |-
              ="You will be redirected automatically after data refresh is completed.

              This should take no longer than 10 seconds...."
            Width: =516
            X: =320
            Y: =375
