        OnSelect: |-
            =/*
            Reset(tbFloorDesk);
            Reset(tbNameDesk);
            Reset(toggleActive);
            Reset(tbDescrDesk);
            Reset(tbMapDesk);
            Reset(tbDeskLocation_2);
