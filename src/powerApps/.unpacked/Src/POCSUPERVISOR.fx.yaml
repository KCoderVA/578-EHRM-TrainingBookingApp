                            "Wednesday 12/09/2026 @ 2:30 PM - 4:00 PM",
                            "Wednesday 12/09/2026 @ 3:00 PM - 4:00 PM"
                        ]
                    */
                OnChange: |-
                    =Set(varPopUp_ClassPicker_scenarioDateTime, Self.Selected.Value);
                    Set(var_reservationFullDateTime, Self.Selected.Value);
                    
                    /////////////////////////////////////////////////////////
                    // --- Eastern (default) Time Variables ---
                    /////////////////////////////////////////////////////////
                    // Build full Eastern date/time:
                        Set(
                            var_DayOfWeek,
                            First(Split(var_reservationFullDateTime, " ")).Value
                        );
                        Set(
                            var_Date,
                            Date(
                                Year(Index(Split(var_reservationFullDateTime, " "), 2).Value),
                                Month(Index(Split(var_reservationFullDateTime, " "), 2).Value),
                                Day(Index(Split(var_reservationFullDateTime, " "), 2).Value)
                            )
                        );
                        Set(
                            var_secondHalfTime,
                            Trim(Last(Split(var_reservationFullDateTime, "@")).Value)
                            );
                        Set(
                            var_StartTime,
                            Time(
                                Hour(Trim(First(Split(var_secondHalfTime, "-")).Value)),
                                Minute(Trim(First(Split(var_secondHalfTime, "-")).Value)),
                                Second(Trim(First(Split(var_secondHalfTime, "-")).Value))
                            )
                        );
                        Set(
                            var_EndTime,
                            Time(
                                Hour(Trim(Last(Split(var_secondHalfTime, "-")).Value)),
                                Minute(Trim(Last(Split(var_secondHalfTime, "-")).Value)),
                                Second(Trim(Last(Split(var_secondHalfTime, "-")).Value))
                            )
                        );
                    Set(
                        var_firstHalfDuration,
                            DateAdd(DateTimeValue(var_Date & " " & var_EndTime), 0) - DateTimeValue(var_Date & " " & var_StartTime)
                    );
                    Set(
                        var_Duration,
                        With(
                            { totalMinutes: Round(var_firstHalfDuration * 24 * 60, 0) },
                            Text(RoundDown(totalMinutes / 60, 0), "00") & "h " & 
                            Text(Mod(totalMinutes, 60), "00") & "m"
                        )
                    );
                    
                    
                    /////////////////////////////////////////////////////////
                    // --- Central Time Variables ---
                    /////////////////////////////////////////////////////////
                    // Build full Eastern date/times, then shift back 1 hour
                    Set(
                        var_StartDateTime_central,
                        DateAdd(DateTimeValue(var_Date & " " & var_StartTime), -1, TimeUnit.Hours)
                    );
                    Set(
                        var_EndDateTime_central,
                        DateAdd(DateTimeValue(var_Date & " " & var_EndTime), -1, TimeUnit.Hours)
                    );
                    
                    // Extract Central date (in case the -1 hour crossed midnight)
                    Set(
                        var_Date_central,
                        DateValue(var_StartDateTime_central)
                    );
                    
                    // Extract Central start/end times
                    Set(
                        var_StartTime_central,
                        Time(
                            Hour(var_StartDateTime_central),
                            Minute(var_StartDateTime_central),
                            Second(var_StartDateTime_central)
                        )
                    );
                    Set(
                        var_EndTime_central,
                        Time(
                            Hour(var_EndDateTime_central),
                            Minute(var_EndDateTime_central),
                            Second(var_EndDateTime_central)
                        )
                    );
                    
                    // Duration is unchanged by a timezone shift, but recompute for consistency
                    Set(
                        var_firstHalfDuration_central,
                        var_EndDateTime_central - var_StartDateTime_central
                    );
                    Set(
                        var_Duration_central,
                        With(
                            { totalMinutes: Round(var_firstHalfDuration_central * 24 * 60, 0) },
                            Text(RoundDown(totalMinutes / 60, 0), "00") & "h " &
                            Text(Mod(totalMinutes, 60), "00") & "m"
                        )
                    );
                    
                    // Rebuild the "second half" string in Central (e.g. "7:30 AM - 12:30 PM")
                    Set(
                        var_secondHalfTime_central,
                        Text(var_StartDateTime_central, "h:mm AM/PM") & " - " & Text(var_EndDateTime_central, "h:mm AM/PM")
                    );
                    
                    Reset(dropdown_LocationPicker);
                    
                    
                    
                    
                    
                    
                    
