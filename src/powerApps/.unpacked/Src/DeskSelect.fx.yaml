                && (!IsBlankOrError(Dropdown1_1) || !IsBlankOrError(Dropdown1_1.SelectedText.Value) || !IsBlankOrError(Dropdown1_1.Selected))),
                    Filter(
                        Desks,
                        (Active_text = "yes" || Active_boolean = true),
                        (DeskNumber_number <> Blank()),
                        (Dropdown1_1.Selected.Value = RoomNumber_number)
                    ),
                ((!IsBlankOrError(Dropdown1) || !IsBlankOrError(Dropdown1.SelectedText.Value) || !IsBlankOrError(Dropdown1.Selected))
                && (!IsBlankOrError(Dropdown1_1) || !IsBlankOrError(Dropdown1_1.SelectedText.Value) || !IsBlankOrError(Dropdown1_1.Selected))),
                    Filter(
                        Desks,
                        (Active_text = "yes" || Active_boolean = true),
                        (DeskNumber_number <> Blank()),
