"Success As screen.'phoneLayout_Success_ver3.0'":
    Fill: =RGBA(236, 236, 236, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =// ═══════════════════════════════════════════════════════════════
        // SUCCESS SCREEN  —  property-by-property formulas
        // ═══════════════════════════════════════════════════════════════
        
        // ───────────────────────────────────────────────────────────────
        // SCREEN.OnVisible
        // ───────────────────────────────────────────────────────────────
        // Decide once whether everything succeeded. Only start the auto-
        // redirect timer when it did; otherwise the user stays here to read
        // the warning and must dismiss manually.
        If(
            (varCalendarOK = true && (varMainOK = true || varMainSimpleOK = true) && (varBackupOK = true || varBackupSimpleOK = true)),
            Set(varAllOK, true) && Set(varShowRedirect, varAllOK),
            (varCalendarOK <> true && (varMainOK <> true || varMainSimpleOK <> true) && (varBackupOK <> true || varBackupSimpleOK <> true)),
            Set(varAllOK, false) && Set(varShowRedirect, varAllOK)
        )
    Width: =Max(App.Width, App.DesignWidth)

    Image2_3 As image:
        BorderColor: =App.Theme.Colors.Darker40
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Height: =150
        Image: =abstractBackground
        ImagePosition: =ImagePosition.Fill
        Width: =Parent.Width
        ZIndex: =1

    iconCircle1 As circle.Circle:
