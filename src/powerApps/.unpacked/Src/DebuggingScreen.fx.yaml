                    // ============================================================
                    // 1. Initialization & Setup
                    // ============================================================
                    // Set initialization loading screen
                    Set(
                        varTimer,
                        true
                    );
                    // Real signed-in identity — never changes, cannot be spoofed
                    /*
                    Set(
                        varRealEmail,
                        Lower(varRealEmail)
                    );
                    Set(
                        varRealEntraID,
                        varRealEntraID
                    );
                    */
                    // The pseudonym identity of the user the app is currently 'acting as' (defaults to the real user until changed).
                    Set(
                        varTargetEmail,
                        varRealEmail
                    );
                    Set(
                        varTargetEntraID,
                        varRealEntraID
                    );
                    Set(
                        varIsImpersonating,
                        If(
                            varTargetEmail = "kyle.coder@va.gov",
                            false,
                            varRealEmail <> varTargetEmail,
                            true,
                            false
                        )
                    );
                    // Refresh SharePoint list/data sources, then ClearCollect newest info
                    Refresh('Desk Reservations');
                    Refresh(DeskAccessControl);
                    Refresh(Desks);
                    Refresh(MasterScheduleList);
                    Refresh(SuperUserList);
                    Refresh(backupList_DeskReservations);
                    Refresh('Learning Lab Sessions');
                    Clear(col_backupDeskReservations);
                    //Clear(col_EventBuildDetails);
                    Clear(col_EventCombinedDetails);
                    Clear(col_MasterSchedule);
                    Clear(col_nationalEHRMLearningLabSessions);
