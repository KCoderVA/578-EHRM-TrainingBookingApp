                    Clear(colUser_details);
                    Clear(WeekdaysOnly);
                    Clear(wkDays);
                    Clear(wkDaysTemp);
                    ClearCollect(
                        colDeskAccess,
                        DeskAccessControl
                    );
                    ClearCollect(
                        col_MasterSchedule,
                        MasterScheduleList
                    );
                    ClearCollect(
                        colUser_details,
                        Office365Users.UserProfileV2(varTargetEntraID)
                    );
                    ClearCollect(
                        col_SuperUserList,
                        SuperUserList
                    );
                    ClearCollect(
                        col_backupDeskReservations,
                        backupList_DeskReservations
                    );
                    ClearCollect(
                        col_nationalEHRMLearningLabSessions,
                        'Learning Lab Sessions'
                    );
                    // Declare global app rules
                    Set(
                        user_isAdmin,
                        false
                    );
                    // ============================================================
                    // 2. Find the target user's existing record (if any)
                    // ============================================================
                    /*
                    Set(
                        varDeskAccessControl_record,
                        LookUp(
                            DeskAccessControl,
