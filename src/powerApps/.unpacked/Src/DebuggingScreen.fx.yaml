DebuggingScreen As screen:
    Fill: =Color.LightGray
    Height: =App.Height
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: |-
        =Set(var_DebuggingScreen, false);
        Set(var_DebuggingTimerDuration, 12000);
    OnVisible: |-
        =Set(var_DebuggingScreen, true);
        Set(var_DebuggingTimerDuration, 12000);
    Width: =App.Width

    ctnDebugScreen_content As groupContainer.manualLayoutContainer:
        BorderColor: =RGBA(9, 33, 98, 1)
        BorderThickness: =3
        DropShadow: =DropShadow.Light
        Height: =Parent.Height - ctnDebugScreen_header.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =ctnDebugScreen_header.Y + ctnDebugScreen_header.Height
        ZIndex: =5

        Container4 As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(9, 33, 98, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Height: =Gallery1.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Gallery1.Width
            X: =Gallery1.X + Gallery1.Width
            Y: =Gallery1.Y
            ZIndex: =1

            HtmlText5 As htmlViewer:
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                Font: =App.Theme.Font
                Height: =70
                HtmlText: ="variable names - HTML text"
                Size: =21
                Width: =378.6666666666667
                ZIndex: =1

            Timer2 As timer:
