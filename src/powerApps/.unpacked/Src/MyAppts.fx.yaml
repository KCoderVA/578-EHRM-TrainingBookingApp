    lblPrev As label:
        Align: =Align.Center
        BorderColor: |-
            =If(
                prevSelected = true,
                ColorFade(Self.Fill, -50%),
                ColorFade(Self.Fill, -20%)
            )
        BorderThickness: |-
            =If(
                upSelected = true,
                3,
                1
            )
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Fill: |-
            =If(
                prevSelected = true,
                ColorFade(Parent.Fill, -20%),
                Parent.Fill
            )
        FocusedBorderThickness: =.5
        Font: =App.Theme.Font
        FontWeight: |-
            =If(
                prevSelected = true,
                FontWeight.Bold,
                FontWeight.Lighter
            )
        Height: =lblUpcoming.Height
        OnSelect: |-
            =UpdateContext({prevSelected:!prevSelected});UpdateContext({upSelected:!upSelected});
        Size: =18
        TabIndex: =2
        Text: ="PREVIOUS (" & CountRows(gallPast.AllItems) &")"
        Visible: =true // false
        Width: =lblUpcoming.Width
        X: =lblUpcoming.X + lblUpcoming.Width + 25
        Y: =lblUpcoming.Y
        ZIndex: =8

