ManageUsers As screen:
    Fill: =RGBA(236, 236, 236, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =UpdateContext({usersSelected:false});
        UpdateContext({adminSelected:true});
        Set(var_loading, false);
    Width: =Max(App.Width, App.DesignWidth)

    Tabs_9 As Tabs:
        Height: =112
        Visible: =false
        X: =252
        Y: =52
        ZIndex: =1

    lblNoRes_2 As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        FontWeight: =FontWeight.Bold
        Height: =galActive_1.Height
        Size: =40
        Text: |-
            =If(
                adminSelected && !usersSelected,
                "No upcoming reservations",
                !adminSelected && usersSelected,
                "No previous reservations",
                "No reservations"
            )
        Visible: |-
            =If(
                galActive_1.Visible && CountRows(galActive_1.AllItems) >=1,
                false,
                galNonActive_1.Visible && CountRows(galNonActive_1.AllItems) >=1,
                false,
                galActive_1.Visible && CountRows(galActive_1.AllItems) <=1,
                true,
                galNonActive_1.Visible && CountRows(galNonActive_1.AllItems) <=1,
                true,
                !galActive_1.Visible && !galNonActive_1.Visible,
                true,
                false
            )
        Width: =galActive_1.Width
        X: =galActive_1.X
        Y: =galActive_1.Y
        ZIndex: =2

    "galNonActive_1 As gallery.'BrowseLayout_Vertical_OneTextVariant_ver4.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="Active Desks"
        BorderColor: =App.Theme.Colors.Darker40
        Height: =galActive_1.Height
        Items: |-
            =IfError(
                If(
                    Dropdown3_1.Selected.Value = "All",
                    SortByColumns(
                        Filter(
                            DeskAccessControl,
                            (AccessLevel_Choice.Value = "SuperUser" || AccessLevel_Choice.Value = "User" || AccessLevel_Choice.Value = "View-Only" || AccessLevel_Choice.Value = "AccessDenied")
                        //&& AccessStop_dateTime >= Today()
                        ),
                        "Modified",
                        SortOrder.Descending
                    ),
                    Dropdown3_1.Selected.Value <> "All",
                    SortByColumns(
                        Filter(
                            DeskAccessControl,
                            (AccessLevel_Choice.Value = "SuperUser" || AccessLevel_Choice.Value = "User" || AccessLevel_Choice.Value = "View-Only" || AccessLevel_Choice.Value = "AccessDenied") && AccessLevel_Choice.Value = Dropdown3_1.Selected.Value
                        //&& AccessStop_dateTime >= Today()
                        ),
                        "Modified",
                        SortOrder.Descending
                    )
                ),
                //[
                //    "System/connection error...
                //If data does not refresh automatically,
                //please close this browser and relaunch app"
                //]
                If(
                    Dropdown3_1.Selected.Value = "All",
                    SortByColumns(
                        Filter(
                            DeskAccessControl,
                            (AccessLevel_Choice.Value = "SuperUser" || AccessLevel_Choice.Value = "User" || AccessLevel_Choice.Value = "View-Only" || AccessLevel_Choice.Value = "AccessDenied")
                        //&& AccessStop_dateTime >= Today()
                        ),
                        "Modified",
                        SortOrder.Descending
                    ),
                    Dropdown3_1.Selected.Value <> "All",
                    SortByColumns(
                        Filter(
                            DeskAccessControl,
                            (AccessLevel_Choice.Value = "SuperUser" || AccessLevel_Choice.Value = "User" || AccessLevel_Choice.Value = "View-Only" || AccessLevel_Choice.Value = "AccessDenied") && AccessLevel_Choice.Value = Dropdown3_1.Selected.Value
                        //&& AccessStop_dateTime >= Today()
                        ),
                        "Modified",
                        SortOrder.Descending
                    )
                )
            )
