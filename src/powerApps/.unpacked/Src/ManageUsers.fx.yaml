                            Visible: true
                        },
                        {
                            Name: "New",
                            Icon: Icon.Add,
                            Page: POCSUPERVISOR,
                            Visible: true
                        }
                    ),
            
                    // View-only
                    userAccessLevel_text in ["View-Only"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
