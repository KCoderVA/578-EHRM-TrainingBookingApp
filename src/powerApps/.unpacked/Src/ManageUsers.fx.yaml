                            Icon: Icon.Add,
                            Page: POCSUPERVISOR,
                            Visible: true
                        }
                    ),
            
                    // Standard user
                    userAccessLevel_text in ["User", "SuperUser"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
                        {
                            Name: "Help",
                            Icon: Icon.Help,
