            Refresh(Desks);
            Refresh('Desk Reservations');
            Refresh(MasterScheduleList);
            Refresh(DeskAccessControl);
            
            
            // ============================================================
            // 1. Initialization & Setup
            // ============================================================
            // Set initialization loading screen
                Set(varTimer, true);
            // The pseudonym identity of the user the app is currently "acting as" (defaults to the real user until changed).
                Set(varTargetEmail, varRealEmail);
                Set(varTargetEntraID, varRealEntraID);
                Set(varIsImpersonating,
                    If(
                        varTargetEmail = "kyle.coder@va.gov",
                        false,
                        varRealEmail <> varTargetEmail,
                        true,
                        false
                    )
                );
            // Refresh SharePoint list/data sources, then ClearCollect newest info
                Refresh(DeskAccessControl);
                ClearCollect(colDeskAccess, DeskAccessControl);
                ClearCollect(col_MasterSchedule, MasterScheduleList);
                ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));
                Clear(colMenu);
                Clear(CollectionRecurrence);
            // Declare global app rules
                Set(user_isAdmin, false);
            
            // ============================================================
            // 2. Find the target user's existing record (if any)
            // ============================================================
                Set(
                    varDeskAccessControl_record,
                    LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
                );
                Set(varUserExists, !IsBlank(varDeskAccessControl_record));
            
            // ============================================================
            // 3. If missing, add them as default "User", then re-lookup.
            //    Only ever writes for the REAL user (never while impersonating,
            //    which at OnStart is always the case, but guarded for safety).
            // ============================================================
                If(
                    !varUserExists && Lower(varTargetEmail) = Lower(varRealEmail),
                    Patch(
                        DeskAccessControl,
                        Defaults(DeskAccessControl),
                        {
                            Email_Text: varTargetEmail,
                            AccessLevel_Text: "User",
                            AccessLevel_Choice: { Value: "User" },
                            'utcNow()_value': Now(),
                            Id_Text: varTargetEntraID,
                            AccessStart_dateTime: Now(),
                            AccessStop_dateTime: DateAdd(Now(), 6, TimeUnit.Months),
                            Approver_Email_Text: varRealEmail,
                            Manager_Email_Text: Lower(Office365Users.Manager(varTargetEntraID).Mail),
                            Title: varTargetEntraID,
                            'addMinutes(utcNow(),10)': DateAdd(Now(), 10, TimeUnit.Minutes),
                            'Created Via': Text("New User to 578 EHRM Training App"),
                            NetworkAccount_Text: varUser_details.mailNickname
                        }
                    );
                    Refresh(DeskAccessControl);
                    ClearCollect(colDeskAccess, DeskAccessControl);
                    Set(
                        varDeskAccessControl_record,
                        LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
                    )
                );
            
            // ============================================================
            // 4. Resolve access level (fallback to AccessDenied if blank)
            // ============================================================
                Set(
                    userAccessLevel_text,
                    Coalesce(varDeskAccessControl_record.AccessLevel_Text, "AccessDenied")
                );
            
            // ============================================================
            // 5. Elevated / admin flag
            // ============================================================
                Set(
                    user_isAdmin,
                    userAccessLevel_text = "AppAdmin"
                );
            
            // ============================================================
            // 6. Build the navigation menu based on level
            // ============================================================
                Switch(
                    true,
            
                    // Elevated roles: full menu
                    userAccessLevel_text in ["ProjectLeader", "Manager", "ServiceChief", "AppAdmin"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
