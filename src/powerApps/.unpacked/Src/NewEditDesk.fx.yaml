        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Visible: =showLocation
        Width: =Parent.Width
        Y: =ctnHeader.Y + ctnHeader.Height
        ZIndex: =14

        rectBackground_desk As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: =RGBA(116, 116, 116, 0.85)
            Height: =Parent.Height
            Visible: =true //showLocation
            Width: =Parent.Width
            X: =Parent.X
            ZIndex: =1

        imgDesk As image:
            BorderColor: =App.Theme.Colors.Darker40
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Height: =rectBackground_desk.Height
            Image: |+
                =If(
                    IsBlankOrError(varManageSelectedDesk.DeskPhoto_image),
                    Spinner,
                    varManageSelectedDesk.DeskPhoto_image.Full
                )
                
            Visible: =true //showLocation
            Width: =rectBackground_desk.Width
            X: =rectBackground_desk.X
            Y: =rectBackground_desk.Y
            ZIndex: =2

        iconClose_desk As icon.Cancel:
            AccessibleLabel: ="Close Room"
            BorderColor: =Self.Color
            BorderThickness: =5
            Color: =App.Theme.Colors.Lighter70
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(244, 244, 244, 1)
            Fill: =App.Theme.Colors.Darker20
            Height: =75
            HoverBorderColor: =ColorFade(Self.BorderColor, -50%)
            HoverColor: =ColorFade(Self.Color, -50%)
            HoverFill: =ColorFade(Self.Color, 50%)
            Icon: =Icon.CancelBadge
            OnSelect: |-
                =UpdateContext({showLocation:!showLocation})
            PaddingBottom: =10
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =10
            TabIndex: =11
            Visible: =true //showLocation
            Width: |
                =75
            X: =Parent.Width - Self.Width - 10
            Y: =10
            ZIndex: =3

    ctnHeader As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Height: =Parent.Height / 8
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        ZIndex: =15

        rectBackground_header As rectangle:
            BorderColor: =App.Theme.Colors.Darker40
            Fill: =RGBA(135, 78, 181, 0.65)
            Height: =imgBackground_header.Height
            Visible: =!imgBackground_header.Visible
            Width: =imgBackground_header.Width
            X: =imgBackground_header.X
            Y: =imgBackground_header.Y
            ZIndex: =1

        imgBackground_header As image:
            BorderColor: =App.Theme.Colors.Darker40
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            Height: =Parent.Height
            Image: =abstractBackground
            ImagePosition: =ImagePosition.Fill
            Visible: |-
                =If(
                    IsBlankOrError(imgBackground_header.Image),
                    false,
                    true
                )
            Width: =Parent.Width
            ZIndex: =4

        lblTitle_header As label:
            Align: =Align.Center
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =Parent.Height / 2
            Size: =28
            Text: ="Editing '" & varManageSelectedDesk.Description_multilinePlainText & "'"
            Width: =rectBackground_header.Width
            X: |
                =0
            ZIndex: =5

        ctnHeaderButtons As groupContainer.manualLayoutContainer:
            Height: =btnUpdate_editDesk.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =btnBack_editDesk.Width + btnUpdate_editDesk.Width + 50
            X: =(Parent.Width / 2) - (Self.Width / 2)
            Y: =lblTitle_header.Y + lblTitle_header.Height
            ZIndex: =6

            btnBack_editDesk As button:
                BorderColor: =App.Theme.Colors.Primary
                Color: =App.Theme.Colors.PrimaryForeground
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =RGBA(128, 128, 128, 1)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Semibold
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =ColorFade(Self.Fill, -20%)
                OnSelect: |-
                    =Reset(input_ItemTitle);
                    Reset(input_Number_desk);
                    Reset(input_Number_room);
                    Reset(input_Number_floor);
                    Reset(input_Number_building);
                    Reset(input_Name_division);
                    Reset(input_Description);
                    Reset(dd_ItemType);
                    Reset(toggle_ActiveBoolean);
                    Reset(chkbox_Projector);
                    Reset(chkbox_VTel);
                    Reset(chkbox_SmartBoard);
                    
                    
                    
                    Navigate(ManageDesks);
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =24
                Text: ="Back"
                Width: =btnUpdate_editDesk.Width
                X: =Parent.Width - Self.Width
                ZIndex: =1

            btnUpdate_editDesk As button:
                BorderColor: =App.Theme.Colors.Primary
                Color: =App.Theme.Colors.PrimaryForeground
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =RGBA(135, 78, 181, 1)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Semibold
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =ColorFade(Self.Fill, -20%)
                OnSelect: |
                    =Set(
                        submitItem,
                        Patch(
                            Desks,
                            Coalesce(
                                varManageSelectedDesk,
                                Defaults(Desks)
                            ),
                            {
                                ItemID_title: input_ItemTitle.Text,
                                ItemType_choice: dd_ItemType.Selected,
                                Active_boolean: toggle_ActiveBoolean.Value,
                                Active_text: Text(toggle_ActiveBoolean.Value),
                                DeskName_text: "Desk " & input_Number_desk.Text,
                                DeskNumber_number: Value(input_Number_desk.Text),
                                RoomNumber_number: Value(input_Number_desk.Text),
                                FloorNumber_number: Value(input_Number_floor.Text),
                                //BuildingNumber_number: Value(input_Number_building.Text),
                                DivisionName_text: input_Name_division.Text,
                                CombinedLocationDetails_multilinePlainText:
                                    (
                                        "Desk " & Value(input_Number_desk.Text) & ","
                                        & "Room " & Value(input_Number_desk.Text) & ","
                                        & "Floor " & Value(input_Number_floor.Text) & ","
                                        //& "Building " & Value(input_Number_building.Text) & ","
                                        & "Division " & input_Name_division.Text & ","
                                    ),
                                Description_multilinePlainText: input_Description.Text,
                                
                                ProjectorEquipped_boolean: chkbox_Projector.Value,
                                ProjectorEquipped_text: chkbox_Projector.Value,
                                VtelEquipped_boolean: chkbox_VTel.Value,
                                VtelEquipped_text: chkbox_VTel.Value,
                                SmartboardEquipped_boolean: chkbox_SmartBoard.Value,
                                SmartboardEquipped_text: chkbox_SmartBoard.Value
                    
                    
                                //'Projector/TV':If(chkbox_Projector.Value = true,"https://dvagov.sharepoint.com/sites/vhaaugroom/Assets/images/vtel.png",Blank()),
                                //VTel: If(chkbox_VTel.Value = true, "https://dvagov.sharepoint.com/sites/vhaaugroom/SiteAssets/images/projector.png",Blank()),
                                //'Smart Board': If(chkbox_SmartBoard.Value = true,"https://dvagov.sharepoint.com/sites/vhaaugroom/Assets/images/smartboard.png",Blank())
                            }
                        )
                    );
                    If(
                        IsBlankOrError(submitItem),
                        Notify(
                            "Something went wrong. Your item has not been submitted." & Last(Errors(Desks)).Message,
                            NotificationType.Error,
                            10000
                        ),
                        Notify(
                            "Your item has been submitted. (ID: " & submitItem.ID & ")",
                            NotificationType.Success,
                            5000
                        );
                        Set(
                            currentItem,
                            submitItem
                        )
                    );
                    Reset(input_Number_desk);
                    Reset(input_ItemTitle);
                    Reset(toggle_ActiveBoolean);
                    Reset(input_Description);
                    Navigate(ManageDesks)
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =24
                Text: ="Update"
                Width: =225
                ZIndex: =2

