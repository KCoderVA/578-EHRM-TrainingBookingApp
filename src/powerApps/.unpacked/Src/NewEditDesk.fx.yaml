                =Distinct(
                    Desks,
                    ItemType_choice.Value)
            PressedColor: =App.Theme.Colors.PrimaryForeground
            PressedFill: =App.Theme.Colors.Darker30
            SelectionColor: =App.Theme.Colors.PrimaryForeground
            SelectionFill: =App.Theme.Colors.Primary
            Size: =21
            Width: |
                =Parent.Width - Self.X - 10
            X: =lbl_ItemType.X + lbl_ItemType.Width
            Y: =lbl_ItemType.Y
            ZIndex: =5

        lbl_ItemType As label:
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =App.Theme.Font
            Height: =lbl_ItemTitle.Height
            Italic: =true
            Size: =18
            Text: |-
                ="Item Type:"
            Width: =lbl_ItemTitle.Width
            X: =input_ItemTitle.X + input_ItemTitle.Width
            Y: =input_ItemTitle.Y
            ZIndex: =6

        input_Description As text:
            AccessibleLabel: ="Desk Description Input"
            BorderColor: =RGBA(179, 179, 179, 1)
            Color: =RGBA(0, 0, 0, 1)
            Default: =If(varDeskMode = "Edit",varManageSelectedDesk.CombinedLocationDetails_multilinePlainText,Blank())
