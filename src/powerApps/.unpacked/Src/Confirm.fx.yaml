Confirm As screen:
    Fill: =RGBA(236, 236, 236, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =// ———————————————————————————————————————————————————————————————
        // 0) Pre-compute fragile lookups ONCE, safely.
        Set(varMyProfile, IfError(Office365Users.MyProfileV2(), Blank()));
        Set(varStudentProfile, IfError(Office365Users.UserProfileV2(var_Attendees), Blank()));
        Set(varStudentMgrMail, IfError(Lower(Office365Users.ManagerV2(var_Attendees).mail), Blank()));
        Set(varStudentMgrProfile, IfError(Office365Users.ManagerV2(varTargetEntraID), Blank()));
        
        ClearCollect(
            colCombinedRecurrence,
            AddColumns(
                CollectionRecurrence,
                Floor,
                If(
                    !IsBlankOrError(First(colSelectedDesks).FloorNumber_number),
                        First(colSelectedDesks).FloorNumber_number,
                        //Value(var_reservationFloorNumber),
                    IsBlankOrError(var_reservationFloorNumber),
                        Value("2"),
                    First(colSelectedDesks).FloorNumber_number
                    )
            )
        );
        ClearCollect(
            col_EventCombinedDetails,
            Patch(
                First(colSelectedDesks),
                First(colCombinedRecurrence)
            )
        );
        ClearCollect(
            col_EventBuildDetails,
            Filter('Desk Reservations', false)
        );
        
        // Get the highest RecurrenceID in the list (returns blank if none exist)
        Set(
            varRecurrenceID,
            Coalesce(
                Max(
                    'Desk Reservations',
                    Value(RecurrenceID)
                ) + 1,
                1
            )
        );
        Set(varSelectedDesk, First(col_EventCombinedDetails));
    Width: =Max(App.Width, App.DesignWidth)

