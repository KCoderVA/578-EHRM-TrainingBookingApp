    btnSubmit As button:
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Fill: =RGBA(15, 108, 189, 1)
        Font: =App.Theme.Font
        FontWeight: =FontWeight.Semibold
        Height: =45
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =ColorFade(Self.Fill, -20%)
        OnSelect: |-
            =// ╔═══════════════════════════════════════════════════════════════════════╗
            // ║  BLOCK 1 of 2                                                          ║
            // ║  PASTE INTO:  "Submit" screen  ->  btnSubmit (your Submit button)      ║
            // ║  PROPERTY:    OnSelect                                                 ║
            // ║                                                                        ║
            // ║  Corrected build. Key fixes vs. your last version:                     ║
            // ║   • reservationComments_multilinetext: was a 4-arg If (type error      ║
            // ║     that failed the WHOLE record). Now a clean 3-arg If.               ║
            // ║   • Stage 7 Cc: varAttendees -> var_Attendees (verify!).              ║
            // ║   • backup reservationStart_datetime re-enabled.                      ║
            // ║   • choice columns left commented (//investigate) so this runs clean. ║
            // ╚═══════════════════════════════════════════════════════════════════════╝
            
            // ── STAGE 0) Reset flags + generate a unique submission ID ──────────────
                Set(varCalendarOK, false);
                Set(varDetailedOK, false);
                Set(varFallbackOK, true);
                Set(varEmailOK, false);
                Set(varPatchSuperUsersOK, true);
                Set(varAllOK, false);
                // ????? Maybe causing problem:  Clear(colDetailedResults)
                    Clear(colDetailedResults);
            
                Set(varSubmissionID, Text(GUID()));
            
                Set(
                    varStartNum,
                    If(
                        IsBlankOrError(Value(Substitute(Substitute(Substitute(Substitute(var_StartTime_central,"PM",""),"AM",""),":","")," ",""))),
                        Blank(),
                        Value(Substitute(Substitute(Substitute(Substitute(var_StartTime_central,"PM",""),"AM",""),":","")," ",""))
                    )
                );
                Set(
                    varEndNum,
                    If(
                        IsBlankOrError(Value(Substitute(Substitute(Substitute(Substitute(var_EndTime_central,"PM",""),"AM",""),":","")," ",""))),
                        Blank(),
                        Value(Substitute(Substitute(Substitute(Substitute(var_EndTime_central,"PM",""),"AM",""),":","")," ",""))
                    )
                );
            
            // ── STAGE 1) Outlook calendar item ──────────────────────────────────────
                IfError(
                    Office365Outlook.V4CalendarPostItem(
                        LookUp(Office365Outlook.CalendarGetTables().value, DisplayName = "Calendar").Name,
                        Concatenate("578 EHRM Learning Lab - ", var_reservationScenario, If(IsBlank(varRecurrenceID),"", " (#" & varRecurrenceID & ")") ),
                        var_StartDateTime_central,
                        var_EndDateTime_central,
                        "Central Standard Time",
                        {
                            requiredAttendees: var_Attendees,
                            optionalAttendees: Concatenate(var_Attendees, "; ", varOptionalAttendees, ";"),
                            body: var_EmailBody,
                            categories: varMeetCat,
                            location: text_Value3.Text,
                            importance: "high",
                            isAllDay: false,
                            recurrence: varRecurrence,
                            reminderMinutesBeforeStart: varReminder,
                            isReminderOn: If(varReminder > 0, true, false),
                            showAs: "busy",
                            responseRequested: true,
                            sensitivity: "normal"
                        }
                    ),
                    Set(varCalendarOK, false),
                    Set(varCalendarOK, true)
                );
            
            // ── STAGE 2+4) PAIRED detailed Patch: main list AND backup list ─────────
                ForAll(
                    CollectionRecurrence As rec,
                    ForAll(
                        colSelectedDesks As desk,
            
                        // -- 2a) MAIN list --
                        Collect(
                            colDetailedResults,
                            {
                                list: "main",
                                ok: !IsError(
                                    Patch(
                                        'Desk Reservations',
                                        Defaults('Desk Reservations'),
                                        {
                                            // --- NEW columns (text -> placeholder, dates -> Blank) ---
                                            Title: If(IsBlankOrError(var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")"), "(not provided)", var_Attendees & " – " & var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")"),
                                            submitterName_text:  If(IsBlankOrError(varMyProfile.displayName), "(not provided)", varMyProfile.displayName),
                                            submitterEmail_text: If(IsBlankOrError(Lower(varMyProfile.mail)), "(not provided)", Lower(varMyProfile.mail)),
                                            submitterService_text: If(IsBlankOrError(If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).department),"",Office365Users.UserProfileV2(varRealEntraID).department) & If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).officeLocation),"",Office365Users.UserProfileV2(varRealEntraID).officeLocation) & If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).companyName),"",Office365Users.UserProfileV2(varRealEntraID).companyName)), "(not provided)", If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).department),"",Office365Users.UserProfileV2(varRealEntraID).department) & If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).officeLocation),"",Office365Users.UserProfileV2(varRealEntraID).officeLocation) & If(IsBlankOrError(Office365Users.UserProfileV2(varRealEntraID).companyName),"",Office365Users.UserProfileV2(varRealEntraID).companyName)),
                                            studentName_text:  If(IsBlankOrError(varStudentProfile.displayName), "(not provided)", varStudentProfile.displayName),
                                            studentEmail_text: If(IsBlankOrError(Lower(varStudentProfile.mail)), "(not provided)", Lower(varStudentProfile.mail)),
                                            studentService_text: If(IsBlankOrError(If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).department),"",Office365Users.UserProfileV2(varTargetEntraID).department) & If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).officeLocation),"",Office365Users.UserProfileV2(varTargetEntraID).officeLocation) & If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).companyName),"",Office365Users.UserProfileV2(varTargetEntraID).companyName)), "(not provided)", If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).department),"",Office365Users.UserProfileV2(varTargetEntraID).department) & If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).officeLocation),"",Office365Users.UserProfileV2(varTargetEntraID).officeLocation) & If(IsBlankOrError(Office365Users.UserProfileV2(varTargetEntraID).companyName),"",Office365Users.UserProfileV2(varTargetEntraID).companyName)),
                                            studentTitle_text:  If(IsBlankOrError(varStudentProfile.jobTitle), "(not provided)", varStudentProfile.jobTitle),
                                            studentManagerEmail_text: If(IsBlankOrError(varStudentMgrMail), "(not provided)", varStudentMgrMail),
