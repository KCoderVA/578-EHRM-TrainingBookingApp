Confirm As screen:
    Fill: =RGBA(236, 236, 236, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =// ———————————————————————————————————————————————————————————————
        // 0) Pre-compute fragile lookups ONCE, safely.
        Set(varPopUp_ClassPicker_scenarioLocation, dropdown_LocationPicker.Selected.Value);
        Set(var_reservationFullLocation, dropdown_LocationPicker.Selected.Value);
        If(
            (Len(dropdown_LocationPicker.Selected.Value) >= 14),
                Set(
                    var_reservationRoomNumber,
                    Text(
                        Last(
                            Filter(
                                Split(
                                    dropdown_LocationPicker.Selected.Value,
                                    " "
                                    ),
                                    IsNumeric(Value)
                            )
                        ).Value
                    )
                );
                Set(var_reservationFloorNumber, "2");
                Set(
                    var_reservationBuildingNumber,
                    Text(
                        First(
                            Filter(
                                Split(
                                    dropdown_LocationPicker.Selected.Value,
                                    " "
                                ),
                                IsNumeric(Value)
                            )
                        ).Value
                    )
                    
                );
                Set(var_reservationDivision, "Edward Hines Jr. VA Hospital"),
            (Len(dropdown_LocationPicker.Selected.Value) <= 13),
                Set(var_reservationRoomNumber, "Virtual CBOC");
                Set(var_reservationFloorNumber, "Virtual CBOC");
                Set(var_reservationBuildingNumber, "Virtual CBOC");
                Set(var_reservationDivision, "Edward Hines Jr. VA Hospital"),
            (Len(dropdown_LocationPicker.Selected.Value) <= 8),
                Set(var_reservationRoomNumber, "Virtual");
                Set(var_reservationFloorNumber, "Virtual");
                Set(var_reservationBuildingNumber, "Virtual");
                Set(var_reservationDivision, "Edward Hines Jr. VA Hospital")
        );
        
        ClearCollect(
            colSelectedDesks,
            Filter(
                Desks,
                DeskNumber_number = 1
                && RoomNumber_number = Value(var_reservationRoomNumber)
            )
        );
        
        
        Set(varMyProfile, IfError(Office365Users.MyProfileV2(), Blank()));
        Set(varStudentProfile, IfError(Office365Users.UserProfileV2(varTargetEntraID), Blank()));
        Set(varStudentMgrMail, IfError(Lower(Office365Users.ManagerV2(var_Attendees).mail), Blank()));
        Set(varStudentMgrProfile, IfError(Office365Users.ManagerV2(varTargetEntraID), Blank()));
        
        
        ClearCollect(
            colCombinedRecurrence,
            AddColumns(
                CollectionRecurrence,
                Floor,
                If(
                    !IsBlankOrError(First(colSelectedDesks).FloorNumber_number),
                        First(colSelectedDesks).FloorNumber_number,
                        //Value(var_reservationFloorNumber),
                    IsBlankOrError(var_reservationFloorNumber),
                        Value("2"),
                    First(colSelectedDesks).FloorNumber_number
                    )
            )
        );
        ClearCollect(
            col_EventCombinedDetails,
            Patch(
                First(colSelectedDesks),
                First(colCombinedRecurrence)
            )
        );
        //ClearCollect(
        //    col_EventBuildDetails,
        //    Filter('Desk Reservations', false)
        //);
        
        // Get the highest RecurrenceID in the list (returns blank if none exist)
        Set(
            varRecurrenceID,
            Coalesce(
                Max(
                    'Desk Reservations',
                    ID //Value(RecurrenceID)
                ) + 1,
                1
            )
        );
        Set(
            varSelectedDesk,
            First(col_EventCombinedDetails)
        );
    Width: =Max(App.Width, App.DesignWidth)

