    btnConfirm_2 As button:
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Fill: =RGBA(15, 108, 189, 1)
        Font: =App.Theme.Font
        FontWeight: =FontWeight.Semibold
        Height: =45
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =ColorFade(Self.Fill, -20%)
        OnSelect: |-
            =// ———————————————————————————————————————————————————————————————————————————————————————————————————————
            // 1) Save item(s) to Outlook
            Office365Outlook.V4CalendarPostItem(
                LookUp(Office365Outlook.CalendarGetTables().value, DisplayName = "Calendar").Name, // current user's Outlook Calendar
                //Subject
                    Concatenate(
                        "EHRM Learning Lab Scenario - ",
                        var_reservationScenario //varTitle
                    ),
                //Start Date/Time
                    varEventStartTime,
                //End Date/Time
                    varEventEndTime,
                //Event Timezone
                "(UTC-06:00) Central Time",
                //Main properties
                    {
                            requiredAttendees: var_Attendees, //varAttendees,
                            //optionalAttendees: varOptionalAttendees,
                            body: varEmailBody,
                            categories: varMeetCat,      
                            location: varSelectedDesk.CombinedLocationDetails_multilinePlainText, // Need proper value
                            importance: varImportance, // low, normal, high
                            isAllDay: false, // true if all day
                            recurrence: varRecurrence, // "weekly", "daily", etc.
                            selectedDaysOfWeek: varWeekday,
                            recurrenceEnd: Text(DateValue(varEndDate), "yyyy-mm-dd"), // "2025-06-08"
                            numberOfOccurences: Value(recurPeriodTxt.Text), // integer
                            reminderMinutesBeforeStart: varReminder, // integer
                            isReminderOn: If(varReminder > 0, true, false), // or false
                            showAs: "busy", // free, tentative, busy, oof, workingElsewhere, unknown
                            responseRequested: true, // or true for RSVP
                            sensitivity: "normal" // normal, personal, private, confidential
                    }
            );
            //////////////////////////////////////////////////////////////////////////////////////////////
            // ——————————————————————————————————————————————
            // 2) Patch to SharePoint list, For each recurrence date…
            ForAll(
                CollectionRecurrence As rec,
                // …and each selected desk…
                ForAll(
                    colSelectedDesks As desk,
                // ——— (Optional) send the invite ———
                    
                    // ——— Patch the SharePoint list ———
                    Patch(
                        'Desk Reservations',
                        Defaults('Desk Reservations'),
                        {
                            // New Columns:
                            Title: var_Attendees & " – " &  var_MeetingCategory & " - " & var_reservationScenario & " (" & var_reservationRole & ")",
                            submitterName_text: Office365Users.MyProfileV2().displayName,
                            submitterEmail_text: Lower(Office365Users.MyProfileV2().mail),
                            submitterService_text: Office365Users.MyProfileV2().department & " - " &Office365Users.MyProfileV2().companyName,
                            studentName_text: Office365Users.UserProfileV2(var_Attendees).displayName,
                            studentEmail_text: Lower(Office365Users.UserProfileV2(var_Attendees).mail),
                            studentService_text: var_Service,
                            studentTitle_text: Office365Users.UserProfileV2(var_Attendees).jobTitle,
                            studentManagerEmail_text: Lower(Office365Users.ManagerV2(var_Attendees).mail),
                            reservationRole_text: var_reservationRole,
                            reservationScenario_text: var_reservationScenario,
                            reservationStart_datetime: varEventStartTime,
                            reservationEnd_datetime: varEventEndTime,
                            reservationDesk_text: Blank(),
                            reservationRoom_text: "Room #" & var_reservationRoomNumber,
                            reservationFloor_text: "Floor #" & var_reservationFloorNumber,
                            reservationBuilding_text: "Building #" & var_reservationBuildingNumber,
                            reservationDivision_text: var_reservationDivision,
                            reservationAgreementBody_multilinetext: var_reservationAgreementBody,
                            reservationDescription_multilinetext: var_reservationScenario & " (" & var_reservationRole & ")",
                            reservationComments_multilinetext: Blank(),
                            reservationInviteBody_multilinetext: varEmailBody,
                            reservationInviteOptionalAttendees_multilinetext: var_OptionalAttendees,
            
                            // OLD Columns:
                            //'Reserved By': Office365Users.MyProfileV2().displayName,
                            MeetingCategory: var_MeetingCategory,
                            DeskText: var_reservationScenario & " (" & var_reservationRole & ")",
                            Description: var_reservationScenario & " (" & var_reservationRole & ")",
                            //OptionalAttendees: var_OptionalAttendees,
                            //Active_choice: true,
                            'Check Out To': varEventEndTime,
                            'Check Out From': varEventStartTime,
                            'Check Out To Text': Text(var_EndTime),
                            'Check Out From Text': Text(var_StartTime),
                            //'Check Out To Number': Value(var_EndTime)
                            //'Check Out From Number': Value(var_StartTime),
                            Service: var_Service,
                            RoomReservation: true,
                            //Manager: Lower(Office365Users.UserProfileV2(var_ManagerEmail).mail),
                            //Asset: "Desk",
                            //RecurrenceFrequency: varRecurrence,
                            RecurrenceEndDate: Blank(),
                            RecurrenceID: varRecurrenceID,
                            RecurrenceDayName: Blank(),
                            RecurrenceTimes: Blank(),
                            RecurrencePattern: Blank(),
                            IsRecurring: true,
                            OutlookEventID: Blank(),
                            OutlookSeriesID: Blank(),
                            ParentReservationID: Blank()
                        }
                    )   
                )
            );
            
            
            // ——————————————————————————————————————————————
            // 3) Clean up & navigate
            Set(varScreenReset, true);
            Set(varScreenReset, false);
            
            Concurrent(
                ResetForm(Form1),
                Reset(ddImportance),
                Reset(ddRecurrenceFrequency),
                Reset(Calendar_1),
                Reset(Gallery6),
                Reset(DatePickerCanvas2),
                Reset(Gallery3_1);
                Clear(colSelectedDesks),
                Clear(CollectionRecurrence),
                Clear(colDeskChckRecur),
                Clear(colCombinedRecurrence),
                Clear(wkDays),
                Clear(wkDaysTemp)
            );
            
            Navigate(Success)
