        OnTimerStart: |-
            =// ============================================================
            // 2. Find the target user's existing record (if any)
            // ============================================================
                Set(
                    varDeskAccessControl_record,
                    LookUp(
                        DeskAccessControl,
                        (Email_Text = Lower(varTargetEmail))
                    )
                );
            
            // ============================================================
            // 4. Resolve access level (fallback to AccessDenied if blank)
            // ============================================================
                Set(
                    userAccessLevel_text,
                    If(
                        IsBlankOrError(varDeskAccessControl_record),
                            LookUp(
                                DeskAccessControl,
                                (Email_Text = Lower(varTargetEmail)),
                                AccessLevel_Choice.Value
                            ),
                        !IsBlankOrError(varDeskAccessControl_record),
                            Coalesce(varDeskAccessControl_record.AccessLevel_Text, "User")
                    )
                );
            
            // ============================================================
            // 5. Elevated / admin flag
            // ============================================================
                Set(
                    user_isAdmin,
                    userAccessLevel_text = "AppAdmin"
                );
            
            // ============================================================
            // 6. Build the navigation menu based on level
            // ============================================================
                Switch(
                    true,
            
                    // Top Elevated Roles: full menu
                    userAccessLevel_text in ["Manager", "ServiceChief", "AppAdmin"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
                        {
                            Name: "Desks",
                            Icon: Icon.ComputerDesktop,
                            Page: ManageDesks,
                            Visible: true
                        },
                        {
                            Name: "Users",
                            Icon: Icon.People,
                            Page: ManageUsers,
                            Visible: true
                        },
                        {
                            Name:"Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        },
                        {
                            Name: "New",
                            Icon: Icon.Add,
                            Page: POCSUPERVISOR,
                            Visible: true
                        }
                    ),
            
                    // Advanced 'Project Leader' Role: full menu without UserManagement
                    userAccessLevel_text in ["ProjectLeader"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
                        {
                            Name: "Desks",
                            Icon: Icon.ComputerDesktop,
                            Page: ManageDesks,
                            Visible: true
                        },
                        {
                            Name:"Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        },
                        {
                            Name: "New",
                            Icon: Icon.Add,
                            Page: POCSUPERVISOR,
                            Visible: true
                        }
                    ),
            
                    // Standard user
                    userAccessLevel_text in ["User", "SuperUser"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
                        {
                            Name: "Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        },
                        {
                            Name: "New",
                            Icon: Icon.Add,
                            Page: POCSUPERVISOR,
                            Visible: true
                        }
                    ),
            
                    // View-only
                    userAccessLevel_text in ["View-Only"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name: "Items",
                            Icon: Icon.Bookmark,
                            Page: MyAppts,
                            Visible: true
                        },
                        {
                            Name:"Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        }
                    ),
            
                    // View-only
                    userAccessLevel_text in ["AccessDenied"],
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name:"Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        }
                    ),
            
                    // AccessDenied or anything else: empty menu
                    IsBlankOrError(userAccessLevel_text),
                    ClearCollect(
                        colMenu,
                        {
                            Name: "Home",
                            Icon: Icon.Home,
                            Page: Dashboard,
                            Visible: true
                        },
                        {
                            Name:"Help",
                            Icon: Icon.Help,
                            Page: ReleaseNotes,
                            Visible: true
                        }
                    )
                );
            
