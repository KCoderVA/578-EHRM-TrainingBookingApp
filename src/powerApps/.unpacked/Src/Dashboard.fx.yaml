                        <br><div style='font-size:20px; text-align:center; font-weight:bold;'>EHRM Learning Lab Portal!</div>
                        <br>
                        <div style='font-size:15px;'>Within this app, individual desks & classrooms may be reserved to participate in upcoming '<i>Learning Lab</i>' & '<i>Virtual Instructor Led Training (VILT)</i>' training events provided by the Hines EHRM Training Coordinators. EHRM training resources & additional information can be found online at:
                        <br>
