Dashboard As screen:
    Fill: =RGBA(236, 236, 236, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =ClearCollect(colMenu, Blank());
        Set(
            _CurrentUser,
            User()
        );
        Set(
            _CurrentDate2,
            Today()
        );
        Set(
            _CurrentUser,
            User()
        );
        Set(
            _CurrentDate2,
            Today()
        );
        Set(
            varTimer,
            true
        );
        Set(
            currentUser,
            User()
        );
        Set(
            varTimer,
            false
        );
        Set(
            varUser,
            User()
        );
        ClearCollect(CollectionRecurrence, Blank());
        Refresh(DeskAccessControl);
        ClearCollect(userAccessDemographics, Blank());
        Set(isUserAdminSPList, false);
        
        Set(
            isUserAdminSPList,
            !IsBlank(
                LookUp(
                    DeskAccessControl,
                    Lower(Email_Text) = Lower(User().Email)
                )
            )
        );
        If(
            isUserAdminSPList = true, 
            ClearCollect(
                userAccessDemographics,
                Filter(
                    DeskAccessControl,
                    Lower(Email_Text) = Lower(User().Email)
                )
            ); Set(
                userAccessLevel_text,
                    LookUp(
                        DeskAccessControl,
                        (!IsBlank(AccessLevel_Text) && Lower(Email_Text) = Lower(User().Email)),
                        AccessLevel_Text
                    )
                ),
            isUserAdminSPList = false,
            Patch(
                DeskAccessControl,
                {
                    Email_Text: Lower(User().Email),
                    AccessLevel_Choice:
                        {
                            Value: "User"
                            //Value: "AccessDenied"
                            //Value: "View-only"
                            //Value: "User"
                            //Value: "SuperUser"
                            //Value: "Manager"
                            //Value: "ServiceChief"
                            //Value: "ProjectLeader"
                            //Value: "AppAdmin"
                        }
                }
            ); Set(isUserAdminSPList, true); Set(userAccessLevel_text, "User")
        );
        If(
            (userAccessLevel_text = "SuperUser"
                || userAccessLevel_text = "Manager"
                || userAccessLevel_text = "ServiceChief"
                || userAccessLevel_text = "ProjectLeader"
                || userAccessLevel_text = "AppAdmin"
                ), 
            Collect(
                colMenu, 
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    },
                   {
                        Name: "Book",
                        Icon: Icon.Add,
                        Page: POCSUPERVISOR,
                        Visible: true
                    },
                    {
                        Name: "Manage Rooms",
                        Icon: Icon.ComputerDesktop,
                        Page: ManageDesks,
                        Visible: true
                    }
            ),
                (userAccessLevel_text = "User"),
                ClearCollect(
                    colMenu,
                    Table(
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    },
                   {
                        Name: "Book",
                        Icon: Icon.Add,
                        Page: POCSUPERVISOR,
                        Visible: true
                    }         
                )
            ),
            (userAccessLevel_text = "View-only"),
                ClearCollect(
                colMenu,
                Table(
                    {
                        Name: "Dashboard",
                        Icon: Icon.DetailList,
                        Page: Dashboard,
                        Visible: true
                    },
                    {
                        Name: "My Bookings",
                        Icon: Icon.Person,
                        Page: MyAppts,
                        Visible: true
                    }        
                )
            ),
        (userAccessLevel_text = "AccessDenied"),
            ClearCollect(
                colMenu,
                Blank()
            )
        );
    Width: =Max(App.Width, App.DesignWidth)

