Dashboard As screen:
    Fill: =RGBA(0, 63, 114, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: =Set(varTimer, true);
    OnVisible: =Set(varTimer, true);
    Width: =Max(App.Width, App.DesignWidth)

    bgRounded_3 As htmlViewer:
        BorderColor: =RGBA(9, 33, 98, 1)
        BorderThickness: =5
        Height: |-
            =//623
            Parent.Height - Self.Y
        HtmlText: |-
            =//"<div style='border:1px gray;border-radius:10%;height:600px;width:100%;background-color:#FCFCFC'></div>"
            "<div style='border:5px solid #b4d6fa;border-radius:8px;height:" & (Parent.Height - Self.Y - 20) & "px;width:100%;background-color:#fcfcfc;'></div>"
        Visible: =false //gallMyReservationsPreview.Visible
        Width: =528
        X: =608
        Y: =17
        ZIndex: =1

    bgRounded_4 As htmlViewer:
        BorderColor: =RGBA(9, 33, 98, 1)
        BorderThickness: =5
        Height: =bgRounded_3.Height
        HtmlText: |-
            =If(
                (ctnDashboard_Denied_3.Visible = true || gallMyReservationsPreview.Visible = false),
                "<div style='border:5px solid #b4d6fa;border-radius:8px;height:" & (Parent.Height - Self.Y - 20) & "px;width:100%;background-color:#fcfcfc;'>
                    <span>
                    <br>
                    <br>
                    <br>
                    <br>
                    <br>
                    <br>
                    <center>
                    Data Access Denied. . . .
                    </center>
                    </span>
                    </div>",
                (ctnDashboard_Denied_3.Visible = false || gallMyReservationsPreview.Visible = true),
                "<div style='border:5px solid #b4d6fa;border-radius:8px;height:" & (Parent.Height - Self.Y - 20) & "px;width:100%;background-color:#fcfcfc;'>
                    <span>
                    <br>
                    <br>
                    <br>
                    <br>
                    <br>
                    <br>
                    <center>
                    Loading Data. . . .
                    </center>
                    </span>
                    </div>"
            )
        Size: =24
        Visible: |-
            =false
            /*If(
                (varTimer = true),
                true,
                (gallMyReservationsPreview.Visible = false && IsBlankOrError(varTimer)),
                true,
                (ctnDashboard_Denied_3.Visible = true || gallMyReservationsPreview.Visible = false),
                true,
                false
            )
            */
        Width: =bgRounded_3.Width
        X: =bgRounded_3.X
        Y: =bgRounded_3.Y
        ZIndex: =2

    lblNoResDashboard As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =RGBA(0, 0, 0, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        Font: =App.Theme.Font
        FontWeight: |-
            =If(
                userAccessLevel_text = "AccessDenied",
                FontWeight.Bold,
                FontWeight.Lighter
            )
        Height: =88
        Size: |-
            =If(
                userAccessLevel_text = "AccessDenied",
                40,
                25
            )
        Text: |-
            =If(
                userAccessLevel_text = "AccessDenied" || IsBlankOrError(userAccessLevel_text),
                "ACCESS DENIED!",
                "No upcoming reservations!"
            )
        Visible: |-
            =false
            /*
            If(
                ((CountRows(gallMyReservationsPreview.AllItems) >= 1) && (gallMyReservationsPreview.Visible = true)),
                    false,
                ((CountRows(gallMyReservationsPreview.AllItems) < 1) && (gallMyReservationsPreview.Visible = true)),
                    true,
                (gallMyReservationsPreview.Visible = false),
                    false,
                true
            )
            */
        Width: =bgRounded_3.Width
        X: =bgRounded_3.X
        Y: |-
            =//353
            ((bgRounded_3.Y / 2) + (bgRounded_3.Height / 2)) - (Self.Height / 2)
        ZIndex: =3

