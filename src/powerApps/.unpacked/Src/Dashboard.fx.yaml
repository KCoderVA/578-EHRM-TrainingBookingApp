Dashboard As screen:
    Fill: =RGBA(0, 63, 114, 1)
    Height: =Max(App.Height, App.DesignHeight)
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: =Set(varTimer, true);
    Width: =Max(App.Width, App.DesignWidth)

    Button6 As modernButton:
        Align: =Align.Left
        Height: =Combobox1.Height
        OnSelect: =Navigate(DebuggingScreen)
        Size: =12
        Text: =varTargetEmail & " (" & userAccessLevel_text & ")"
        Visible: =User().Email = "Kyle.Coder@va.gov"
        Width: =223
        X: =Combobox1.X + Combobox1.Width
        Y: =Combobox1.Y
        ZIndex: =1

    Combobox1 As modernCombobox:
        Appearance: =Appearance.FilledDarker
        DefaultSelectedItems: |-
            =Filter(
                Distinct(colDeskAccess, Lower(Email_Text)),
                Value = varRealEmail
            )
        Height: =Label8.Height / 1.5
        ItemDisplayText: =ThisItem.Value
        Items: |-
            =Distinct(DeskAccessControl, Email_Person.Email)
            //Distinct(colDeskAccess, Email_Person.Email)
            /*Distinct(
                AddColumns(
                    Filter(
                        DeskAccessControl,
                        !IsBlankOrError(Email_Text) && !IsBlankOrError(AccessLevel_Text)
                    ),
                    Display,
                    Email_Text & " (" & AccessLevel_Text & ")"
                ),
                Display
            )*/
        OnChange: |-
            =// Resolve the impersonated user's record
            Set(varTargetEmail, Self.Selected.Value);
            Set(varTargetEntraID, 
                LookUp(
                    DeskAccessControl, 
                    Lower(Self.Selected.Value) = Lower(Email_Text),
                    Id_Text
                )        
            );
            Set(varIsImpersonating, varTargetEmail <> varRealEmail);
            
            Set(
                varDeskAccessControl_record,
                LookUp(colDeskAccess, Lower(Email_Text) = varTargetEmail)
            );
            
            // Access level (same fallback as OnStart)
            Set(
                userAccessLevel_text,
                Coalesce(varDeskAccessControl_record.AccessLevel_Text, "AccessDenied")
            );
            
            // Admin flag — mirror OnStart exactly
            Set(user_isAdmin, userAccessLevel_text = "AppAdmin");
            
            // Optional: mirror the O365 profile of the impersonated user so
            // forms that read varUser_details also follow the switch
            Set(
                varUser_details,
                Office365Users.UserProfileV2(varTargetEmail)
            );
            
                Refresh(DeskAccessControl);
                ClearCollect(colDeskAccess, DeskAccessControl);
                ClearCollect(colUser_details, Office365Users.UserProfileV2(varTargetEntraID));
                //Set(_selectedUser, Office365Users.UserProfileV2(varTargetEntraID));
                Set(_selectedUser, First(Office365Users.SearchUserV2({searchTerm: Self.Selected.Value}).value));
                ClearCollect(colMenu, []);
                ClearCollect(CollectionRecurrence, []);
            
            // Rebuild the menu with the same Switch you use in OnStart
            Switch(
                true,
                userAccessLevel_text in ["SuperUser","Manager","ServiceChief","ProjectLeader","AppAdmin"],
                ClearCollect(colMenu,
                    { Name: "Home",    Icon: Icon.DetailList,      Page: Dashboard,     Visible: true },
                    { Name: "My Bookings",  Icon: Icon.Person,          Page: MyAppts,       Visible: true },
                    { Name: "Create New",         Icon: Icon.Add,             Page: POCSUPERVISOR, Visible: true },
                    { Name: "Manage Rooms", Icon: Icon.ComputerDesktop, Page: ManageDesks,   Visible: true }
                ),
                userAccessLevel_text = "User",
                ClearCollect(colMenu,
                    { Name: "Home",   Icon: Icon.DetailList, Page: Dashboard,     Visible: true },
                    { Name: "My Bookings", Icon: Icon.Person,     Page: MyAppts,       Visible: true },
                    { Name: "Create New",        Icon: Icon.Add,        Page: POCSUPERVISOR, Visible: true }
                ),
                userAccessLevel_text = "View-only",
                ClearCollect(colMenu,
                    { Name: "Home",   Icon: Icon.DetailList, Page: Dashboard,     Visible: true },
                    { Name: "My Bookings",  Icon: Icon.Person,          Page: MyAppts,       Visible: true }
                ),
                ClearCollect(colMenu, [])
            );
            
            //Select(Button6);
        SelectMultiple: =false
        Size: =12
        ValidationState: =ValidationState.None
        Visible: =User().Email = "Kyle.Coder@va.gov"
        Width: =300
        X: =Label8.X + Label8.Width
        Y: =(Label8.Height / 2) - (Self.Height / 2) - 40
        ZIndex: =2

