                        <a style='text-decoration:none;' href='mailto:Celina.Ceballo@va.gov,Amy.Garner2@va.gov,Brenda.Beben@va.gov?cc=Kyle.Coder@va.gov&subject=I%20am%20having%20an%20issue%20with%20the%20578%20EHRM%20Training%20App'><i><b> Hines EHRM Training Coordinators</b></i></a>.
                        <br>
