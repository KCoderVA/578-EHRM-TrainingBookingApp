Screen2 As screen:
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnHidden: =Timer2.Reset
    OnVisible: |
        =Set(testAccessVariable, Blank());
        Timer2.Start

    Timer2 As timer:
        AutoPause: =false
        AutoStart: =true
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Duration: =10250
        Fill: =App.Theme.Colors.Primary
        Font: =App.Theme.Font
        Height: =70
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =App.Theme.Colors.Darker10
        OnTimerEnd: |-
            =Set(
                isUserAdminSPList,
                !IsBlank(
                    LookUp(
                        DeskAccessControl,
                        Lower(Email_Text) = Lower(User().Email)
                    )
                )
            );
            If(
                isUserAdminSPList = true, 
                ClearCollect(
                    userAccessDemographics,
                    Filter(
                        DeskAccessControl,
                        Lower(Email_Text) = Lower(User().Email)
                    )
                )
            );
            
            If(
                //!IsBlank(DeskAccessControl.'Email_Person'),
                !IsBlank(
                    Filter(
                        DeskAccessControl,
                        Lower(Email_Text) = Lower(User().Email)
                    )
                ),
                Set(testAccessVariable, "True: Source data is found!"),
                Refresh(DeskAccessControl) && Set(testAccessVariable, "False: Source data is not found!") && Reset(Timer2)    
                //Navigate(Dashboard),
                //&& Navigate(Screen2)
            );
            Refresh(DeskAccessControl)
        OnTimerStart: |-
            =ClearCollect(userAccessDemographics, Blank());
            Set(isUserAdminSPList, false);
        PressedBorderColor: =App.Theme.Colors.Darker40
        PressedColor: =Self.Color
        PressedFill: =App.Theme.Colors.Darker40
        Repeat: =true
        Reset: =true
        Width: =280
        X: =40
        Y: =40
        ZIndex: =1

    TextCanvas3 As Text:
        Align: ='TextCanvas.Align'.Center
        AutoHeight: =false
        BorderColor: =
        DisplayMode: =DisplayMode.Edit
        Fill: =
        FontColor: =
        Height: =118
        Size: =36
        Text: |-
            =If(
                testAccessVariable = "True: Source data is found!",
                    "True: Source data is found! Redirecting you back to dashboard!",
                testAccessVariable = "False: Source data is not found!",
                    "False: Source data is not found! Starting timer over again for another refresh attempt...",
                testAccessVariable = Blank(),
                    "Error: The 'testAccessVariable' value is currently 'Blank()'..."
            )
        VerticalAlign: =VerticalAlign.Middle
        Weight: ='TextCanvas.Weight'.Bold
        Width: =1136
        X: =0
        Y: =197
        ZIndex: =2

    TextCanvas3_1 As Text:
        Align: ='TextCanvas.Align'.Center
        AutoHeight: =false
        BorderColor: =
        BorderStyle: =""
        ContentLanguage: =""
        DisplayMode: =DisplayMode.Edit
        Fill: =
        Font: =""
        FontColor: =
        FontItalic: =false
        FontStrikethrough: =false
        FontUnderline: =false
        Height: =255
        Size: =32
        TabIndex: =0
        Text: |-
            ="You will be redirected automatically after data refresh is completed.
            
            This should take no longer than 10 seconds...."
        Tooltip: =""
        VerticalAlign: =""
        Visible: =true
        Weight: ="Regular"
        Width: =516
        Wrap: =true
        X: =320
        Y: =375
        ZIndex: =3

