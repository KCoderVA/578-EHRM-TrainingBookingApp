Screens:
  PDFScreen:
    Properties:
      Height: =794
      Width: =1123
    Children:
      - Icon9:
          Control: Classic/Icon@2.5.0
          Properties:
            Height: =40
            Icon: =Icon.BackArrow
            OnSelect: =Back()
            Width: =48
            X: =20
            Y: =10
      - PdfViewer1:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =PDFPrint
            Height: =794
            ShowControls: =true
            Width: =1123
      - Button7:
          Control: ModernButton@1.0.0
          Properties:
            BorderColor: =Color.White
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =3
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Height: =50
            Icon: ="ArrowCircleLeft"
            OnSelect: =Select(Icon9)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Text: ="Go Back"
            X: =(App.ActiveScreen.Width / 2) - (Self.Width / 2)
            Y: =5
