                              OnSelect: "=// ============================================================\r\n// 2. Find the target user's existing record (if any)\r\n// ============================================================\r\n    Set(\r\n        varDeskAccessControl_record,\r\n        LookUp(colDeskAccess, Lower(DataCardValue35.Text) = varNewEmailToAdd)\r\n    );\r\n    Set(varUserExists, !IsBlank(varDeskAccessControl_record));\r\n\r\n// ============================================================\r\n// 3. If missing, add them as default \"User\", then re-lookup.\r\n//    Only ever writes for the REAL user (never while impersonating,\r\n//    which at OnStart is always the case, but guarded for safety).\r\n// ============================================================\r\n    If(\r\n        !varUserExists,\r\n        Patch(\r\n            DeskAccessControl,\r\n            Defaults(DeskAccessControl),\r\n            {\r\n                Email_Text: DataCardValue35.Text,\r\n                AccessLevel_Text: DataCardValue36.Selected.Value,\r\n                AccessLevel_Choice: { Value: DataCardValue36.Selected.Value },\r\n                'utcNow()_value': Now(),\r\n                AccessStart_dateTime: Now(),\r\n                AccessStop_dateTime: DateAdd(Now(), 6, TimeUnit.Months),\r\n                Approver_Email_Text: varRealEmail,\r\n                'addMinutes(utcNow(),10)': DateAdd(Now(), 10, TimeUnit.Minutes),\r\n                'Created Via': Text(\"Admin added new user to 578 EHRM Training App\")\r\n            }\r\n        );\r\n        Refresh(DeskAccessControl);\r\n        ClearCollect(colDeskAccess, DeskAccessControl);\r\n        Set(\r\n            varDeskAccessControl_record,\r\n            LookUp(colDeskAccess, Email_Text = varTargetEmail)\r\n        )\r\n    ); //SubmitForm(Form3);\r\n    \r\nSet(varNewEmailToAdd, Blank());\r\nSet(varNewAccessLevelToAdd, Blank());\r\nResetForm(Form3);\r\nSet(var_PopUp_AddNewUser, false);\r\nSelect(Icon2);"
                              Text: ="Submit"
                              X: =(Parent.Width / 2) - (Self.Width / 2) + (Self.Width / 2) + 20
                              Y: =(Parent.Height / 2) - (Self.Height / 2)
                  - ctnNewUser_body:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Height: =268
                        Width: =ctnNewUser_header.Width
                        X: =ctnNewUser_header.X
                        Y: =ctnNewUser_header.Y + ctnNewUser_header.Height
                      Children:
                        - Form3:
                            Control: Form@2.4.4
                            Variant: Modern
                            Layout: Vertical
                            Properties:
                              DataSource: =DeskAccessControl
                              DefaultMode: =FormMode.New
                              Height: |-
                                =Max(
                                    Email_Text_DataCard3.Height + AccessLevel_Choice_DataCard4.Height + 20,
                                    125
                                )
                              Width: =Parent.Width
                            Children:
                              - Email_Text_DataCard3:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ModernTextualEdit
                                  Properties:
                                    DataField: ="Email_Text"
                                    Default: |-
                                      =If(
                                          IsBlankOrError(varNewEmailToAdd),
                                          ThisItem.Email_Text,
                                          varNewEmailToAdd
                                      )
                                    DisplayName: =DataSourceInfo([@DeskAccessControl],DataSourceInfo.DisplayName,Email_Text)
                                    MaxLength: =DataSourceInfo([@DeskAccessControl], DataSourceInfo.MaxLength, Email_Text)
                                    Required: =true
                                    Update: =DataCardValue35.Text
                                    X: =0
                                    Y: =0
                                  Children:
                                    - DataCardKey42:
                                        Control: ModernText@1.0.0
                                        MetadataKey: FieldName
                                        Properties:
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Italic: =true
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =22
                                          Text: ="What is the new user's email address?"
                                          Width: =Parent.Width - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =10
                                    - DataCardValue35:
                                        Control: ModernTextInput@1.1.1
                                        MetadataKey: FieldValue
                                        Properties:
                                          AccessibleLabel: =Parent.DisplayName
                                          Default: =varNewEmailToAdd //Parent.Default
                                          DisplayMode: =Parent.DisplayMode
                                          Height: =0
                                          MaxLength: =Parent.MaxLength
                                          Placeholder: ="Enter email address..."
                                          Required: =Parent.Required
                                          ValidationState: =If(IsBlank(Parent.Error), ValidationState.None, ValidationState.Error)
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =DataCardKey42.Y + DataCardKey42.Height + 4
                                    - ErrorMessage41:
                                        Control: ModernText@1.0.0
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          Height: =30
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =DataCardValue35.Y + DataCardValue35.Height
                                    - StarVisible41:
                                        Control: ModernText@1.0.0
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          Color: =Color.Red
                                          Height: =DataCardKey42.Height
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Text: ="*"
                                          Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =30
                                          Y: =DataCardKey42.Y
                                    - ComboBox1:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          Default: |-
                                            ={
                                                Value: Parent.Default
                                            }
                                          DisplayFields: =["DisplayName","Mail"]
                                          InputTextPlaceholder: ="Search for a user..."
                                          Items: |-
                                            =Office365Users.SearchUserV2(
                                                {
                                                    searchTerm: Self.SearchText,
                                                    top: 15
                                                }
                                            ).value
                                          OnChange: =Set(varNewEmailToAdd, Self.Selected.Mail);
                                          OnSelect: =Set(varNewEmailToAdd, Self.Selected.Mail);
                                          SearchFields: |+
                                            =["DisplayName","Mail", "Surname", "GivenName"]
                                          SelectMultiple: =false
                                          X: =DataCardKey42.X + 25
                                          Y: =DataCardValue35.Y + DataCardValue35.Height
                              - AccessLevel_Choice_DataCard4:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ModernComboBoxEdit
                                  Properties:
                                    DataField: ="AccessLevel_Choice"
                                    Default: =ThisItem.AccessLevel_Choice
                                    DisplayName: =DataSourceInfo([@DeskAccessControl],DataSourceInfo.DisplayName,AccessLevel_Choice)
                                    Height: |-
                                      =If(
                                          IsBlankOrError(DataCardValue35.Text),
                                          0,
                                          125
                                      )
                                    Required: =true
                                    Update: =DataCardValue36.Selected
                                    X: =0
                                    Y: =1
                                  Children:
                                    - DataCardKey43:
                                        Control: ModernText@1.0.0
                                        MetadataKey: FieldName
                                        Properties:
                                          FontWeight: =FontWeight.Bold
                                          Height: =40
                                          Italic: =true
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =22
                                          Text: |-
                                            =//"Which level of access should " & LookUp(Office365Users.SearchUser(ComboBox1.Selected), !IsBlankOrError(GivenName), GivenName) & "be given?"
                                            "Which level of access should this user be given?"
                                          Width: =Parent.Width - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =10
                                    - DataCardValue36:
                                        Control: ModernCombobox@1.1.1
                                        MetadataKey: FieldValue
                                        Properties:
                                          AccessibleLabel: =Parent.DisplayName
                                          DefaultSelectedItems: =[ComboBox1_1.Selected]  //[Parent.Default]
                                          DisplayMode: =Parent.DisplayMode
                                          Height: =0
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices([@DeskAccessControl].AccessLevel_Choice)
                                          SelectMultiple: =false
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =DataCardKey43.Y + DataCardKey43.Height + 4
                                    - ErrorMessage42:
                                        Control: ModernText@1.0.0
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          Height: =30
                                          Size: =14
                                          Text: =Parent.Error
                                          Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =DataCardValue36.Y + DataCardValue36.Height
                                    - StarVisible42:
                                        Control: ModernText@1.0.0
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          Color: =Color.Red
                                          Height: =DataCardKey43.Height
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Text: ="*"
                                          Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =30
                                          Y: =DataCardKey43.Y
                                    - ComboBox1_1:
                                        Control: Classic/ComboBox@2.4.0
                                        Properties:
                                          Default: |-
                                            ={
                                                Value: Parent.Default
                                            }
                                          DisplayFields: =["Value"]
                                          InputTextPlaceholder: ="Pick an access level..."
                                          Items: =Choices([@DeskAccessControl].AccessLevel_Choice)
                                          OnChange: =Set(varNewAccessLevelToAdd, Self.Selected.Value);
                                          OnSelect: =Set(varNewAccessLevelToAdd, Self.Selected.Value);
                                          SearchFields: =["Value"]
                                          SelectMultiple: =false
                                          X: =DataCardKey42.X + 25
                                          Y: =DataCardValue36.Y + DataCardValue36.Height
                  - ctnNewUser_header:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Height: =50
                        Width: =Parent.Width - (Parent.BorderThickness * 2)
                        X: =Parent.BorderThickness
                        Y: =Parent.BorderThickness
                      Children:
                        - Label2:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Bold
                              Height: =50
                              Text: ="Manually add a new user..."
                              Width: =Parent.Width / 1.5
                        - iconAddDesk_2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Add Desk"
                              BorderColor: =RGBA(255, 255, 255, 0)
                              BorderThickness: =5
                              Color: =App.Theme.Colors.Darker40
                              Height: =Parent.Height - 10
                              HoverBorderColor: =App.Theme.Colors.Lighter50
                              HoverColor: =ColorFade(Self.HoverFill, 95%)
                              HoverFill: =App.Theme.Colors.Darker40
                              Icon: =Icon.CancelBadge
                              OnSelect: |-
                                =Set(var_PopUp_AddNewUser, false);
                                ResetForm(Form3);
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              TabIndex: =3
                              Width: =Self.Height
                              X: =Parent.Width - Self.Width - 5
                              Y: =5
