        Color: =RGBA(0, 0, 0, 1)
        Default: |-
            =If(
                (!IsBlankOrError(varSelectedReservation.reservationComments_multilinetext) || !IsBlankOrError(varSelectedReservation.reservationJustification_multilinetext)),(varSelectedReservation.reservationComments_multilinetext & "
