                FontWeight.Lighter,
                FontWeight.Bold
            )
        Height: |-
            =If(
                (IsBlankOrError(varSelectedReservation.reservationComments_multilinetext) || IsBlankOrError(varSelectedReservation.reservationJustification_multilinetext)),
                70,
                135
            )
