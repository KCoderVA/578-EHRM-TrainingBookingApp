        HtmlText: |-
            ="<div style='font-family:Segoe UI, Arial, sans-serif; color:#1b1b1b; padding:10px; font-size:14px; line-height:1.45;'>
            
                <h2 style='color:#005ea2; margin:0 0 2px 0;'>EHRM Learning Lab &mdash; Quick Start Guide</h2>
                <p style='margin:0 0 14px 0; color:#3d3d3d;'>Registering for a training session takes about a minute. Follow the steps below. You can tap <b>Help</b> at any time to come back to this guide.</p>
            
                <div style='background:#eef5fb; border-left:4px solid #005ea2; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#005ea2; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>1</span>
                <b style='color:#005ea2;'>From the app's 'HOME' screen/dashboard:</b><br>
                This is the app's landing page & home screen. To start a new registration, tap the <b>+ NEW</b> button to begin a new request...
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>2</span>
                <b style='color:#005ea2;'>Once you are on the 'Create a new reservation...' screen:</b><br>
                Search & select the person who needs training, &mdash; either <b>yourself</b>, or a <b>staff member you support</b> &mdash;, Then be sure that the <b>Manager</b> shown and <b>Service Line</b> boxes auto-populate correctly depending on the person you selected. Then, you can use the drop-down input to select the <b>training type</b> for your selected user...
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>3</span>
                <b style='color:#005ea2;'>Click the <b>CONTINUE</b> button</b><br>
                Once your employee, manager, service line, and training type selections all look correct, click the <b>'CONTINUE'</b> to continue.
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>4</span>
                <b style='color:#005ea2;'>Choose the details</b><br>
                Use the drop-downs to set the <b>Role</b>, <b>Scenario</b> (class), <b>Date &amp; Time</b>, and <b>Location</b> for the session. As you make a selection in each of the drop-down boxes, the next question will become visible & will automatically filter according to your previous selections.
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>5</span>
                <b style='color:#005ea2;'>Click the next <b>CONTINUE</b> button</b><br>
                Tap <b>'CONTINUE'</b> button (which has now become selectable), to move on to the agreement page.
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>6</span>
                <b style='color:#005ea2;'>Accept the terms</b><br>
                Read the <b>Terms &amp; Conditions</b>, then tap <b>Accept</b> to confirm.
                </div>
            
                <div style='background:#f4f8fc; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#4f9ad6; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>7</span>
                <b style='color:#005ea2;'>Review before you submit</b><br>
                Check everything on the summary. Need to change something? Tap <b>Back</b> to fix it &mdash; nothing is saved yet.
                </div>
            
                <div style='background:#eef7ee; border-left:4px solid #2e8540; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#2e8540; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>8</span>
                <b style='color:#2e8540;'>Submit</b><br>
                When everything is correct, tap <b>Submit</b> to book the session.
                </div>
            
                <div style='background:#eef7ee; border-left:4px solid #2e8540; padding:8px 12px; margin:0 0 8px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#2e8540; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>9</span>
                <b style='color:#2e8540;'>Confirmation</b><br>
                You will see a <b>success screen</b>. A <b>calendar invite</b> and a <b>confirmation email</b> are sent to you automatically.
                </div>
            
                <div style='background:#eef7ee; border-left:4px solid #2e8540; padding:8px 12px; margin:0 0 12px 0; border-radius:4px;'>
                <span style='display:inline-block; background:#2e8540; color:#ffffff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-weight:bold; margin-right:6px;'>10</span>
                <b style='color:#2e8540;'>Return to the Dashboard</b><br>
                Tap <b>Return to Dashboard</b> to go back to the home screen. You are all set!
                </div>
            
                <h3 style='color:#005ea2; margin:14px 0 4px 0;'>Handy tips</h3>
                <ul style='margin:0 0 8px 0; padding-left:18px;'>
                <li><b>My Items</b> &mdash; view, review, or cancel your existing reservations.</li>
                <li><b>Menu bar</b> &mdash; the buttons along the edge switch between the main screens.</li>
                <li><b>Made a mistake?</b> Use the <b>Back</b> button any time <i>before</i> you submit.</li>
                <li><b>Need help?</b> Contact your training POC or the app administrator.</li>
                </ul>
            
                <p style='margin:10px 0 0 0; font-size:12px; color:#6b6b6b;'>EHRM Training &amp; Booking App &middot; Edward Hines Jr. VA Hospital (Station 578) &middot; VISN 12</p>
            
                </div>"
