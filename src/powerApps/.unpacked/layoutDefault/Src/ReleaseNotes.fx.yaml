    htmlText_releaseNotes As htmlViewer:
        Height: |-
            =//640
            Parent.Height - Image2_10.Y - Image2_10.Height - 25
        HtmlText: |
            =/*
            # ============================================================================
            # PROPOSED Canvas App "Release Notes" — FULL CHANGELOG edition  (draft for a future v1.1.0)
            # ----------------------------------------------------------------------------
            # Author: Kyle J. Coder (github.com/KCoderVA) | Apache-2.0 (see root LICENSE)
            #
            # WHAT THIS IS:
            #   ALTERNATIVE #2 to v1.1.0_proposedUpdatedReleaseNotes.yaml. Instead of a short,
            #   end-user, step-by-step quick-start guide, this stand-alone `htmlViewer` control
            #   renders the COMPLETE, verbose project CHANGELOG.md — every version entry from
            #   [Unreleased] back to [0.0.1] — as richly-formatted HTML, for use on the in-app
            #   `ReleaseNotes` (Help) screen.
            #
            #   Source of truth: the repository-root CHANGELOG.md (Keep a Changelog format,
            #   Semantic Versioning). This is a POINT-IN-TIME rendering — re-sync it whenever
            #   CHANGELOG.md changes. This file lives in local/ (git-ignored) for review only;
            #   it is NOT yet wired into the live app.
            #
            # HOW TO USE:
            #   1. In Power Apps Studio, open the ReleaseNotes (Help) screen.
            #   2. Insert an HTML text control (or select the existing htmlViewer).
            #   3. Copy the HtmlText formula below into its HtmlText property.
            #   4. Adjust Width/Height/X/Y/Fill to fit the screen. The content is long, so
            #      place the control inside a scrollable container (or keep AutoHeight = true
            #      inside a vertical-scroll gallery/container).
            #
            # RENDERING NOTES:
            #   * This version uses ONE <style> block (CSS classes) instead of repeating inline
            #     styles on hundreds of list items, to keep the (already very long) formula
            #     manageable. The Power Apps HTML text control supports <style> blocks. If your
            #     tenant's control ever fails to honor it, the markup still degrades to clean,
            #     readable structured HTML; you can then fall back to inline styles as done in
            #     the companion quick-start alternative file.
            #   * Literal double-quotes from the changelog text are encoded as &quot; so they
            #     do not terminate the Power Apps string. Angle brackets, ampersands, arrows,
            #     and dashes are HTML-encoded (&lt; &gt; &amp; &rarr; &mdash; &ndash;).
            #   * Color key: Added = green, Changed = blue, Fixed = amber, Removed = red,
            #     Notes = gray, Validation = teal; version banners = VA blue (gray = Unreleased).
            #   * The source CHANGELOG.md is missing the "## [0.3.6]" heading for one entry
            #     (its content sits un-headed between [0.3.7] and [0.3.5]); it is rendered here
            #     under a [0.3.6] banner so the document does not appear broken.
            # ============================================================================
            htmlChangelogViewer As htmlViewer:
              # --- Suggested layout properties (adjust to your screen) ---
              AutoHeight: =true
              Width: =Parent.Width - 40
              X: =20
              Y: =20
              Fill: =RGBA(255, 255, 255, 1)
              # Font/size/color are controlled by the inline <style> block in HtmlText above.
              # NOTE: content is long — host this control inside a vertically scrollable
              # container (or a single-column gallery) so users can scroll the full history.
              HtmlText: |
                =*/
                "<style>
                .cl, .cl div, .cl p, .cl li, .cl h1, .cl h2, .cl h3 { font-family:'Segoe UI', Arial, sans-serif; }
                .cl { color:#1b1b1b; padding:10px; font-size:13px; line-height:1.45; }
                .cl h1.title { color:#005ea2; font-size:20px; margin:0 0 4px 0; }
                .cl p.intro { color:#3d3d3d; margin:0 0 6px 0; }
                .cl p.meta { color:#6b6b6b; font-size:12px; margin:0 0 14px 0; }
                .cl h2.ver { color:#ffffff; background:#005ea2; padding:6px 10px; border-radius:4px; margin:20px 0 8px 0; font-size:16px; }
                .cl h2.ver .date { font-weight:normal; font-size:13px; opacity:0.9; }
                .cl h2.unrel { background:#6b6b6b; }
                .cl h2.major { background:#2e8540; }
                .cl div.note { background:#eef5fb; border-left:4px solid #4f9ad6; padding:8px 12px; margin:0 0 10px 0; border-radius:4px; font-style:italic; color:#3d3d3d; }
                .cl h3.sec { margin:12px 0 2px 0; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; }
                .cl h3.added { color:#2e8540; }
                .cl h3.changed { color:#005ea2; }
                .cl h3.fixed { color:#b8860b; }
                .cl h3.removed { color:#b50909; }
                .cl h3.notes { color:#6b6b6b; }
                .cl h3.validation { color:#1a7f7f; }
                .cl ul { margin:2px 0 10px 0; padding-left:20px; }
                .cl ul ul { margin:3px 0 3px 0; }
                .cl li { margin:3px 0; }
                .cl code { background:#f0f0f0; padding:0 3px; border-radius:3px; font-family:Consolas,'Courier New',monospace; font-size:12px; color:#333333; }
                .cl a { color:#005ea2; }
                .cl hr { border:0; border-top:1px solid #d9d9d9; margin:16px 0; }
                </style>
            
                <div class='cl'>
            
                <h1 class='title'>EHRM Training &amp; Booking App &mdash; Full Changelog</h1>
                <p class='intro'>All notable changes to the <b>EHRM Training &amp; Booking App</b> repository are documented here. The format is based on <a href='https://keepachangelog.com/en/1.0.0/'>Keep a Changelog</a>, and the project follows <a href='https://semver.org/spec/v2.0.0.html'>Semantic Versioning</a> for the <b>project-wide release version</b> (<code>MAJOR.MINOR.PATCH</code>).</p>
                <p class='meta'>Component versions (Canvas app, each flow, SharePoint assets, etc.) are tracked in each component README under <code>src/</code>.</p>
            
                <hr/>
            
                <h2 class='ver major'>[1.0.12] <span class='date'>&mdash; 2026-08-25</span></h2>
                <div class='note'><b>First production / go-live release line.</b> The app went live as v1.0.0; this documents the public <b>v1.0.12</b> milestone (Canvas app v0.12.2 &rarr; v1.0.12). Project version jumps <code>0.12.4 &rarr; 1.0.12</code> (the interim 0.12.4 release-note stubs were never shipped). Full technical detail is in the per-component <code>v1.0.12_differenceAnalysis.md</code> files under <code>src/</code>.</div>
                <h3 class='sec added'>Added</h3>
                <ul>
                <li><b>Canvas app</b> &mdash; single-student <b>proxy registration</b> (a POC/supervisor can register a student on their behalf); <b>Learning Labs Library</b> class/scenario picker (new read-only SharePoint document library on <code>vacoehrmioeue/Sandbox</code>); printable <b>Power BI <code>Screen1</code></b> (GOV-cloud embed); <b>series-vs-single</b> reservation cancellation; <b>bulk SuperUser autosync</b> in <code>ManageUsers</code>.</li>
                <li><b>Power Automate</b> &mdash; new <b><code>CreateBackups</code></b> flow (<code>5bf4e999&hellip;</code>): Outlook-triggered on the confirmation-email subject <code>[REGISTERED] EHRM Learning Lab Training -</code>, parses the email and writes a backup reservation record.</li>
                <li><b>Power Automate</b> &mdash; <code>SendReminders</code> now also posts <b>Microsoft Teams adaptive cards</b> (in addition to email).</li>
                <li><b>SharePoint</b> &mdash; national EHRM <b>Sandbox Resource Center</b> reference lists added as tracked <code>.url</code> shortcuts (EHRM Roles, Scenario, Service Line, Learning Lab Sessions, Learning Lab Signups, Scenario Workflows) plus the Learning Labs Library; new <code>library/</code> and <code>events/</code> areas.</li>
                <li><b>Analytics</b> &mdash; new <b><code>SuperUserDashboard-Final</code></b> Power BI report (WIP) and new <b><code>tms/</code></b> TMS-completion data-staging folder.</li>
                <li><b>Docs</b> &mdash; content READMEs and verbose <code>v1.0.12_differenceAnalysis.md</code> for every component (powerApps, powerAutomate, sharePoint, analytics).</li>
                </ul>
                <h3 class='sec changed'>Changed</h3>
                <ul>
                <li><b><code>VERSION</code></b> &mdash; <code>0.12.4 &rarr; 1.0.12</code> (first 1.x / production line).</li>
                <li><b>Canvas app</b> &mdash; RBAC hardened to <b>default-to-<code>User</code>-first</b> (self-provisions an access row with a 6-month window; eliminates the new-user <code>AccessDenied</code> race); <code>Learning Lab Sessions</code> scoped to <code>Facility = Hines</code>; partial <b>classic &rarr; modern control</b> migration (host control enabled); audit trails now use <code>varRealEmail</code>.</li>
                <li><b><code>SendReminders</code></b> &mdash; trigger polling reduced 1 min &rarr; 5 min; email send gated behind a <code>CreatedBy</code> rollout condition; actions reordered.</li>
                <li><b>SharePoint</b> &mdash; <code>list/</code> reorganized into a <code>nationalEHRM/sandbox/</code> namespace; <code>schedule/</code> &rarr; <code>masterScheduleList/</code>; added <code>superUserList/</code> and <code>backupList_DeskReservations/</code>.</li>
                <li><b><code>src/solution.xml</code></b> &mdash; version &rarr; 1.0.12; description refreshed; <code>SendReminders</code> + <code>CreateBackups</code> added to root components (regenerate on next <code>pac solution export</code>).</li>
                <li>Component READMEs (powerApps, powerAutomate, sharePoint, analytics, powerBI) rewritten/updated for the import audience.</li>
                </ul>
                <h3 class='sec removed'>Removed</h3>
                <ul>
                <li><b>Canvas app</b> &mdash; deleted two dead Microsoft-template screens (<code>CreateMeeting</code>, <code>Screen3</code>); screen count 21 &rarr; 20.</li>
                <li><b>Security</b> &mdash; removed the hard-coded developer <b>impersonation backdoor</b> in <code>App.OnStart</code> (it previously spoofed one developer's identity to another user).</li>
                </ul>
                <h3 class='sec fixed'>Fixed</h3>
                <ul>
                <li><b>Canvas app</b> &mdash; binding errors driven <b>120 &rarr; 0</b>: pervasive <code>IsBlankOrError()</code> guards; <code>Tabs</code>/<code>Tabs_3</code> empty-menu <code>TemplateSize</code> guard; <code>Tabs_3</code> width <code>&amp;</code> &rarr; <code>*</code> bug; <code>Calendar</code> invalid hex <code>#0707077</code> &rarr; <code>#070707</code>.</li>
                </ul>
                <h3 class='sec notes'>Notes</h3>
                <ul>
                <li>Public release is <b>v1.0.12</b>; the <code>.msapp</code> and flow <code>.zip</code> artifacts are named <code>v1.0.12_*</code> to match. <i>(The <code>.msapp</code> binary's internal build number aligns fully on the next export from the editor at version 1.0.12.)</i></li>
                <li>A ~6.6 GB <code>OneDrive_1_8-21-2026.zip</code> sits in <code>src/sharePoint/library/.../learningLabLibrary/local/</code> (git-ignored; intentionally retained as developer-only content).</li>
                <li><code>src/sharePoint/searchConfig/SearchConfiguration.xml</code> restored (valid baseline search-schema export).</li>
                <li>Assets: no tracked/public changes this cycle.</li>
                </ul>
            
                <hr/>
            
                <h2 class='ver'>[0.12.3] <span class='date'>&mdash; 2026-08-20</span></h2>
                <div class='note'><b>Power Automate release:</b> introduces the new <code>SendReminders</code> (&quot;Send Email Reminder&quot;) flow and refreshes the <code>AppUserList</code> flow export. No Canvas app changes &mdash; the Canvas app component remains <b>v0.12.2</b>.</div>
                <h3 class='sec added'>Added</h3>
                <ul>
                <li><b>New Power Automate flow <code>SendReminders</code> (&quot;Send Email Reminder&quot;)</b> in <code>src/powerAutomate/SendReminders/</code>:
                  <ul>
                  <li>Unpacked source under <code>.unpacked/Microsoft.Flow/flows/ecd1d899-5df4-4795-a98b-f1a1b55ee837/</code>.</li>
                  <li>Adaptive-card email design at <code>adaptiveCards/v0.12.4_flowSendReminders_adaptiveCard.json</code> &mdash; sends a &quot;You are scheduled for EHRM Learning Lab training!&quot; confirmation/reminder pulling name, email, role, scheduled-by, and access window from <code>DeskAccessControl</code>.</li>
                  <li>Packed export <code>.zip/v0.12.2_578EHRMTrainingApp_SendEmailReminder_20260812115737.zip</code> (local-only; <code>.zip</code> is git-ignored).</li>
                  <li>Directly addresses the previously-tracked roadmap item to build the reminder flow.</li>
                  </ul>
                </li>
                <li><b><code>assets/images/screenshots/2026.08.12_confirmationEmailChangeRequest.png</code></b> &mdash; screenshot of the <code>AppUserList</code> access-change confirmation email.</li>
                </ul>
                <h3 class='sec changed'>Changed</h3>
                <ul>
                <li><b><code>VERSION</code></b> &mdash; <code>0.12.2 -&gt; 0.12.3</code>.</li>
                <li><b><code>src/powerAutomate/AppUserList/</code></b> &mdash; flow re-exported (connection/API/manifest map refresh); export <code>.json</code> renamed with the <code>v0.12.2_</code> project-version prefix (<code>578EHRMTrainingApp_AppUserList.json -&gt; v0.12.2_578EHRMTrainingApp_AppUserList.json</code>).</li>
                <li><b><code>src/powerAutomate/README.md</code></b> &mdash; documented the new <code>SendReminders</code> flow and the <code>AppUserList</code> re-export; added a component-version table.</li>
                <li><b><code>README.md</code></b> &mdash; project badge and current-version references updated to v0.12.3; Power Automate component list now includes <code>SendReminders</code>.</li>
                <li><b><code>docs/PROJECT_STATUS.md</code></b> &mdash; status summary, component versions, release history, and roadmap updated for the new reminder flow.</li>
                </ul>
                <h3 class='sec notes'>Notes</h3>
                <ul>
                <li>Canvas app component unchanged (remains <b>v0.12.2</b>); this is a Power Automate-only patch.</li>
                <li>These <code>src/powerAutomate/**</code> changes were intentionally excluded from the v0.12.2 release and are landed here.</li>
                <li>The superseded older adaptive-card design <code>v0.12.2_flowSendReminders_adaptiveCard.json</code> was moved to local-only <code>archive/</code> (git-ignored).</li>
                </ul>
            
                <hr/>
            
                <h2 class='ver'>[0.12.2] <span class='date'>&mdash; 2026-08-12</span></h2>
                <div class='note'><b>Go-live readiness release:</b> this version advances the project-wide release line to <code>0.12.2</code> and aligns the Canvas app, solution manifest, and release artifacts around a single semantic baseline for imminent production deployment.</div>
                <h3 class='sec added'>Added</h3>
                <ul>
                <li><b>Canvas analysis documentation (new v0.12.2 set) in <code>src/powerApps/</code>:</b>
                  <ul>
                  <li><code>v0.12.2_diffAnalysis.md</code></li>
                  <li><code>v0.12.2_changeSummary.md</code></li>
                  <li><code>v0.12.2_knownIssues.md</code></li>
                  <li><code>v0.12.2_recommendations.md</code></li>
