                <h2 class='ver'>[0.8.16] <span class='date'>&mdash; 2026-07-28</span></h2>
                <div class='note'><b>Version alignment:</b> With this release the project-wide version jumps from <code>0.3.8</code> to <code>0.8.16</code> to bring the repository release line onto the Canvas app's independently-advancing <code>0.8.x</code> version series. The Canvas app component advances <b>v0.3.4 &rarr; v0.8.14</b> (the app-internal version strings still show minor drift &mdash; <code>App.OnStart</code> sets <code>varRepoVersion &quot;0.8.12&quot;</code> and the Dashboard timer shows the prior stamp &mdash; tracked as a follow-up). This supersedes the note in the <code>[0.3.8]</code> entry below, which stated the Canvas app &quot;remains v0.3.4&quot; and that the v0.8.14 app had &quot;not yet been exported/unpacked.&quot;</div>
                <h3 class='sec added'>Added</h3>
                <ul>
                <li><b>Canvas app v0.8.14 unpacked source</b> &mdash; the substantially updated Canvas app was exported and unpacked into <code>src/powerApps/.unpacked/</code> (package <code>src/powerApps/.msapp/v0.8.14_578EHRMTrainingApp.msapp</code>, tracked via <code>.gitignore</code> <code>!*.msapp</code>, replacing the prior v0.3.4 package). This is the largest functional advance since the baseline:
                  <ul>
                  <li><b>App-wide role-based access control (RBAC) engine</b> &mdash; <code>App.OnStart</code> grew from a 1-line version stub into a full RBAC + auto-provisioning + impersonation engine. Eight access tiers (<code>AccessDenied</code> &rarr; <code>View-only</code> &rarr; <code>User</code> &rarr; <code>SuperUser</code> &rarr; <code>Manager</code> &rarr; <code>ServiceChief</code> &rarr; <code>ProjectLeader</code> &rarr; <code>AppAdmin</code>) are read live per-user from <code>DeskAccessControl</code> and wired into the navigation menu (<code>colMenu</code>, moved out of <code>Dashboard.OnVisible</code>), Dashboard messaging, calendar <code>DisplayMode</code>/<code>Items</code> filters, and admin-only controls.</li>
                  <li><b>Impersonation (&quot;act as another user&quot;)</b> &mdash; admins get a hidden Dashboard combobox that re-renders the entire app as any selected user (support/troubleshooting and booking on behalf of others); the real signed-in identity is captured separately and auto-provisioning never writes while impersonating.</li>
                  <li><b>Zero-touch user onboarding</b> &mdash; first-launch users with no <code>DeskAccessControl</code> row are auto-provisioned at the default <code>&quot;User&quot;</code> level (Entra ID, timestamps, manager email via <code>Office365Users.Manager</code>).</li>
                  <li><b>Training Class/Session Picker</b> &mdash; new <code>ctn_PopUp_ClassPicker</code> popup on <code>POCSUPERVISOR</code> (Scenario &rarr; Role &rarr; Date/Time session &rarr; Location), with a deep-link into the SharePoint Learning Lab Workbook library and selections echoed on the Confirm screen.</li>
                  <li><b>New <code>alt_ManageDesks</code> screen</b> &mdash; modern responsive CRUD console for the <code>Desks</code> list, staged alongside legacy <code>ManageDesks</code> ahead of a planned cutover (22 screens total).</li>
                  <li><b>Dashboard redesign</b> &mdash; dark-navy theme, mascot banner, role-aware welcome / &quot;ACCESS DENIED&quot; / &quot;VIEW ONLY&quot; messaging, author/version timer.</li>
                  <li><b>Assets &amp; components</b> &mdash; image assets grew from 6 &rarr; 38; new <code>Tabs_altColor</code> component.</li>
                  <li>Full file-by-file structural/behavioral diff with per-screen rationale: <b><code>src/powerApps/v0.8.14_recentChangesSummary.md</code></b> (new).</li>
                  </ul>
                </li>
