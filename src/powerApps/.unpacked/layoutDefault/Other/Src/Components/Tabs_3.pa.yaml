ComponentDefinitions:
  Tabs_3:
    DefinitionType: CanvasComponent
    CustomProperties:
      HomePage:
        PropertyKind: Input
        DisplayName: HomePage
        Description: The Home Page URL
        DataType: Screen
        Default: =Dashboard//App.ActiveScreen
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Items for the tabs
        DataType: Table
        Default: =colMenu
      darkMode:
        PropertyKind: Input
        DisplayName: darkMode
        Description: A custom property
        DataType: Boolean
        Default: |-
          =If(
              App.ActiveScreen.Name = "Dashboard",
              true,
              App.ActiveScreen.Name <> "Dashboard",
              false
          )
      templateHeight:
        PropertyKind: Input
        DisplayName: templateHeight
        Description: A custom property
        DataType: Number
        Default: =Tabs_3.Height - 20
      templateWidth:
        PropertyKind: Input
        DisplayName: templateWidth
        Description: A custom property
        DataType: Number
        Default: =Tabs_3.Width / CountRows(Tabs_3.Items)
    Properties:
      Height: |+
        =120
      Width: =660
    Children:
      - Rectangle12:
          Control: Rectangle@2.3.0
          Properties:
            DisplayMode: =DisplayMode.Disabled
            Fill: |-
              =If(
                  App.ActiveScreen.Name = "Dashboard" || Tabs_3.darkMode = true,
                  RGBA(0, 0, 0, 0),
                  App.ActiveScreen.Name <> "Dashboard" && Tabs_3.darkMode = false,
                  RGBA(0, 0, 0, 1)
              )
            Height: =Parent.Height
            Visible: =false
            Width: =Parent.Width
      - Gallery4_1:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            AccessibleLabel: ="Footer tabs"
            BorderColor: =RGBA(9, 33, 98, 1)
            DelayItemLoading: =false
            Fill: |-
              =If(
                  App.ActiveScreen.Name = "Dashboard" || Tabs_3.darkMode = true,
                  RGBA(9, 33, 98, 0.2),
                  App.ActiveScreen.Name <> "Dashboard" && Tabs_3.darkMode = false,
                  RGBA(9, 33, 98, 0.4)
              )
            FocusedBorderThickness: =0
            Height: =Parent.Height - Rectangle1_1.Height
            Items: =Tabs_3.Items
            LoadingSpinner: =LoadingSpinner.None
            LoadingSpinnerColor: =Gallery4_1.BorderColor
            OnSelect: =Navigate(ThisItem.Page)
            ShowScrollbar: =false
            TabIndex: =1
            TemplatePadding: =1
            TemplateSize: |-
              =If(
                  !IsBlankOrError(CountRows(Tabs_3.Items)),
                      Tabs_3.Width / CountRows(Tabs_3.Items),
                  IsBlankOrError(CountRows(Tabs_3.Items)),
                      Tabs_3.Width / 6,
                  101
              )
              //Tabs_3.templateWidth - 2


              /*
              If(
                  !IsBlankOrError(CountRows(Tabs.Items)),
                      Tabs.Width / CountRows(Tabs.Items),
                  IsBlankOrError(CountRows(Tabs.Items)),
                      Parent.Width / 6,
                  //!IsBlankOrError(CountRows(colMenu),
                  //    Tabs.Width / CountRows(colMenu)),
                  101
              )
              */
            Width: =CountRows(Tabs_3.Items) * 110
            Y: =Rectangle1_1.Height + Rectangle1_1.Y
          Children:
            - Icon10_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledFill: =Icon10_1.Fill
                  Fill: =RGBA(255, 255, 255, 0)
                  FocusedBorderColor: =Icon10_1.BorderColor
                  Height: =Tabs_3.templateHeight - Label10_1.Height + 10
                  HoverBorderColor: =ColorFade(Icon10_1.BorderColor, 20%)
                  HoverColor: =ColorFade(Icon10_1.Color, 20%)
                  HoverFill: =Icon10_1.Fill
                  Icon: =ThisItem.Icon
                  OnSelect: =Select(Parent);Navigate(ThisItem.Page)
                  PressedBorderColor: =ColorFade(Icon10_1.BorderColor, -20%)
                  PressedColor: =ColorFade(Icon10_1.Color, -20%)
                  PressedFill: =Icon10_1.Fill
                  Width: =Self.Height
                  X: =(Parent.TemplateWidth / 2) - (Self.Width / 2)
                  Y: =2
            - Button8_1:
                Control: Classic/Button@2.2.0
                Properties:
                  AutoDisableOnSelect: =false
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =6
                  Color: =RGBA(9, 33, 98, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 4
                  HoverBorderColor: |-
                    =If(
                        App.ActiveScreen.Name = "Dashboard" || Tabs_3.darkMode = true,
                        Color.White,
                        App.ActiveScreen.Name <> "Dashboard" && Tabs_3.darkMode = false,
                        RGBA(9, 33, 98, 1)
                    )
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: |-
                    =If(
                        App.ActiveScreen.Name = "Dashboard",
                        ColorFade(RGBA(0, 131, 190, .8),50%),
                        App.ActiveScreen.Name <> "Dashboard",
                        RGBA(255, 255, 255, .5)
                    )
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =15
                  RadiusBottomRight: =15
                  RadiusTopLeft: =15
                  RadiusTopRight: =15
                  Text: =
                  Width: =Parent.TemplateWidth
                  X: =2
                  Y: =2
            - Label10_1:
                Control: Label@2.5.1
                Properties:
                  Align: =LayoutAlignItems.Center
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(255, 255, 255, 0)
                  FocusedBorderColor: =Label10_1.BorderColor
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =Tabs_3.templateHeight / 4
                  HoverBorderColor: =Label10_1.BorderColor
                  HoverColor: =Label10_1.Color
                  HoverFill: =Label10_1.Fill
                  OnSelect: =Select(Parent);Navigate(ThisItem.Page)
                  PressedBorderColor: =Label10_1.BorderColor
                  PressedColor: =Label10_1.Color
                  PressedFill: =Label10_1.Fill
                  Size: =Self.Height / 2
                  Text: =ThisItem.Name
                  Width: =Parent.TemplateWidth
                  X: =(Parent.TemplateWidth / 2) - (Self.Width / 2)
                  Y: =Parent.TemplateHeight - Self.Height
      - Rectangle1_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(128, 128, 128, 1)
            Fill: =RGBA(214, 221, 224, 1)
            Height: =3
            Width: =Tabs_3.Width
